<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B7A4B">
<meta name="description" content="Privates Grow-Journal fuer den Eigenanbau">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeltbuch">
<title>Zeltbuch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface2:#F6F8F4; --ink:#17211A; --muted:#5B6860; --line:#E0E6DC; --line2:#C9D2C4;
  --accent:#2B7A4B; --accent-ink:#FFFFFF; --accent-soft:#E2F0E6; --lime:#C6EC8C;
  --violet:#6F4FB6; --violet-soft:#EEE8F8; --warn:#A76300; --warn-soft:#FCEFD8; --bad:#BD3B2C; --bad-soft:#FBE3DF;
  --blue:#2D6CA8; --blue-soft:#E1ECF7; --shadow:0 1px 2px rgba(23,33,26,.05),0 6px 18px rgba(23,33,26,.05);
  --tag:"Sedgwick Ave Display","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#171E1A; --surface2:#1D2520; --ink:#E5ECE6; --muted:#97A49B; --line:#26302A; --line2:#35403A;
    --accent:#5DBB80; --accent-ink:#0B120E; --accent-soft:#1B3325; --lime:#3F5F28;
    --violet:#A98DEA; --violet-soft:#2A2340; --warn:#E8A94C; --warn-soft:#382A12; --bad:#EE7B6C; --bad-soft:#3C1E1A;
    --blue:#7DAEE3; --blue-soft:#162739; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#171E1A; --surface2:#1D2520; --ink:#E5ECE6; --muted:#97A49B; --line:#26302A; --line2:#35403A;
  --accent:#5DBB80; --accent-ink:#0B120E; --accent-soft:#1B3325; --lime:#3F5F28;
  --violet:#A98DEA; --violet-soft:#2A2340; --warn:#E8A94C; --warn-soft:#382A12; --bad:#EE7B6C; --bad-soft:#3C1E1A;
  --blue:#7DAEE3; --blue-soft:#162739; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--blue);text-underline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:14px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
main{display:flex;flex-direction:column;gap:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brand{font:31px/1 var(--tag);color:var(--ink);align-self:flex-start;padding:0 4px;margin-left:-4px;background:linear-gradient(transparent 58%,var(--lime) 58%,var(--lime) 92%,transparent 92%)}
.page-t{font:29px/1.05 var(--tag);color:var(--ink);overflow-wrap:anywhere}
.run-sub{border:0;background:none;padding:0;color:var(--muted);font:14px var(--body);text-align:left;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.avatar-btn{border:0;background:none;padding:0;display:inline-flex;flex:none;border-radius:50%}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#17211A;font:700 1em/1 var(--body);flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.sec{font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:36px}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px}
.greet{font-size:15px;color:var(--muted)}

/* run hero */
.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.illo{display:inline-block;flex:none}
.illo svg{display:block;width:100%;height:100%;overflow:visible}
.illo.lg{width:92px;height:92px;border-radius:24px;background:var(--accent-soft);padding:6px}
.illo.xs{width:28px;height:28px}
.hero h2{font-size:20px;overflow-wrap:anywhere}
.day{font:700 34px/1 var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day small{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.v i{background:var(--violet)} .bar.lo i{background:var(--blue)} .bar.hi i{background:var(--warn)} .bar.ok i{background:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:var(--ink);min-height:118px;font:inherit;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ti.v{background:var(--violet-soft);color:var(--violet)} .tile .ti.b{background:var(--blue-soft);color:var(--blue)} .tile .ti.w{background:var(--warn-soft);color:var(--warn)} .tile .ti.r{background:var(--bad-soft);color:var(--bad)} .tile .ti.n{background:var(--surface2);color:var(--muted)}
.tile b{font-size:16px;line-height:1.2}
.tile .s{font-size:13px;color:var(--muted);line-height:1.3}
.tile .s.hot{color:var(--bad);font-weight:700}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.v{background:var(--violet-soft);color:var(--violet)} .chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--bad-soft);color:var(--bad)} .chip.l{background:var(--blue-soft);color:var(--blue)} .chip.n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:700 15px var(--body);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pi{width:20px;height:20px;flex:none}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .t{font-weight:700}
.li .d{font-size:14px;color:var(--muted)}
.alert{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;align-items:center;color:inherit;font:inherit;cursor:pointer}
.alert:first-child{border-top:0}
.task{align-items:center}
.task-body{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;color:inherit;font:inherit}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--muted)}
.tick:hover,.tick:focus-visible{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.dayhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}
.dayhead:first-child{margin-top:0}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font:700 13px var(--body);color:var(--muted)}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filepick .btn{flex:none}
.filepick .small{overflow-wrap:anywhere}
.vh-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;white-space:nowrap;border:0;opacity:0;min-height:0}
.starpick{display:inline-flex;flex-direction:row-reverse;gap:2px;position:relative}
.starpick input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;opacity:0;min-height:0}
.starpick label{position:relative;z-index:1;font-size:30px;line-height:1;cursor:pointer;color:var(--line2);padding:2px}
.starpick input:checked ~ label,.starpick label:hover,.starpick label:hover ~ label{color:#E0A100}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;min-height:44px;padding:8px 11px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
input[type=range]{min-height:0;padding:0;border:0;background:none;accent-color:var(--accent);height:28px}
input[type=file]{padding:9px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.seg-ctl{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg-ctl button{border:0;background:transparent;padding:6px 12px;min-height:34px;border-radius:99px;font:700 13px var(--body);color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.swatch{position:relative;display:inline-flex}
.swatch input{position:absolute;opacity:0;width:1px;height:1px}
.swatch span{width:34px;height:34px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.swatch input:checked+span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.swatch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:4px}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.amt{font:600 18px var(--mono);white-space:nowrap}
.ord{font:700 13px var(--mono);color:var(--muted)}
.edit-tbl td{padding:4px}
.edit-tbl input,.edit-tbl select{min-height:38px;padding:6px;font-size:14px}
.edit-tbl .w-n{width:52px} .edit-tbl .w-d{width:72px} .edit-tbl .w-ph{width:92px}
.targets{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tgt{flex:1 1 120px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.tgt .k{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgt .v{font:600 22px var(--mono)}
table.rep th{white-space:normal;width:38%;vertical-align:top;padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
table.rep tr:last-child th,table.rep tr:last-child td{border-bottom:0}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .k{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 22px var(--mono)}
.stat .s{font-size:13px;color:var(--muted)}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* trichomes, stars */
.tri{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.tri i{display:block;height:100%}
.tri .c{background:#BFE3F2} .tri .m{background:#E6E1D6} .tri .a{background:#E99A2E}
.tri-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tri-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.warn-txt{color:var(--warn)}
.stars{color:#E0A100;letter-spacing:1px;white-space:nowrap}

/* media */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mgrid button{position:relative;padding:0;border:0;aspect-ratio:1;overflow:hidden;border-radius:10px;background:var(--surface2)}
.mgrid img{width:100%;height:100%;object-fit:cover;display:block}
.mgrid img:not([src]){visibility:hidden}
.mgrid .badge{position:absolute;left:5px;bottom:5px;font:700 11px/1 var(--body);background:rgba(12,18,14,.72);color:#fff;padding:4px 6px;border-radius:6px}
.mgrid .vb{position:absolute;right:5px;bottom:5px;font:700 11px/1 var(--body);background:rgba(12,18,14,.72);color:#fff;padding:4px 6px;border-radius:6px}
.mgrid .sel{position:absolute;right:5px;top:5px;font:700 11px/1 var(--body);background:var(--violet);color:#fff;padding:4px 6px;border-radius:6px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(6,9,7,.96);color:#EEF3EC;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer .v-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000}
.viewer .cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;height:100%}
.viewer .cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.viewer .cmp img{flex:1;min-height:0;width:100%}
.viewer .cmp figcaption{font-size:13px;text-align:center}
.viewer .v-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.viewer .v-meta{font-size:14px;color:#B9C6B8;text-align:center;padding-block:6px}
.viewer .btn,.viewer .icon-btn{background:#1C2720;border-color:#33433A;color:#EEF3EC}
.viewer .btn.primary{background:#5DBB80;border-color:#5DBB80;color:#0B120E}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* calendar */
.cal-head{display:flex;align-items:center;gap:4px}
.cal-head .icon-btn{width:36px}
.cal-head select{width:auto;min-height:40px;padding:6px 6px;min-width:0}
.cal-head #calM{flex:1 1 128px} .cal-head #calY{flex:0 0 82px}
.cal-head .btn.small{padding:0 8px}
.cal-card{padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:700 12px var(--body);color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{position:relative;aspect-ratio:1/1.16;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px 4px 7px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink);overflow:hidden;min-width:0}
.cal .d .n{font:700 14px/1.1 var(--body);font-variant-numeric:tabular-nums}
.cal .d .rd{position:absolute;top:4px;right:4px;font:9px/1 var(--mono);color:var(--muted)}
.cal .d .mk{position:absolute;top:16px;right:4px;font-size:10px;line-height:1;color:var(--warn)}
.cal .d .dots{display:flex;gap:2px;flex-wrap:wrap;min-height:6px}
.cal .d::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ph,transparent)}
.cal .d.fut::after{opacity:.35}
.cal .d.today{border:2px solid var(--ink)}
.cal .d.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal i,.cal-legend .dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.de{background:var(--ink)} .dp{background:#D8457F} .df{background:#2D8FD8} .dt{background:#E0892A}
.cal-legend{margin-top:10px;font-size:12px}
.cal-legend i{width:12px;height:4px;border-radius:2px}
.cal-legend i.dot{width:8px;height:8px;border-radius:50%}
.cal-legend .sep{flex-basis:100%;height:0}

/* coach */
.coach-log{display:flex;flex-direction:column;gap:10px}
.coach-log:empty{display:none}
.bubble{padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;border:1px solid var(--line)}
.bubble.q{background:var(--accent-soft);align-self:flex-end;max-width:90%;border-color:transparent}
.bubble.a{background:var(--surface2)}
.bubble.a.wait{color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet.over{z-index:95}
.sheet-bg{position:absolute;inset:0;background:rgba(8,12,9,.45)}
.sheet-card{position:relative;background:var(--bg);border-radius:22px 22px 0 0;max-height:92%;overflow-y:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:640px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
.sheet-card::before{content:"";display:block;width:40px;height:4px;border-radius:99px;background:var(--line2);margin:0 auto 10px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.sheet-head h2{font-size:19px}

/* nav + fab */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.bottom button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 8px;font:700 11px var(--body);color:var(--muted)}
.bottom .ic{width:52px;height:30px;border-radius:99px;display:grid;place-items:center}
.bottom .pi{width:22px;height:22px}

<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="Hauptnavigation"><div class="in" id="nav"></div></nav>
<button class="fab" id="fab" data-act="quickAdd" aria-label="Schnell hinzufügen" hidden></button>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <form class="sheet-card" id="sheetForm" novalidate>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" class="icon-btn" data-act="close" aria-label="Schließen">✕</button></div>
    <div id="sheetBody" class="stack"></div>
  </form>
</div>
<div class="viewer" id="viewer" hidden></div>
<div class="lock" id="lock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= Zeltbuch v5 ================= */
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DAY=86400000;
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const nowStamp=()=>{const d=new Date();return `${isoOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const parseD=iso=>new Date(String(iso).slice(0,10)+'T00:00:00');
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return isoOf(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum=s=>{if(s===null||s===undefined)return NaN;const t=String(s).trim().replace(',','.');return t===''?NaN:Number(t);};
const fmtDate=iso=>parseD(iso).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtLong=iso=>parseD(iso).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=iso=>parseD(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const fmtTime=st=>st&&st.length>10?st.slice(11,16):'';
const fmtDE=(n,d=1)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const fmtAmt=n=>n>=100?fmtDE(n,0):fmtDE(n,1);
const fmtP=(n,d=2)=>Number(n).toFixed(d);
const fmtMB=b=>b>=1048576?`${fmtDE(b/1048576,1)} MB`:`${fmtDE(b/1024,0)} KB`;
const fmtDur=s=>{s=Math.round(s||0);return `${Math.floor(s/60)}:${pad(s%60)}`;};
const plural=(n,s,p)=>`${n} ${n===1?s:p}`;
const fmtRel=iso=>{const d=daysBetween(todayISO(),iso);return d<0?`${-d} ${d===-1?'Tag':'Tage'} überfällig`:d===0?'heute':d===1?'morgen':`in ${d} Tagen`;};
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'zeltbuch';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- Krypto (WebCrypto: PBKDF2 + AES-GCM) ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const CRYPTO_OK=!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=buf=>{const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=str=>{const bin=atob(str);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};
const KDF_ITER=310000;
async function deriveKey(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encBytes(key,bytes){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv,ct};}
const decBytes=(key,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
async function legacyHash(pin,salt){const h=await crypto.subtle.digest('SHA-256',te.encode(salt+':'+pin));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ---------- IndexedDB ---------- */
const REC_STORES=['setups','runs','plants','entries','photos','plans','feeds','climate','tasks','steer','strains','expenses','meters','settings'];
const ALL_STORES=['profiles',...REC_STORES,'media','meta'];
let idb=null,memOnly=false;
const S={profiles:[]};REC_STORES.forEach(s=>S[s]=[]);
let ENC={};REC_STORES.forEach(s=>ENC[s]=[]);
const KEYS={};
let META={id:'app',runBy:{},fails:{}};
function openDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('zeltbuch',4);}catch(e){rej(e);return;}
  r.onupgradeneeded=()=>{const db=r.result;ALL_STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
function dbAll(s){if(!idb)return Promise.resolve([]);return new Promise((res,rej)=>{try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});}
function dbGet(s,id){if(!idb)return Promise.resolve(MEM_MEDIA.get(id)||null);return new Promise((res,rej)=>{try{const q=idb.transaction(s).objectStore(s).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});}
function dbDo(s,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{try{const t=idb.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}});}
const MEM_MEDIA=new Map();
let WQ=Promise.resolve();
function enqueue(fn){WQ=WQ.then(fn).catch(e=>{console.error(e);toast('Speichern fehlgeschlagen – ist der Speicher voll?');});return WQ;}
const flush=()=>WQ;
const byId=(store,id)=>S[store].find(x=>x.id===id);
function upsertMem(store,obj){const a=S[store];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);}
function keyFor(pid){const p=byId('profiles',pid);if(!p||!p.enc)return null;return KEYS[pid]||false;}
function save(store,obj){
  upsertMem(store,obj);
  if(store==='profiles'){const snap=JSON.parse(JSON.stringify(obj));return enqueue(()=>dbDo('profiles',st=>st.put(snap)));}
  if(!obj.pid)obj.pid=PID();
  const json=JSON.stringify(obj),id=obj.id,pid=obj.pid;
  return enqueue(async()=>{
    const key=keyFor(pid);
    if(key===false)throw new Error('Profil ist gesperrt');
    if(key){const {iv,ct}=await encBytes(key,te.encode(json));await dbDo(store,st=>st.put({id,pid,_e:1,iv,ct}));}
    else await dbDo(store,st=>st.put(JSON.parse(json)));
  });
}
function remove(store,id){S[store]=S[store].filter(x=>x.id!==id);return enqueue(()=>dbDo(store,st=>st.delete(id)));}
function saveMeta(){const snap=JSON.parse(JSON.stringify(META));return enqueue(()=>dbDo('meta',st=>st.put(snap)));}

/* Medien (Blobs, getrennt von den Metadaten) */
const MEDIA_URL=new Map();
function saveMedia(id,pid,blob){
  return enqueue(async()=>{
    const key=keyFor(pid);if(key===false)throw new Error('Profil ist gesperrt');
    if(!idb){MEM_MEDIA.set(id,{id,pid,blob});return;}
    if(key){const buf=new Uint8Array(await blob.arrayBuffer());const {iv,ct}=await encBytes(key,buf);await dbDo('media',st=>st.put({id,pid,_e:1,iv,ct,type:blob.type||''}));}
    else await dbDo('media',st=>st.put({id,pid,blob}));
  });
}
async function loadMedia(id){
  const row=await dbGet('media',id);if(!row)return null;
  if(row._e){const key=KEYS[row.pid];if(!key)return null;const buf=await decBytes(key,row.iv,row.ct);return new Blob([buf],{type:row.type||''});}
  return row.blob||null;
}
async function mediaURL(id){if(MEDIA_URL.has(id))return MEDIA_URL.get(id);let b=null;try{b=await loadMedia(id);}catch(e){console.error(e);}if(!b)return '';const u=URL.createObjectURL(b);MEDIA_URL.set(id,u);return u;}
function dropMediaURLs(){MEDIA_URL.forEach(u=>URL.revokeObjectURL(u));MEDIA_URL.clear();}
function removeMedia(id){const ids=[id,id+'_t'];ids.forEach(k=>{const u=MEDIA_URL.get(k);if(u){URL.revokeObjectURL(u);MEDIA_URL.delete(k);}MEM_MEDIA.delete(k);});return enqueue(()=>dbDo('media',st=>ids.forEach(k=>st.delete(k))));}
function hydrateMedia(root=document){
  $$('[data-media]:not([data-loaded])',root).forEach(async el=>{
    el.dataset.loaded='1';
    let u=await mediaURL(el.dataset.media);
    if(!u&&el.dataset.fallback)u=await mediaURL(el.dataset.fallback);
    if(!u){el.closest('button')?.classList.add('missing');return;}
    if(el.isConnected)el.src=u;
  });
}

/* ---------- Profile, Sperre & Verschlüsselung ---------- */
const PCOLORS=['#9BD36B','#F28AB2','#7DB6EA','#F4A259','#F2D36B','#B79CF0'];
const PID=()=>META.activeProfile;
const profile=()=>byId('profiles',PID());
const mine=st=>S[st].filter(x=>x.pid===PID());
function activeRun(){const id=META.runBy&&META.runBy[PID()];const r=byId('runs',id);if(r&&r.pid===PID())return r;return mine('runs')[0]||null;}
function setActiveRun(id){META.runBy=META.runBy||{};META.runBy[PID()]=id;saveMeta();}
const initials=n=>(String(n||'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2)||'?').toUpperCase();
const avatar=(p,sz=32)=>`<span class="avatar" style="background:${esc(p?.color||PCOLORS[0])};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px">${p?.avatar?`<img src="${esc(p.avatar)}" alt="">`:esc(initials(p?.name))}</span>`;
const isLocked=p=>!!(p&&(p.enc||p.pinHash));
function newProfile(name,color){const p={id:uid(),name:name||'Mein Profil',color:color||PCOLORS[S.profiles.length%PCOLORS.length],created:nowStamp(),autoLock:2};save('profiles',p);return p;}
async function reloadEnc(){for(const st of REC_STORES){try{ENC[st]=(await dbAll(st)).filter(r=>r._e);}catch(e){ENC[st]=[];}}}
async function unlock(pid,secret){
  const p=byId('profiles',pid);if(!p)return false;
  if(p.enc&&p.lock){
    let key;
    try{key=await deriveKey(secret,unb64(p.lock.salt),p.lock.iter);const chk=await decBytes(key,unb64(p.lock.iv),unb64(p.lock.check));if(td.decode(chk)!=='zeltbuch-ok')return false;}catch(e){return false;}
    KEYS[pid]=key;
    for(const st of REC_STORES){for(const r of ENC[st].filter(x=>x.pid===pid)){try{upsertMem(st,JSON.parse(td.decode(await decBytes(key,r.iv,r.ct))));}catch(e){console.error('Entschlüsseln fehlgeschlagen',st,r.id);}}}
    return true;
  }
  if(p.pinHash){
    if(await legacyHash(secret,p.pinSalt)!==p.pinHash)return false;
    await setLock(pid,secret,'pin');
    return true;
  }
  return true;
}
async function lockMem(pid){
  const p=byId('profiles',pid);if(!p||!p.enc)return;
  await flush();
  delete KEYS[pid];
  REC_STORES.forEach(st=>{S[st]=S[st].filter(x=>x.pid!==pid);});
  dropMediaURLs();
  await reloadEnc();
}
async function setLock(pid,secret,type,onProg){
  const p=byId('profiles',pid);if(!p)return;
  if(!CRYPTO_OK)throw new Error('Dieses Gerät unterstützt keine Verschlüsselung');
  await flush();
  const oldKey=KEYS[pid]||null;
  const mIds=(await dbAll('media')).filter(r=>r.pid===pid).map(r=>r.id);
  if(secret){
    const salt=rnd(16),key=await deriveKey(secret,salt,KDF_ITER);const {iv,ct}=await encBytes(key,te.encode('zeltbuch-ok'));
    p.lock={type,salt:b64(salt),iter:KDF_ITER,iv:b64(iv),check:b64(ct)};p.enc=true;KEYS[pid]=key;
  }else{delete p.lock;p.enc=false;delete KEYS[pid];}
  delete p.pinHash;delete p.pinSalt;delete p.pinLen;
  await save('profiles',p);
  const recs=REC_STORES.flatMap(st=>S[st].filter(x=>x.pid===pid).map(o=>[st,o]));
  const total=recs.length+mIds.length;let n=0;
  for(const [st,o] of recs){save(st,o);if(++n%25===0&&onProg)onProg(n/total);}
  await flush();
  for(const id of mIds){
    const row=await dbGet('media',id);if(!row)continue;
    let blob=row.blob||null;
    if(row._e){if(!oldKey)continue;blob=new Blob([await decBytes(oldKey,row.iv,row.ct)],{type:row.type||''});}
    if(blob){await saveMedia(id,pid,blob);}
    n++;if(onProg)onProg(n/total);
  }
  await flush();await reloadEnc();
}
function purgeProfileData(pid){
  S.runs.filter(r=>r.pid===pid).forEach(r=>{cascadeRun(r.id);remove('runs',r.id);});
  ['setups','plans','strains','settings'].forEach(s=>S[s].filter(x=>x.pid===pid).forEach(x=>remove(s,x.id)));
  enqueue(async()=>{
    for(const st of REC_STORES){const rows=(await dbAll(st)).filter(r=>r.pid===pid);if(rows.length)await dbDo(st,o=>rows.forEach(r=>o.delete(r.id)));}
    const mr=(await dbAll('media')).filter(r=>r.pid===pid);if(mr.length)await dbDo('media',o=>mr.forEach(r=>o.delete(r.id)));
  });
}
async function deleteProfile(pid){purgeProfileData(pid);delete KEYS[pid];remove('profiles',pid);if(META.runBy)delete META.runBy[pid];if(META.fails)delete META.fails[pid];if(META.activeProfile===pid){const o=S.profiles[0]||newProfile();META.activeProfile=o.id;}saveMeta();await flush();await reloadEnc();}
function failState(pid){const f=(META.fails||{})[pid]||{n:0,until:0};return f;}
function registerFail(pid){META.fails=META.fails||{};const f=failState(pid);f.n++;if(f.n>=5)f.until=Date.now()+Math.min(900000,30000*Math.pow(2,f.n-5));META.fails[pid]=f;saveMeta();}
function clearFails(pid){if(META.fails&&META.fails[pid]){delete META.fails[pid];saveMeta();}}

/* ---------- domain ---------- */
const PHASES=['Keimung','Veg','Blüte','Fade/Flush','Ernte','Trocknung','Curing'];
const ENTRY_TYPES=['Notiz','Gießen','Füttern','Topping','LST','Entlauben','Lollipop','Umtopfen','Trichome','Trocknung','Curing','Problem','Schädlinge','Sonstiges'];
const ENTRY_CHIP={'Notiz':'n','Gießen':'l','Füttern':'','Topping':'v','LST':'v','Entlauben':'v','Lollipop':'v','Umtopfen':'v','Trichome':'v','Trocknung':'w','Curing':'w','Problem':'b','Schädlinge':'b','Sonstiges':'n'};
const WEEK_PHASES=['Veg','Blüte','Flush'];
const PH_ORDER={'Veg':0,'Blüte':1,'Flush':2};

function sortedPhases(run){return [...(run.phases||[])].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:PHASES.indexOf(a.type)-PHASES.indexOf(b.type));}
function runInfo(run,date=todayISO()){
  if(!run)return null;
  const ph=sortedPhases(run);
  const cur=ph.filter(p=>p.date<=date).pop()||ph[0]||{type:'Keimung'};
  const bloom=ph.find(p=>p.type==='Blüte'), veg=ph.find(p=>p.type==='Veg');
  const bloomDay=bloom&&bloom.date<=date?daysBetween(bloom.date,date)+1:null;
  const vegDay=!bloomDay&&veg&&veg.date<=date?daysBetween(veg.date,date)+1:null;
  const pbd=parseNum(run.planBloomDays), pvw=parseNum(run.planVegWeeks);
  let expHarvest=null,harvestLeft=null,expFlip=null,flipLeft=null;
  if(bloom&&pbd>0){expHarvest=addDays(bloom.date,Math.round(pbd)-1);harvestLeft=daysBetween(date,expHarvest);}
  if(!bloomDay&&veg&&pvw>0){expFlip=addDays(veg.date,Math.round(pvw*7));flipLeft=daysBetween(date,expFlip);}
  return {day:daysBetween(run.start,date)+1,phase:cur.type,phaseIdx:PHASES.indexOf(cur.type),bloomDay,bloomWeek:bloomDay?Math.ceil(bloomDay/7):null,vegDay,vegWeek:vegDay?Math.ceil(vegDay/7):null,phases:ph,expHarvest,harvestLeft,expFlip,flipLeft};
}
function dayLine(I){if(!I)return '';if(I.bloomDay)return `Blüte Tag ${I.bloomDay} · Woche ${I.bloomWeek}`;if(I.vegDay)return `Veg Tag ${I.vegDay} · Woche ${I.vegWeek}`;return I.phase;}
const lastBy=(arr,k)=>arr.reduce((m,x)=>!m||x[k]>m[k]?x:m,null);
const plantName=id=>{const p=byId('plants',id);return p?p.label:'';};
/* Feed */
function parseRange(v){if(v===undefined||v===null)return null;const s=String(v).trim().replace(/,/g,'.');if(!s||s==='-'||s==='—')return null;const m=s.split(/\s*[-–]\s*/).map(Number).filter(n=>!isNaN(n));if(!m.length)return null;return m.length===1?[m[0],m[0]]:[Math.min(m[0],m[1]),Math.max(m[0],m[1])];}
const pickR=(r,pos)=>pos==='min'?r[0]:pos==='max'?r[1]:(r[0]+r[1])/2;
const weekLabel=w=>w.phase==='Flush'?'Flush'+(+w.n>1?' '+w.n:''):`${w.phase} ${w.n}`;

function alerts(run,I){
  const out=[];const today=todayISO();
  const od=openTasks(run).filter(t=>t.due<today);
  if(od.length)out.push({c:'b',t:`${plural(od.length,'Aufgabe','Aufgaben')} überfällig`,act:'tasksAll'});
  if(I.phaseIdx<4){
    const lf=lastBy(S.feeds.filter(f=>f.runId===run.id),'at');
    if(lf&&daysBetween(lf.at.slice(0,10),today)<=3){
      const me=parseNum(lf.measuredEc),lp=byId('plans',lf.planId),tr=feedEcTarget(lf,lp,run);
      if(tr&&!isNaN(me)&&(me<tr[0]-0.3||me>tr[1]+0.3))out.push({c:'w',t:`Letzte Mischung: EC ${fmtP(me,1)} statt ${fmtR(tr)}`,act:'tab',tab:'feed'});
      const pr=parseRange(lf.targetPh),mp=parseNum(lf.measuredPh);
      if(pr&&!isNaN(mp)&&(mp<pr[0]-0.05||mp>pr[1]+0.05))out.push({c:'w',t:`Letzte Mischung: pH ${fmtP(mp,1)} außerhalb ${lf.targetPh}`,act:'tab',tab:'feed'});
    }
    if(I.harvestLeft!==null&&I.harvestLeft<=7)out.push({c:'v',t:I.harvestLeft>=0?`Erntefenster: noch ${plural(I.harvestLeft,'Tag','Tage')} – Trichome checken`:`Geplante Blütedauer um ${plural(-I.harvestLeft,'Tag','Tage')} überschritten`,act:'trich'});

}

const PH_COLOR={'Keimung':'#FFD400','Veg':'#56C23A','Blüte':'#9B5CFF','Fade/Flush':'#FF7A1A','Ernte':'#8A8A8A','Trocknung':'#8A8A8A','Curing':'#8A8A8A'};
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function taskDates(t,from,to){
  const out=[];if(t.done)return out;
  const ev=+t.every||0;
  if(!ev){if(t.due>=from&&t.due<=to)out.push(t.due);return out;}
  let d=t.due;
  if(d<from){const k=Math.ceil(daysBetween(d,from)/ev);d=addDays(d,k*ev);if(t.due>=from)d=t.due;}
  while(d<=to&&out.length<62){if(d>=from)out.push(d);d=addDays(d,ev);}
  return out;
}
function entryHtml(e){
  return `<div class="entry"><div class="grow stack" style="gap:6px"><div class="row"><span class="chip ${ENTRY_CHIP[e.type]??'n'}">${esc(e.type)}</span>${e.plantId?`<span class="small muted">${esc(plantName(e.plantId))}</span>`:''}</div>${e.tri?`${triBar(e.tri)}<span class="small">${triTxt(e.tri)} · ${esc(triHint(e.tri))}</span>`:''}${measTxt(e)}${e.text?`<p>${esc(e.text)}</p>`:''}</div><button class="icon-btn" data-act="del" data-store="entries" data-id="${e.id}" data-confirm aria-label="Eintrag löschen">✕</button></div>`;
}

function viewCalendar(run){
  const y=U.calY,m=U.calM,today=todayISO();
  const first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  const from=isoOf(first),to=isoOf(new Date(y,m,dim));
  const map={};const add=(iso,k,x)=>{if(!iso||iso<from||iso>to)return;(map[iso]=map[iso]||{e:0,p:0,f:0,t:0,ev:0})[k]+=1;};
  S.entries.forEach(e=>{if(e.runId===run.id)add(e.date,'e');});
  S.photos.forEach(p=>{if(p.runId===run.id)add(p.date,'p');});
  S.feeds.forEach(f=>{if(f.runId===run.id)add(f.at.slice(0,10),'f');});
  openTasks(run).forEach(t=>taskDates(t,from,to).forEach(d=>add(d,'t')));
  const R=runInfo(run);
  R.phases.forEach(p=>add(p.date,'ev'));
  if(R.expHarvest&&R.phaseIdx<4)add(R.expHarvest,'ev');
  if(R.expFlip)add(R.expFlip,'ev');
  if(!U.calSel)U.calSel=today;
  const endRun=(R.phases.find(p=>p.type==='Curing')||{}).date;
  let cells=WD.map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<off;i++)cells+='<span class="blank" aria-hidden="true"></span>';
  for(let d=1;d<=dim;d++){
    const iso=isoOf(new Date(y,m,d)),D=map[iso];
    let rd='',ph='';
    if(iso>=run.start){const J=runInfo(run,iso);rd=J.bloomDay?`B${J.bloomDay}`:`T${J.day}`;ph=PH_COLOR[J.phase]||'';if(endRun&&iso>addDays(endRun,30)){rd='';ph='';}}
    const dots=D?`${D.e?'<i class="de"></i>':''}${D.p?'<i class="dp"></i>':''}${D.f?'<i class="df"></i>':''}${D.t?'<i class="dt"></i>':''}`:'';
    cells+=`<button class="d${iso===today?' today':''}${iso===U.calSel?' sel':''}${iso>today?' fut':''}${ph?' inrun':''}" data-act="calPick" data-d="${iso}"${ph?` style="--ph:${ph}"`:''} aria-label="${fmtDate(iso)}${rd?', '+(rd[0]==='B'?'Blütetag '+rd.slice(1):'Tag '+rd.slice(1)):''}"><span class="n">${d}</span>${rd?`<span class="rd">${rd}</span>`:''}${D&&D.ev?'<span class="mk" aria-hidden="true">★</span>':''}<span class="dots" aria-hidden="true">${dots}</span></button>`;
  }
  const ty=new Date().getFullYear(),sy=+run.start.slice(0,4);
  const years=[...new Set([sy,ty-1,ty,ty+1,ty+2,y])].sort((a,b)=>a-b);
  return `<div class="cal-head"><button class="icon-btn" data-act="calNav" data-d="-1" aria-label="Vorheriger Monat">‹</button><select id="calM" aria-label="Monat">${MONTHS.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n}</option>`).join('')}</select><select id="calY" aria-label="Jahr">${years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><button class="icon-btn" data-act="calNav" data-d="1" aria-label="Nächster Monat">›</button><button class="btn small ghost" data-act="calToday">Heute</button></div>
  <section class="card cal-card"><div class="cal">${cells}</div>

function dayPanel(run,iso){
  const I=iso>=run.start?runInfo(run,iso):null,R=runInfo(run);
  const es=S.entries.filter(e=>e.runId===run.id&&e.date===iso).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const ps=S.photos.filter(p=>p.runId===run.id&&p.date===iso);
  const fs=S.feeds.filter(f=>f.runId===run.id&&f.at.slice(0,10)===iso);
  const ts=openTasks(run).filter(t=>taskDates(t,iso,iso).length);
  const ev=[];R.phases.filter(p=>p.date===iso).forEach(p=>ev.push(`${p.type} beginnt`));
  if(R.expHarvest===iso&&R.phaseIdx<4)ev.push('Geplante Ernte');
  if(R.expFlip===iso)ev.push('Geplantes Umstellen auf Blüte');
  const empty=!ev.length&&!ts.length&&!es.length&&!ps.length&&!fs.length;
  return `<section class="card stack day-panel">
  <div><b style="font-size:18px">${fmtDate(iso)}</b><div class="small muted">${I?`Tag ${I.day} · ${esc(I.phase)}${I.bloomDay?` · Blüte Tag ${I.bloomDay}, Woche ${I.bloomWeek}`:I.vegDay?` · Veg Woche ${I.vegWeek}`:''}${iso>todayISO()?' · geplant':''}`:'Vor dem Start dieses Runs'}</div></div>
  ${ev.length?`<div class="row">${ev.map(x=>`<span class="chip v">★ ${esc(x)}</span>`).join('')}</div>`:''}
  ${ts.length?`<div class="list">${ts.map(t=>t.due===iso?taskRow(t):`<div class="li task"><span class="tick" aria-hidden="true">↻</span><div class="grow"><div class="t">${esc(t.title)}</div><div class="d">${esc(repeatTxt(t.every))} · voraussichtlich</div></div></div>`).join('')}</div>`:''}
  ${es.map(entryHtml).join('')}
  ${ps.length?`<div class="mgrid">${ps.map(p=>`<button data-act="openMedia" data-id="${p.id}" aria-label="Medium öffnen">${thumbTag(p)}${p.kind==='video'?`<span class="vb">▶ ${fmtDur(p.dur)}</span>`:''}</button>`).join('')}</div>`:''}
  ${fs.length?`<div class="list">${fs.map(f=>`<div class="li"><span class="chip l">Feed</span><div class="grow"><div class="t">${esc(f.weekLabel)} · ${fmtDE(f.tankL,1)} L</div><div class="d">${fmtTime(f.at)} · Ist EC ${esc(f.measuredEc||'–')} · pH ${esc(f.measuredPh||'–')}</div></div></div>`).join('')}</div>`:''}
  ${empty?'<p class="muted">Für diesen Tag ist nichts eingetragen.</p>':''}
  <div class="row"><button class="btn small" data-act="calEntry" data-d="${iso}">${IC.plus} Eintrag</button><button class="btn small" data-act="calTask" data-d="${iso}">${IC.plus} Aufgabe</button><button class="btn small" data-act="calPhoto" data-d="${iso}">${IC.plus} Foto</button></div>
  </section>`;
}

function runReport(run){
  const I=runInfo(run),st=byId('setups',run.setupId);
  const get=t=>I.phases.find(p=>p.type===t)?.date;
  const veg=get('Veg'),bloom=get('Blüte'),harvest=get('Ernte'),end=harvest||todayISO();
  const plants=S.plants.filter(p=>p.runId===run.id);
  const dryPl=plants.map(p=>parseNum(p.review?.dry)).filter(n=>!isNaN(n));
  const dry=!isNaN(parseNum(run.harvest?.dry))?parseNum(run.harvest.dry):(dryPl.length?dryPl.reduce((a,b)=>a+b,0):NaN);
  const wet=parseNum(run.harvest?.wet);
  const area=st&&parseNum(st.w)&&parseNum(st.d)?parseNum(st.w)*parseNum(st.d)/10000:null,watt=st?parseNum(st.watt):NaN;
  const feeds=S.feeds.filter(f=>f.runId===run.id),ecs=feeds.map(f=>parseNum(f.measuredEc)).filter(n=>!isNaN(n));
  const nE=S.entries.filter(e=>e.runId===run.id).length,nP=S.photos.filter(p=>p.runId===run.id).length;
  const rows=[
    ['Zeitraum',`${fmtDate(run.start)} – ${harvest?fmtDate(harvest):'läuft'} · ${plural(daysBetween(run.start,end)+1,'Tag','Tage')}`],
    veg?['Veg',plural(daysBetween(veg,bloom||end),'Tag','Tage')]:null,
    bloom?['Blüte',`${plural(daysBetween(bloom,end)+(harvest?0:1),'Tag','Tage')}${run.planBloomDays?` (geplant ${run.planBloomDays})`:''}`]:null,
    ['Ertrag trocken',!isNaN(dry)?`${fmtDE(dry,0)} g${!isNaN(wet)&&wet?` · nass ${fmtDE(wet,0)} g (${fmtDE(dry/wet*100,0)} %)`:''}`:'–'],
    ['g/m²',area&&!isNaN(dry)?fmtDE(dry/area,0):'–'],
    ['g/Watt',!isNaN(watt)&&watt&&!isNaN(dry)?fmtDE(dry/watt,2):'–'],
    ['Mischungen',feeds.length?`${feeds.length}${ecs.length?` · Ø EC ${fmtP(ecs.reduce((a,b)=>a+b,0)/ecs.length,2)}`:''}`:'–'],
    ['Journal / Fotos',`${plural(nE,'Eintrag','Einträge')} · ${plural(nP,'Foto','Fotos')}`]
  ].filter(Boolean);
  const pl=plants.map(p=>({p,avg:avgRating(p.review),dry:parseNum(p.review?.dry)}));
  return {rows,pl,setup:st,strains:[...new Set(plants.map(p=>p.strain).filter(Boolean))]};
}
function reportSheet(id){
  const run=byId('runs',id);if(!run)return;const R=runReport(run);
  openSheet('Run-Bericht',`<h3 style="font-size:20px">${esc(run.name)}</h3>${R.strains.length||R.setup?`<p class="muted">${esc([R.strains.join(', '),R.setup?.name].filter(Boolean).join(' · '))}</p>`:''}
  <div class="card"><table class="rep"><tbody>${R.rows.map(([k,v])=>`<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div>
  ${R.pl.length?`<h3 class="sec">Pflanzen</h3><div class="card"><div class="list">${R.pl.map(({p,avg,dry})=>`<div class="li"><div class="grow"><div class="t">${esc(p.label)}${p.strain?' · '+esc(p.strain):''}</div><div class="d">${!isNaN(dry)?fmtDE(dry,0)+' g · ':''}${avg?stars(avg)+' '+fmtDE(avg,1):'nicht bewertet'}${p.review?.note?' · '+esc(p.review.note):''}</div></div></div>`).join('')}</div></div>`:''}
  <button type="button" class="btn primary" data-act="reportSave" data-id="${run.id}">Bericht speichern (.md)</button>`,null,null);
}
function reportMd(run){

  if(R.pl.length)md+='\n## Pflanzen\n\n'+R.pl.map(({p,avg,dry})=>`- **${p.label}**${p.strain?' · '+p.strain:''}: ${!isNaN(dry)?fmtDE(dry,0)+' g, ':''}${avg?fmtDE(avg,1)+'/5':'nicht bewertet'}${p.review?.note?' – '+p.review.note:''}`).join('\n')+'\n';
  return md+`\n_Erstellt mit Zeltbuch am ${fmtDate(todayISO())}_\n`;
}

const COACH_RULES='Du bist ein erfahrener Grow-Coach für legalen privaten Indoor-Anbau von Cannabis in Deutschland. Antworte auf Deutsch, direkt und konkret, mit Zahlen und Zielwerten wo sinnvoll. Nutze die Daten des aktuellen Runs unten. Wenn wichtige Informationen fehlen, sag welche. Schreibe schlichten Text ohne Überschriften und ohne Markdown-Formatierung; Aufzählungen mit "- ". Halte dich kurz (etwa 150 bis 200 Wörter), außer der Nutzer will mehr. Wenn ein Foto angehängt ist: beschreibe, was du siehst (z. B. Mangelerscheinungen, Schädlinge, Trichome), nenne die wahrscheinlichste Ursache und wie sicher du dir bist.';
function coachContext(run){
  const I=runInfo(run),st=byId('setups',run.setupId),L=[];
  L.push(`Run "${run.name}": Tag ${I.day}, Phase ${I.phase}${I.bloomDay?`, Blüte Tag ${I.bloomDay} (Woche ${I.bloomWeek})`:''}${I.vegDay?`, Veg Tag ${I.vegDay}`:''}${run.planBloomDays?`, geplante Blütedauer ${run.planBloomDays} Tage`:''}, Medium ${run.medium||st?.medium||'k. A.'}`);
  if(st)L.push('Setup: '+[st.name,st.w&&st.d?`${st.w}x${st.d} cm`:'',st.watt?st.watt+' W':'',st.irrigation,st.potL?st.potL+' L Topf':'',st.tankL?st.tankL+' L Tank':'',st.sensors].filter(Boolean).join(', '));
  const pl=S.plants.filter(p=>p.runId===run.id);
  if(pl.length)L.push('Pflanzen: '+pl.map(p=>[p.label,p.strain,p.breeder,p.source].filter(Boolean).join(' / ')).join('; '));
  const fd=S.feeds.filter(f=>f.runId===run.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,3);
  if(fd.length)L.push('Letzte Mischungen: '+fd.map(f=>`${f.at.replace('T',' ')}: ${f.planName}, ${f.weekLabel}, ${f.tankL} L, ${f.amounts.map(a=>`${a.name} ${fmtAmt(a.amount)} ${a.unit}`).join(', ')}; Soll-EC ${f.targetEc||'-'}, Ist-EC ${f.measuredEc||'-'}, pH ${f.measuredPh||'-'}`).join(' | '));
  const en=S.entries.filter(e=>e.runId===run.id).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at)).slice(0,8);
  if(en.length)L.push('Letzte Journal-Einträge: '+en.map(e=>`${e.date} ${e.type}${e.plantId?' ('+plantName(e.plantId)+')':''}: ${e.tri?triTxt(e.tri)+'. ':''}${String(e.text||'').slice(0,200)}`).join(' | '));
  return L.join('\n');
}

}

function coachTools(){
  if(!SAMPLE_TOOLS)return undefined;
  const tools=[];
  if(MCP)tools.push({
    name:'webSearch',
    description:'Sucht aktuelle Informationen im Web zu Cannabis-Anbau (Technik, Produkte, Schädlinge, Krankheiten, Sortenbeschreibungen). Nutze es, wenn dein Wissen unsicher oder möglicherweise veraltet ist. Gib eine kurze, gezielte Suchanfrage. Liefert Titel, URL und kurze Ausschnitte der besten Treffer.',
    inputSchema:{type:'object',properties:{query:{type:'string',description:'Kurze, gezielte Suchanfrage, z. B. "cannabis magnesium deficiency leaves yellowing"'}},required:['query']},
    execute:async({query})=>{
      const q=String(query||'').slice(0,200);if(!q)throw new Error('Leere Suchanfrage');
      try{
        const srv=await MCP.server('Parallel Search');
        const r=await srv.web_search({objective:q,search_queries:[q],session_id:COACH_SID});
        return JSON.stringify(r).slice(0,6000);
      }catch(e){throw new Error('Websuche fehlgeschlagen ('+(e&&e.code||'Fehler')+')');}
    }
  });
  tools.push({
    name:'searchStrains',
    description:'Durchsucht die kuratierte Samenbank-Referenzliste (bekannte Sorten mit Breeder, Typ, Genetik/Kreuzung, ungefährer Blütedauer) nach Namen oder Stichwort.',
    inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
    execute:({query})=>{
      const hits=(typeof seedLibHits==='function'?seedLibHits(query):[]);
      return hits.length?hits.map(s=>`${s.name} (${s.breeder}, ${s.kind}, ${s.gen}, Blüte ${s.flower} Tage): ${s.desc}`).join('\n'):'Keine passende Sorte in der Referenzliste gefunden.';
    }
  });
  tools.push({
    name:'searchTips',
    description:'Durchsucht die Zeltbuch-Tipps-Artikel (Anbautechniken, Gießen, Töpfe, Substrat, Licht, Dünger, Schädlinge, Keimung, Stecklinge, Ernte) nach einem Stichwort und liefert passende Auszüge.',
    inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
    execute:({query})=>{
      const q=String(query||'').toLowerCase();
      const hits=(typeof TIPS!=='undefined'?TIPS:[]).filter(t=>t.title.toLowerCase().includes(q)||(t.tags||[]).some(x=>x.includes(q))||t.body.toLowerCase().includes(q)).slice(0,3);
      return hits.length?hits.map(t=>`${t.title}: ${t.body.slice(0,500)}`).join('\n---\n'):'Keine passenden Tipps gefunden.';
    }
  });
  return tools;
}
async function askCoach(q,form){
  const run=activeRun();const C=U.coach;if(!run||!SAMPLE||C.busy)return;
  const file=$('input[type=file]',form)?.files?.[0];const useLast=form.elements.namedItem('attachLast')?.checked;
  let images=null,note='';
  try{if(file&&SAMPLE_IMG){images=[await compress(file,1600)];note=' (Foto angehängt)';}else if(useLast&&SAMPLE_IMG){const lp=lastPhoto(run);if(lp){const b=await loadMedia(lp.id);if(b)images=[b];note=` (Foto vom ${fmtShort(lp.date)} angehängt)`;}}}catch(e){}
  if(C.turns.length>12)C.turns=C.turns.slice(-12);
  C.turns.push({role:'user',content:q+note});
  const input=[{role:'user',content:COACH_RULES+'\n\nDaten des Runs:\n'+coachContext(run)},...C.turns];
  C.busy=true;C.ctl=new AbortController();renderCoachLog('');
  try{
    const opts={signal:C.ctl.signal,cache:false,onText:({text})=>renderCoachLog(text)};
    if(images)opts.images=images;
    const tools=coachTools();if(tools)opts.tools=tools;
    const r=await SAMPLE(input,opts);
    C.turns.push({role:'assistant',content:r.text});C.busy=false;renderCoachLog(null,r.truncated?'Die Antwort wurde gekürzt.':'');
  }catch(e){
    C.busy=false;const code=e&&e.code;
    if(e&&e.text)C.turns.push({role:'assistant',content:e.text});else C.turns.pop();
    renderCoachLog(null,code==='cancelled'?'':(COACH_ERR[code]||'Antwort fehlgeschlagen – versuch es noch einmal.'));
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code))SAMPLE=null;
  }
  if(form.isConnected){const fi=$('input[type=file]',form);if(fi)fi.value='';}
}

const TIPS=[
  {id:'giessen',cat:'Bewässerung',title:'Richtig gießen: Menge, Rhythmus, Dryback',tags:['gießen','wasser','dryback','bewässerung'],body:'Gieße nach Gewicht oder Dryback, nicht nach starrem Zeitplan: Wiege den Topf (oder schätze am Gewicht), lass ihn zwischen den Gaben spürbar leichter werden – in Veg 15–20 % Gewichtsverlust, in später Blüte auch 25–35 %, das fördert Wurzelwachstum und beugt Fäulnis vor. Gieße in Runoff, also bis 10–20 % Wasser unten aus dem Topf laufen, damit sich keine Salze aufkonzentrieren. Miess Runoff-EC gelegentlich gegen die Input-EC, um Über- oder Unterdüngung zu erkennen. Zimmerwarmes Wasser (18–24 °C) schont die Wurzeln. Bei Töpfen unter 15 L reicht meist 1–2× täglich in der Hauptblüte, größere Container brauchen seltener, dafür mehr Volumen pro Gabe. Automatisierte Tropfsysteme (wie Wilma/AutoPot) laufen am stabilsten mit mehreren kurzen Schüben statt einer langen Gabe – das verteilt Wasser gleichmäßiger im Wurzelraum und vermeidet Kanalbildung im Substrat.'},
  {id:'toepfe',cat:'Ausstattung',title:'Topfgröße und Fütterungssystem wählen',tags:['töpfe','container','fabric pot','wilma','autopot'],body:'Die Topfgröße bestimmt, wie oft du gießen musst und wie groß die Pflanze werden darf: als Faustregel etwa 10–15 L pro finaler Pflanzengröße von 60–90 cm, 20–25 L für größere Pflanzen. Stoff-/Airpots (Fabric Pots) belüften die Wurzeln seitlich und beugen Wurzelverfilzung vor, trocknen aber schneller aus als Plastiktöpfe – ideal in Kombination mit einem Tropfsystem. Bewässerungssysteme wie Wilma oder AutoPot arbeiten mit einem Tank und Schlauch/Ventil pro Topf; wichtig ist ein sauber entlüftetes System und gleich lange Schläuche zu jedem Topf, damit alle Pflanzen die gleiche Menge bekommen. Stelle Tropfer so, dass das Wasser gleichmäßig über die Topfoberfläche verteilt wird, nicht nur an einer Stelle – das verhindert Kanalbildung und trockene Ecken.'},
  {id:'substrat',cat:'Substrat',title:'Substratwahl: Erde, Kokos, Hydro',tags:['substrat','erde','kokos','hydro','medium'],body:'Erde puffert Nährstoff- und pH-Schwankungen am meisten und verzeiht Anfängerfehler, wächst dafür etwas langsamer. Kokos ist nahezu inert, braucht aber ein komplettes Düngeprogramm von Anfang an und tägliches Gießen mit Runoff, dafür sind Wachstum und Kontrolle über die Zufuhr schneller und präziser. Reine Hydro-Systeme (DWC, etc.) reagieren am schnellsten auf Fehler bei Temperatur, EC oder Sauerstoffversorgung, bieten im Gegenzug das schnellste Wachstum. Für ein Einsteiger-Setup mit Tropfsystem ist eine Coco/Perlite-Mischung (z. B. 70/30) ein guter Mittelweg: gute Drainage, gute Wasserhaltung, gutmütig gegenüber leichten Fehlern. Wichtig bei Kokos: vor der ersten Nutzung mit Cal-Mag puffern, da Kokosfasern Kalzium und Magnesium binden können.'},
  {id:'licht',cat:'Licht',title:'Lichtstärke, Abstand und Photoperiode',tags:['licht','led','ppfd','photoperiode'],body:'Die Lichtmenge (PPFD, gemessen in µmol/m²/s) sollte mit der Pflanze mitwachsen: Sämling/Steckling 200–400, Veg 400–600, Blüte 700–1000, in Vollblüte mit CO₂-Anreicherung auch darüber. Zu viel Licht zu früh verursacht Lichtstress (helle, eingerollte Blattspitzen), zu wenig verlängert die Internodien und mindert den Ertrag. Hänge das Licht in dem Abstand auf, den der Hersteller für die jeweilige Leistungsstufe angibt, und taste dich mit der Dimmstufe langsam an die Zielwerte heran. Für Photoperioden-Sorten gilt: 18/6 in Veg, striktes 12/12 in Blüte – schon kurze Lichteinbrüche in der Dunkelphase können Stress oder Zwittrigkeit auslösen, deshalb Zelt lichtdicht halten. Die letzte(n) Wochen vor der Ernte reduzieren manche Grower die Lichtstärke leicht, um Stress zu senken – zwingend nötig ist das aber nicht.'},
  {id:'duengung',cat:'Düngung',title:'Düngen nach EC/pH statt nach Schema F',tags:['dünger','ec','ph','nährstoffe','feed'],body:'Ein Düngeplan ist ein Startpunkt, kein Gesetz: Miss immer die tatsächliche EC/pH deiner fertigen Nährlösung, statt blind der Tabelle zu vertrauen, denn Wasserqualität, Topfgröße und Sortenreaktion unterscheiden sich. Für Erde/Kokos ist ein pH von 5,8–6,2 üblich, in reiner Hydro eher 5,5–5,8. Steigere die EC in Trittstufen und beobachte die Blattspitzen: leichtes Einrollen nach unten und dunkelgrüne Farbe deuten auf Überdüngung, blasse untere Blätter auf Mangel. Miss zusätzlich die Runoff-EC – liegt sie deutlich über der Input-EC, akkumulieren Salze im Substrat und ein Spülgang mit reinem (leicht gedüngtem) Wasser schafft Abhilfe. In der letzten Woche vor der Ernte auf reines, mild gedüngtes Wasser umzustellen ("Flush") ist unter Growern umstritten – wichtiger für Geschmack ist meist eine saubere, gut belüftete Trocknung.'},
  {id:'schaedlinge',cat:'Pflanzenschutz',title:'Schädlinge und Krankheiten früh erkennen',tags:['schädlinge','spinnmilben','thrips','mehltau','pflanzenschutz'],body:'Kontrolliere regelmäßig die Blattunterseiten mit einer Lupe – die meisten Schädlinge (Spinnmilben, Thripse, Blattläuse) verstecken sich dort und zeigen sich zuerst durch feine helle Sprenkel auf den Blättern oder feine Gespinste. Echter Mehltau zeigt sich als weißer, mehliger Belag auf der Blattoberseite und breitet sich bei hoher Luftfeuchte und schlechter Luftzirkulation schnell aus – ein Umluftventilator und moderate rLF helfen vorbeugend. Bei Befall zuerst betroffene Blätter/Pflanzenteile entfernen und isolieren, dann mit für den Innenanbau geeigneten Mitteln (z. B. Kaliseife, Neemöl in Veg, niemals in später Blüte wegen Geruch/Rückständen) behandeln. In der Blüte sind biologische Nützlinge (Raubmilben) oft die sicherste Option, da chemische Mittel zu Rückständen in der Ernte führen können. Eine saubere Anbauumgebung (kein offenes Erdsäckchen, Werkzeuge desinfizieren, keine fremden Pflanzen ins Zelt) ist die wirksamste Vorbeugung.'},
  {id:'keimung',cat:'Vermehrung',title:'Samen zum Keimen bringen',tags:['keimung','samen','germination'],body:'Die zuverlässigste Methode ist die Papiertuch-Methode: Samen zwischen zwei feuchte (nicht nasse) Küchenpapiere legen, in eine geschlossene Box bei 22–25 °C und dunkel lagern, täglich auf Feuchtigkeit prüfen. Nach 1–5 Tagen erscheint eine kleine weiße Wurzel (Taproot) – dann vorsichtig mit sauberen Fingern oder Pinzette (nie an der Wurzel selbst anfassen) in feuchtes, lockeres Anzuchtsubstrat setzen, Wurzel nach unten, etwa 1 cm tief. Alternativ direkt ins leicht feuchte Substrat säen, das ist stressärmer für die junge Wurzel, dauert aber optisch länger bis man den Fortschritt sieht. Die ersten Tage genügt sehr schwaches Licht und hohe Luftfeuchte (Anzuchthaube); erst wenn die Keimblätter sich öffnen, langsam an normales Vegwachstumslicht gewöhnen.'},
  {id:'stecklinge',cat:'Vermehrung',title:'Stecklinge schneiden und bewurzeln',tags:['stecklinge','klone','clones'],body:'Wähle einen gesunden, nicht blühenden Zweig mit mehreren Nodien, schneide im 45°-Winkel unter einem Nodium mit scharfer, desinfizierter Klinge. Untere Blätter entfernen, große obere Blätter zur Hälfte einkürzen, um Verdunstung zu reduzieren. Schnittstelle in Bewurzelungsgel/-pulver tauchen und in ein feuchtes, steriles Medium (Steinwolle, Bewurzelungswürfel oder Perlite/Vermiculite-Mix) stecken. Unter einer Klarsichthaube bei hoher Luftfeuchte (80–90 %) und mildem Licht (bzw. Anzuchtröhren) halten, Haube täglich kurz lüften, um Schimmel vorzubeugen. Nach 7–14 Tagen zeigen sich neue weiße Wurzeln; erst dann langsam an normale Luftfeuchte und Lichtstärke gewöhnen. Eine leichte Unterlage mit Wärme (20–25 °C Substrattemperatur) beschleunigt die Bewurzelung spürbar.'},
  {id:'training',cat:'Technik',title:'LST, Topping und Entlaubung',tags:['training','lst','topping','entlaubung','defoliation'],body:'Low Stress Training (LST) bindet Triebe seitlich herunter, statt sie zu schneiden – das öffnet die Pflanze fürs Licht und fördert mehrere gleichmäßige Kolen, ohne Wachstumspause. Topping (Kappen der Haupttriebspitze über einem Nodium) fördert zwei neue Haupttriebe und eine buschigere Pflanze, kostet aber einige Tage Erholung; am besten früh in der Vegetationsphase durchführen, spätestens 1–2 Wochen vor Blühbeginn. Entlaubung (Defoliation) entfernt große, lichtblockierende Blätter, um Licht und Luft zu unteren Blütenständen zu bringen – sanft in der ersten Blütewoche und noch einmal moderat um Woche 3 der Blüte, danach zurückhaltend, da die Pflanze die Blätter für die Fruchtbildung braucht. Nach jedem Eingriff mindestens 24–48 Stunden ohne weiteren Stress (kein Düngewechsel, kein Umtopfen) geben, damit sich die Pflanze erholen kann.'},
  {id:'ernte-trocknen',cat:'Ernte',title:'Erntezeitpunkt, Trocknung und Curing',tags:['ernte','trichome','trocknen','curing'],body:'Der Erntezeitpunkt richtet sich am zuverlässigsten nach den Trichomen unter einer Lupe/Mikroskop: milchig-trübe Trichome bedeuten volle THC-Reife, ein steigender Amber-Anteil (10–30 %, je nach gewünschter Wirkung) bringt einen etwas entspannteren, weniger "kopflastigen" Effekt. Nach der Ernte langsam trocknen: 18–20 °C, 55–62 % rLF, Dunkelheit und sanfte, indirekte Luftzirkulation über 7–14 Tage, bis kleine Stiele beim Biegen brechen statt sich nur zu biegen. Zu schnelles Trocknen (zu warm, zu trocken) verschlechtert Geruch und Wirkung. Danach in luftdichten Gläsern bei 58–62 % Luftfeuchte curen: die ersten 1–2 Wochen täglich kurz "burpen" (Deckel öffnen), danach seltener; nach 3–4 Wochen ist ein deutlicher Qualitätssprung bei Geruch, Geschmack und Rauchhärte spürbar, viele Sorten profitieren noch über Monate von weiterer Reifung.'},
  {id:'crop-steering',cat:'Technik',title:'Grundlagen Crop Steering',tags:['crop steering','dryback','shots','generative','vegetative'],body:'Crop Steering nutzt Gieß-Timing und -Menge gezielt, um die Pflanze zwischen vegetativem (mehr Wachstum, mehr Blattmasse) und generativem Zustand (mehr Blütenansatz, kompaktere Struktur) zu lenken. Ein größerer Dryback (Austrocknung zwischen den Gaben, gemessen als Gewichtsverlust in %) vor der ersten Gabe des Tages wirkt generativer, häufige kleine Gaben mit wenig Dryback wirken vegetativer. In der frühen Blüte oft moderater Dryback (15–20 %) für Struktur, in der Mitte der Blüte etwas mehr Volumen für Fruchtmasse, in der Spätblüte wieder leicht reduzierend. Wichtig ist Konsistenz: Miss Dryback über Topfgewicht (Waage) oder Substratfeuchte-Sensor, dokumentiere die Werte, und ändere pro Phase nur eine Stellschraube gleichzeitig (entweder Menge oder Timing), um Ursache und Wirkung sauber zuordnen zu können.'}
];

async function compress(file,max=1600,q=0.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});
    const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const out=await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',q));
    return out&&(out.size<file.size||max<1000)?out:file;
  }catch(e){return file;}finally{URL.revokeObjectURL(url);}
}
function squareAvatar(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const s=Math.min(im.naturalWidth,im.naturalHeight);const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,0,0,256,256);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82));};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bild'));};im.src=url;});}

    const c=document.createElement('canvas');c.width=W;c.height=H;

    const draw=()=>{if(finished)return;ctx.drawImage(v,0,0,W,H);if(dur)onProg(Math.min(1,v.currentTime/dur));else onProg(-v.currentTime);if(stop()){finish();return;}if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(draw);else requestAnimationFrame(draw);};

}

   `<p class="note">Fotos werden auf 1600 px verkleinert, Videos auf höchstens 720p neu kodiert. Das Komprimieren eines Videos dauert etwa so lange wie das Video selbst – lass die App dabei geöffnet.</p>
   <div id="upStat" class="stack" style="gap:8px" hidden><span id="upTxt" class="small"></span><div class="prog"><i id="upBar"></i></div><button type="button" class="btn small" data-act="upCancel">Abbrechen</button></div>`,
   'Hochladen',
   async(d,f)=>{
     const files=[...($('input[type=file]',f).files||[])];if(!files.length){toast('Wähle mindestens eine Datei');return false;}
     U.upCancel=false;$('#upStat').hidden=false;
     const txt=m=>{const e=$('#upTxt');if(e)e.textContent=m;},bar=p=>{const e=$('#upBar');if(e)e.style.width=Math.round(p*100)+'%';};
     let orig=0,final=0,ok=0,skipped=[];
     for(let i=0;i<files.length;i++){
       if(U.upCancel)break;
       const file=files[i],isV=/^video\//.test(file.type)||/\.(mp4|mov|webm|m4v|3gp)$/i.test(file.name);
       const pre=files.length>1?`Datei ${i+1}/${files.length}: `:'';
       const id=uid(),dt=d.fileDate&&file.lastModified?isoOf(new Date(file.lastModified)):d.date;
       try{
         if(isV){
           txt(pre+'Video wird komprimiert …');bar(0);
           let r;
           try{r=await compressVideo(file,p=>{if(p<0){txt(`${pre}Video wird komprimiert … ${fmtDur(-p)}`);}else{bar(p);txt(`${pre}Video wird komprimiert … ${Math.round(p*100)} %`);}},()=>U.upCancel);}
           catch(e){if(e&&e.code==='cancelled')break;if(file.size>200*1048576){skipped.push(file.name);continue;}r={blob:file,thumb:null,dur:0,compressed:false};}
           await saveMedia(id,PID(),r.blob);if(r.thumb)await saveMedia(id+'_t',PID(),r.thumb);
           save('photos',{id,runId:run.id,plantId:d.plantId,date:dt,note:d.note,kind:'video',dur:r.dur,size:r.blob.size,orig:file.size,thumb:!!r.thumb,at:nowStamp()});
           orig+=file.size;final+=r.blob.size;ok++;
         }else{
           txt(pre+'Foto wird verkleinert …');bar(0.5);
           const big=await compress(file,1600,0.82),th=await compress(file,400,0.72);
           await saveMedia(id,PID(),big);await saveMedia(id+'_t',PID(),th);
           save('photos',{id,runId:run.id,plantId:d.plantId,date:dt,note:d.note,kind:'image',size:big.size,orig:file.size,thumb:true,at:nowStamp()});
           orig+=file.size;final+=big.size;ok++;bar(1);
         }
       }catch(e){console.error(e);skipped.push(file.name);}
     }
     await flush();
     if(skipped.length)toast(`${plural(ok,'Datei','Dateien')} gespeichert, ${skipped.length} übersprungen`);
     else if(ok)toast(`${plural(ok,'Datei','Dateien')} gespeichert${orig>final?` · ${Math.round((1-final/orig)*100)} % kleiner`:''}`);
     return ok>0||U.upCancel;
   });
}

let lockTimer=null;
function renderLock(){
  const L=$('#lock');clearInterval(lockTimer);
  if(!U.locked){L.hidden=true;L.innerHTML='';return;}
  L.hidden=false;
  const p=byId('profiles',U.lockTarget);
  const f=p?failState(p.id):{n:0,until:0},wait=Math.max(0,Math.ceil((f.until-Date.now())/1000));
  if(wait>0)lockTimer=setInterval(()=>{if(Date.now()>=f.until){clearInterval(lockTimer);renderLock();}else{const m=$('#lock .msg');if(m)m.textContent=`Zu viele Versuche – warte ${fmtDur(Math.ceil((f.until-Date.now())/1000))}`;}},1000);
  const msg=wait>0?`Zu viele Versuche – warte ${fmtDur(wait)}`:(U.pinMsg||'');
  if((U.lockStage==='pin'||U.lockStage==='pass')&&p&&isLocked(p)){

/* ---------- Backup ---------- */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLToBlob(u){const i=u.indexOf(',');const mime=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'application/octet-stream';return new Blob([unb64(u.slice(i+1))],{type:mime});}
async function offerFile(name,blob,okMsg){
  if(DL){try{await DL.save({filename:name,data:blob});toast(okMsg);return true;}catch(e){if(e&&e.code==='declined')return false;toast('Speichern nicht möglich: '+(e.message||e.code));return false;}}
  if(window.claude){toast('Speichern ist in dieser Ansicht nicht verfügbar');return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(okMsg);return true;
}
async function exportBackup(pw,status){
  try{
    status&&status('Sammle Daten …');await flush();
    const runs=mine('runs'),rids=new Set(runs.map(r=>r.id)),byRun=s=>S[s].filter(x=>rids.has(x.runId));
    const photos=byRun('photos'),media=[];
    let i=0;for(const p of photos){status&&status(`Packe Medien ${++i}/${photos.length} …`);for(const id of [p.id,p.id+'_t']){const b=await loadMedia(id);if(b)media.push({id,dataUrl:await blobToDataURL(b)});}}
    const stores={setups:mine('setups'),plans:mine('plans'),runs,plants:byRun('plants'),entries:byRun('entries'),photos,feeds:byRun('feeds'),climate:byRun('climate'),tasks:byRun('tasks'),steer:byRun('steer'),expenses:byRun('expenses'),meters:byRun('meters'),strains:mine('strains'),settings:mine('settings')};
    const P=profile();
    let json=JSON.stringify({app:'zeltbuch',version:5,profile:{name:P.name},exportedAt:new Date().toISOString(),meta:{activeRun:activeRun()?.id||null},stores,media});
    if(pw){status&&status('Verschlüssele Backup …');const salt=rnd(16),key=await deriveKey(pw,salt,KDF_ITER);const {iv,ct}=await encBytes(key,te.encode(json));json=JSON.stringify({app:'zeltbuch',version:5,encrypted:true,salt:b64(salt),iter:KDF_ITER,iv:b64(iv),data:b64(ct)});}
    status&&status(`Datei: ${fmtMB(json.length)}`);
    return await offerFile(`zeltbuch-${slug(P.name)}-${todayISO()}${pw?'-verschluesselt':''}.json`,new Blob([json],{type:'application/json'}),'Backup gespeichert');
  }catch(e){console.error(e);toast('Export fehlgeschlagen');return false;}
}
function normImport(d){['setups','runs','plants','entries','photos','plans','feeds','climate','tasks','steer','expenses','meters','strains','settings'].forEach(s=>{d.stores[s]=d.stores[s]||[];});
  if(!d.media){d.media=[];(d.photos||[]).forEach(p=>{const{dataUrl,blob,...rest}=p;if(dataUrl){d.media.push({id:p.id,dataUrl});}d.stores.photos.push({...rest,kind:'image'});});}
  return d;}
function readImport(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='zeltbuch')throw 0;
    if(d.encrypted){U.importData={name:file.name,pending:d};}else{if(!d.stores)throw 0;U.importData={name:file.name,data:normImport(d)};}
    render();}catch(e){toast('Diese Datei ist kein Zeltbuch-Backup');}};
  r.onerror=()=>toast('Datei konnte nicht gelesen werden');r.readAsText(file);
}
async function decryptImport(pw){
  const e=U.importData&&U.importData.pending;if(!e)return;
  try{const key=await deriveKey(pw,unb64(e.salt),e.iter);const buf=await decBytes(key,unb64(e.iv),unb64(e.data));const d=JSON.parse(td.decode(buf));U.importData={name:U.importData.name,data:normImport(d)};render();}
  catch(err){toast('Falsches Passwort');}
}
async function importBackup(){
  const d=U.importData&&U.importData.data;if(!d)return;const pid=PID();
  toast('Importiere …');
  for(const r of mine('runs')){cascadeRun(r.id);remove('runs',r.id);}
  for(const s of ['setups','plans','strains','settings'])for(const x of mine(s))remove(s,x.id);
  await flush();
  const map={};const nid=o=>{if(!o)return o;if(!map[o])map[o]=uid();return map[o];};const ref=v=>v?(map[v]||''):v;
  const strip=x=>{const{profileId,_e,iv,ct,blob,dataUrl,...rest}=x;return rest;};
  d.stores.setups.forEach(x=>save('setups',{...strip(x),id:nid(x.id),pid}));
  d.stores.plans.forEach(x=>save('plans',{...strip(x),id:nid(x.id),pid}));
  d.stores.runs.forEach(x=>save('runs',{...strip(x),id:nid(x.id),pid,setupId:ref(x.setupId)}));
  d.stores.plants.forEach(x=>save('plants',{...strip(x),id:nid(x.id),pid,runId:ref(x.runId)}));
  d.stores.entries.forEach(x=>save('entries',{...strip(x),id:uid(),pid,runId:ref(x.runId),plantId:ref(x.plantId)}));
  d.stores.photos.forEach(x=>save('photos',{...strip(x),id:nid(x.id),pid,runId:ref(x.runId),plantId:ref(x.plantId),kind:x.kind||'image'}));
  d.stores.feeds.forEach(x=>save('feeds',{...strip(x),id:uid(),pid,runId:ref(x.runId),planId:ref(x.planId)}));
  d.stores.climate.forEach(x=>save('climate',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.tasks.forEach(x=>save('tasks',{...strip(x),id:uid(),pid,runId:ref(x.runId),plantId:ref(x.plantId)}));
  d.stores.steer.forEach(x=>save('steer',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.expenses.forEach(x=>save('expenses',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.meters.forEach(x=>save('meters',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.strains.forEach(x=>save('strains',{...strip(x),id:uid(),pid}));
  d.stores.settings.forEach(x=>{const k=String(x.id).split(':').slice(1).join(':');if(k)save('settings',{...strip(x),id:pid+':'+k,pid});});
  for(const m of d.media){const base=m.id.endsWith('_t')?m.id.slice(0,-2):m.id;const nb=map[base];if(!nb)continue;try{await saveMedia(nb+(m.id.endsWith('_t')?'_t':''),pid,dataURLToBlob(m.dataUrl));}catch(e){}}
  await flush();dropMediaURLs();
  setActiveRun(ref(d.meta?.activeRun)||mine('runs')[0]?.id||null);
  U.importData=null;U.planId=null;U.weekPlan=null;U.tankL=null;render();toast('Backup importiert');
}

function cascadeRun(id){S.photos.filter(x=>x.runId===id).forEach(x=>removeMedia(x.id));['plants','entries','photos','feeds','climate','tasks','steer','expenses','meters'].forEach(s=>S[s].filter(x=>x.runId===id).forEach(x=>remove(s,x.id)));}
function planEdit(el){
  const p=curPlan();if(!p)return;const k=el.dataset.pe,v=el.value;
  if(k==='name'||k==='maker'||k==='note')p[k]=v;
  else if(k==='baseL'){const n=parseNum(v);if(!isNaN(n)&&n>0)p.baseL=n;}
  else if(k==='prodName')p.products[+el.dataset.i].name=v;
  else if(k==='prodUnit')p.products[+el.dataset.i].unit=v;
  else{const w=p.weeks[+el.dataset.w];if(!w)return;
    if(k==='wkPhase')w.phase=v;else if(k==='wkN')w.n=parseInt(v,10)||1;
    else if(k==='dose'){const t=v.trim();if(t)w.doses[el.dataset.p]=t;else delete w.doses[el.dataset.p];}
    else if(k==='ec')w.ec=v.trim();else if(k==='ph')w.ph=v.trim();
    if(k==='wkPhase'||k==='wkN')sortWeeks(p);}
  save('plans',p);
  if(['name','baseL','prodName','wkPhase','wkN'].includes(k))render();
}

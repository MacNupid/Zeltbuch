const setKey=k=>PID()+':'+k;
function getSet(k,def){const r=byId('settings',setKey(k));return r&&r.v!==undefined?r.v:def;}
function putSet(k,v){return save('settings',{id:setKey(k),pid:PID(),v});}
const fmtR=(r,d=2)=>r?(r[0]===r[1]?fmtP(r[0],d):`${fmtP(r[0],d)}–${fmtP(r[1],d)}`):'–';
const rangeSt=(v,r)=>r&&!isNaN(v)?(v<r[0]?'lo':v>r[1]?'hi':'ok'):null;
const ST_CHIP={lo:'l',ok:'',hi:'w'};
const byTime=(a,b)=>String(a.at).localeCompare(String(b.at));

/* ----- Wasserwerte ----- */
function baseEc(st){
  if(!st)return NaN;const tap=parseNum(st.waterEc),roPct=Math.min(100,Math.max(0,parseNum(st.roPct)||0))/100;
  const roEc=isNaN(parseNum(st.roEc))?0.02:parseNum(st.roEc);
  if(isNaN(tap)&&roPct<1)return NaN;
  return (isNaN(tap)?0:tap)*(1-roPct)+roEc*roPct;
}
function feedEcTarget(lf,lp,run){const r=parseRange(lf.targetEc);if(!r)return null;if(lp&&lp.ecPlus){const b=baseEc(byId('setups',run.setupId));if(isNaN(b))return null;return [r[0]+b,r[1]+b];}return r;}
function waterLine(plan,week){
  const run=activeRun(),st=run&&byId('setups',run.setupId);if(!st)return '';
  const b=baseEc(st),r=parseRange(week.ec);
  if(isNaN(b))return `<p class="note" style="margin-top:8px">Tipp: Trag im Setup deine Wasserwerte ein (EC, pH, Osmose-Anteil) – dann rechnet die App die Ziel-EC mit deinem Wasser.</p>`;
  const ro=parseNum(st.roPct)||0,src=ro>=100?'Osmosewasser':ro>0?`Wasser mit ${fmtDE(ro,0)} % Osmose`:'Leitungswasser';
  return `<div class="banner ok" style="margin-top:12px">${esc(src)}: EC ${fmtP(b,2)}${st.waterPh?` · pH ${esc(st.waterPh)}`:''}${plan.ecPlus&&r?`<br><b>Ziel-EC gesamt im Tank: ${fmtR([r[0]+b,r[1]+b])}</b> (EC+ ${fmtR(r)} + Wasser ${fmtP(b,2)})`:r?`<br>Die Ziel-EC ${fmtR(r)} ist hier der Gesamtwert inklusive Wasser.`:''}</div>`;
}

/* ----- Crop Steering ----- */
const STEER_DEF=[
  {key:'veg',name:'Veg (vor der Blüte)',mode:'vegetativ',from:0,to:0,shots:'6–8',win:'–',db:[10,10],feedEc:[1.8,2.0],roEc:null,roWarn:null,shotPct:[2,3]},
  {key:'g1',name:'① Generativ Setting',mode:'generativ',from:1,to:3,shots:'4–5',win:'2–4 h (09–13 Uhr)',db:[15,20],feedEc:[2.3,2.5],roEc:[3.5,4.5],roWarn:5.0,shotPct:[3,3]},
  {key:'v2',name:'② Vegetativ Bulking',mode:'vegetativ',from:4,to:6,shots:'8–10',win:'6–10 h (09–19 Uhr)',db:[10,12],feedEc:[2.3,2.4],roEc:[3.0,4.0],roWarn:4.8,shotPct:[3,4]},
  {key:'g3',name:'③ Generativ Reifung',mode:'generativ',from:7,to:8,shots:'3–4',win:'2–4 h (10–16 Uhr)',db:[18,22],feedEc:[1.5,1.5],roEc:[2.0,2.8],roWarn:null,shotPct:[3,4]},
  {key:'g4',name:'④ Generativ Finish',mode:'generativ',from:9,to:99,shots:'2–3',win:'2 h (12–16 Uhr)',db:[20,25],feedEc:[1.5,1.5],roEc:[2.0,2.8],roWarn:null,shotPct:[3,3]}
];
const steerPhases=()=>getSet('steer',null)||STEER_DEF;
function steerPhaseFor(I){const ph=steerPhases();if(!I||!I.bloomWeek)return ph.find(p=>p.key==='veg')||ph[0];return ph.find(p=>p.from&&I.bloomWeek>=p.from&&I.bloomWeek<=p.to)||ph[ph.length-1];}
function steerDay(run,iso){
  const all=S.steer.filter(e=>e.runId===run.id);
  const ev=all.filter(e=>e.at.slice(0,10)===iso).sort(byTime),prev=all.filter(e=>e.at.slice(0,10)===addDays(iso,-1)).sort(byTime);
  const shots=ev.filter(e=>e.kind==='shot'),reads=ev.filter(e=>e.kind==='read'),ro=ev.filter(e=>e.kind==='runoff');
  const hasV=r=>!isNaN(parseNum(r.vwc));
  const mode=[...reads,...prev].some(r=>r.kind==='read'&&hasV(r))?'vwc':'w';
  const val=r=>mode==='vwc'?parseNum(r.vwc):parseNum(r.w);
  const prevReads=prev.filter(e=>e.kind==='read'&&!isNaN(val(e))),prevLast=prev.filter(e=>e.kind==='shot').pop();
  const pk=prevReads.filter(r=>!prevLast||r.at>=prevLast.at);
  const peak=pk.length?Math.max(...pk.map(val)):prevReads.length?Math.max(...prevReads.map(val)):NaN;
  const firstShot=shots[0];
  const morn=reads.filter(r=>(!firstShot||r.at<=firstShot.at)&&!isNaN(val(r)));
  const low=morn.length?Math.min(...morn.map(val)):NaN;
  const st=byId('setups',run.setupId),potL=parseNum(st?.potL);
  let db=NaN,dbAbs=NaN;
  if(!isNaN(peak)&&!isNaN(low)&&peak>0){dbAbs=peak-low;db=mode==='vwc'?dbAbs/peak*100:(potL>0?dbAbs/potL*100:dbAbs/peak*100);}
  const dayVals=reads.map(val).filter(v=>!isNaN(v));
  const sumShot=shots.reduce((s,e)=>s+(parseNum(e.ml)||0),0),sumRo=ro.reduce((s,e)=>s+(parseNum(e.ml)||0),0);
  const roEcEv=[...ro].reverse().find(e=>!isNaN(parseNum(e.ec)));
  const subEc=reads.filter(r=>!isNaN(parseNum(r.ec)));
  return {ev,shots,reads,ro,mode,peak,low,db,dbAbs,potL,max:dayVals.length?Math.max(...dayVals):NaN,min:dayVals.length?Math.min(...dayVals):NaN,sumShot,sumRo,roPct:sumShot>0&&sumRo>0?sumRo/sumShot*100:NaN,roEc:roEcEv?parseNum(roEcEv.ec):NaN,subEc0:subEc.length?parseNum(subEc[0].ec):NaN,subEc1:subEc.length?parseNum(subEc[subEc.length-1].ec):NaN};
}
function steerAlerts(run,I){
  const out=[];if(!run||I.phaseIdx>=4)return out;
  const P=steerPhaseFor(I),t=todayISO();
  const D=steerDay(run,t);
  if(!isNaN(D.db)){const s=rangeSt(D.db,P.db);if(s&&s!=='ok')out.push({c:ST_CHIP[s],t:`Nacht-Dryback ${fmtDE(D.db,0)} % – Ziel ${fmtR(P.db,0)} % (${P.name})`,act:'go',tab:'steer'});}
  const last=S.steer.filter(e=>e.runId===run.id&&e.kind==='runoff'&&!isNaN(parseNum(e.ec))&&daysBetween(e.at.slice(0,10),t)<=2).sort(byTime).pop();
  if(last&&P.roEc){const v=parseNum(last.ec);if(P.roWarn&&v>P.roWarn)out.push({c:'b',t:`Runoff-EC ${fmtP(v,1)} über ${fmtP(P.roWarn,1)} – Flush-Shot erwägen`,act:'go',tab:'steer'});else if(v>P.roEc[1])out.push({c:'w',t:`Runoff-EC ${fmtP(v,1)} über dem Ziel ${fmtR(P.roEc,1)}`,act:'go',tab:'steer'});}
  return out;
}
function viewSteer(){
  const run=activeRun();if(!run)return needRun();

function steerSheet(kind){

  const body=kind==='shot'?`<div class="grid2">${fld('Uhrzeit',inp('time',t,'type="time"'))}${fld('Menge pro Topf (ml)',dec('ml',defMl,'autofocus'))}</div>`
    :kind==='runoff'?`<div class="grid3">${fld('Uhrzeit',inp('time',t,'type="time"'))}${fld('Runoff (ml)',dec('ml','','autofocus'))}${fld('EC',dec('ec',''))}</div>${fld('pH',dec('ph',''))}`
    :`<div class="grid2">${fld('Uhrzeit',inp('time',t,'type="time"'))}${fld('VWC % (Sensor)',dec('vwc','','autofocus'))}</div><div class="grid2">${fld('Topfgewicht (kg)',dec('w',''))}${fld('Substrat-EC',dec('ec',''))}</div><p class="note">Ohne Sensor reicht das Topfgewicht. Am besten abends nach dem letzten Shot und morgens vor dem ersten Shot wiegen.</p>`;
  openSheet(title,body+fld('Notiz',inp('note','','placeholder="optional"')),'Speichern',f=>{
    const at=`${U.steerDate||todayISO()}T${f.time||t}`;
    const o={id:uid(),runId:run.id,kind,at,note:f.note};
    if(kind==='shot'){if(!(parseNum(f.ml)>0)){toast('Menge angeben');return false;}o.ml=String(parseNum(f.ml));}

  });
}

/* ----- Trocknung & Curing ----- */
function measTxt(e){
  if(e.type==='Trocknung')return `<span class="small">${[e.w?`${fmtDE(parseNum(e.w),0)} g`:'',e.t?`${e.t} °C`:'',e.rh?`${e.rh} % rLF`:''].filter(Boolean).join(' · ')}</span>`;
  if(e.type==='Curing')return `<span class="small">${[e.jar?`Glas ${esc(e.jar)}`:'',e.rh?`${e.rh} % im Glas`:'',e.w?`${fmtDE(parseNum(e.w),0)} g`:'',e.burp?'gelüftet':''].filter(Boolean).join(' · ')}</span>`;
  return '';
}
function cureStatus(rh){const v=parseNum(rh);if(isNaN(v))return null;if(v<55)return ['b','zu trocken'];if(v<58)return ['w','etwas trocken'];if(v<=62)return ['','ideal'];if(v<=65)return ['w','etwas feucht – öfter lüften'];return ['b','zu feucht – täglich lüften, ggf. offen nachtrocknen'];}

  ${dry.length?`<div class="list">${[...dry].reverse().slice(0,6).map(e=>`<div class="li" style="align-items:center"><span class="small num" style="width:52px">${fmtShort(e.date)}</span><div class="grow">${measTxt(e)}${e.text?`<div class="d">${esc(e.text)}</div>`:''}</div><button class="icon-btn" data-act="del" data-store="entries" data-id="${e.id}" data-confirm aria-label="Löschen">✕</button></div>`).join('')}</div>`:''}

/* ----- Verbrauch & Kosten ----- */
function feedUsage(run){
  const map={};let water=0,n=0;
  S.feeds.filter(f=>f.runId===run.id).forEach(f=>{n++;water+=parseNum(f.tankL)||0;(f.amounts||[]).forEach(a=>{const k=String(a.name).trim();const m=map[k.toLowerCase()]||(map[k.toLowerCase()]={name:k,unit:a.unit||'ml',amount:0});m.amount+=parseNum(a.amount)||0;});});
  return {items:Object.values(map).sort((a,b)=>b.amount-a.amount),water,n};
}
function powerUse(run){
  const st=byId('setups',run.setupId),I=runInfo(run);
  const meters=S.meters.filter(m=>m.runId===run.id&&!isNaN(parseNum(m.v))).sort((a,b)=>a.date.localeCompare(b.date));
  if(meters.length>=2){const a=meters[0],b=meters[meters.length-1];return {kwh:Math.max(0,parseNum(b.v)-parseNum(a.v)),measured:true,from:a.date,to:b.date,meters};}
  const W=parseNum(st?.watt),X=parseNum(st?.extraW)||0;
  if(!(W>0)&&!(X>0))return {kwh:NaN,measured:false,meters};
  const hv=parseNum(run.lightVeg)||18,hb=parseNum(run.lightBloom)||12;
  const end=(I.phases.find(p=>p.type==='Ernte')||{}).date||todayISO();
  let kwh=0,days=0;
  for(let d=run.start;d<=end&&days<400;d=addDays(d,1)){days++;const J=runInfo(run,d);const h=J.phaseIdx<=1?hv:J.phaseIdx<=3?hb:0;kwh+=((W>0?W:0)*h+X*24)/1000;}
  return {kwh,measured:false,days,hv,hb,W,X,meters};
}
function costCalc(run){
  const prices=getSet('prices',{}),kwhP=parseNum(getSet('kwh',''));
  const U1=feedUsage(run);let fert=0,fertKnown=true;
  U1.items.forEach(it=>{const p=prices[it.name.toLowerCase()];const size=parseNum(p?.size),price=parseNum(p?.price);if(size>0&&price>=0&&!isNaN(price)){it.cost=it.amount/size*price;fert+=it.cost;}else fertKnown=false;});
  const pw=powerUse(run);const power=!isNaN(pw.kwh)&&kwhP>=0&&!isNaN(kwhP)?pw.kwh*kwhP:NaN;
  const ex=S.expenses.filter(e=>e.runId===run.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const exSum=ex.reduce((s,e)=>s+(parseNum(e.amount)||0),0);
  const plants=S.plants.filter(p=>p.runId===run.id);const dryPl=plants.map(p=>parseNum(p.review?.dry)).filter(n=>!isNaN(n));
  const dry=!isNaN(parseNum(run.harvest?.dry))?parseNum(run.harvest.dry):(dryPl.length?dryPl.reduce((a,b)=>a+b,0):NaN);
  const total=fert+(isNaN(power)?0:power)+exSum;
  return {usage:U1,fert,fertKnown,pw,power,kwhP,ex,exSum,total,dry,perG:dry>0&&total>0?total/dry:NaN,prices};
}

/* Mischung speichern: tatsächliche Mengen */
function feedSaveSheet(){
  const run=activeRun(),plan=curPlan();const week=plan&&plan.weeks.find(w=>w.id===U.weekId);const tank=parseNum(U.tankL);
  if(!run||!week||isNaN(tank))return toast('Plan, Woche und Wassermenge angeben');
  const rows=feedCalc(plan,week,tank,U.pos);
  const st=byId('setups',run.setupId),b=baseEc(st),r=parseRange(week.ec);
  const tgt=plan.ecPlus&&r&&!isNaN(b)?fmtR([r[0]+b,r[1]+b]):week.ec||'–';
  openSheet('Mischung speichern',
   `<p class="muted small">${esc(plan.name)} · ${esc(weekLabel(week))} · Ziel-EC ${esc(tgt)}${plan.ecPlus&&!isNaN(b)?' (gesamt)':''} · pH ${esc(week.ph||'–')}</p>
   ${fld('Wasser im Tank (L)',dec('tank',String(tank)))}
   <div class="card stack" style="gap:10px"><span class="sec">Tatsächlich zugegeben</span><p class="note">Vorbelegt mit dem Rechner. Trag ein, was du wirklich gemischt hast – nur diese Werte zählen für Verbrauch und Kosten.</p>
   ${rows.map((x,i)=>`<div class="row" style="flex-wrap:nowrap"><span class="grow">${esc(x.name)}</span><input name="a_${i}" value="${x.amount>=100?Math.round(x.amount):+x.amount.toFixed(1)}" inputmode="decimal" style="width:92px" aria-label="${esc(x.name)} Menge"><span class="small muted" style="width:22px">${esc(x.unit)}</span></div>`).join('')}
   <div class="row" style="flex-wrap:nowrap"><input name="xName" placeholder="Weiteres Produkt" style="flex:1;min-width:0"><input name="xAmt" inputmode="decimal" placeholder="Menge" style="width:92px"><select name="xUnit" style="width:64px"><option>ml</option><option>g</option></select></div></div>
   <div class="grid2">${fld('EC gemessen',dec('ec','','placeholder="z. B. 2.3"'))}${fld('pH gemessen',dec('ph','','placeholder="z. B. 5.9"'))}</div>
   ${fld('Notiz',inp('note',''))}`,
   'Speichern',
   d=>{
     const amounts=rows.map((x,i)=>({name:x.name,amount:Math.max(0,parseNum(d['a_'+i])||0),unit:x.unit,planned:+x.amount.toFixed(2)})).filter(a=>a.amount>0);
     if(d.xName&&parseNum(d.xAmt)>0)amounts.push({name:d.xName.trim(),amount:parseNum(d.xAmt),unit:d.xUnit||'ml',planned:0});
     const tk=parseNum(d.tank)>0?parseNum(d.tank):tank;
     save('feeds',{id:uid(),runId:run.id,at:nowStamp(),planId:plan.id,planName:plan.name,weekLabel:weekLabel(week),tankL:tk,amounts,userAmounts:true,targetEc:week.ec,targetPh:week.ph,measuredEc:d.ec.replace(',','.'),measuredPh:d.ph.replace(',','.'),note:d.note});
     toast('Mischung gespeichert');
   });
}

function runSheet(run){
  const isNew=!run;
  openSheet(isNew?'Neuer Run':'Run bearbeiten',
   fld('Name',inp('name',run?.name||'','required autofocus placeholder="z. B. Herbst 2026"'))+
   fld('Setup',selHTML('setupId',[['','– ohne –'],...mine('setups').map(s=>[s.id,s.name])],run?.setupId||mine('setups')[0]?.id||''))+
   `<div class="grid2">${fld('Startdatum',inp('start',run?.start||todayISO(),'type="date" required'))}${isNew?fld('Startphase',selHTML('phase',PHASES.slice(0,3),'Keimung')):fld('Medium',inp('medium',run?.medium||''))}</div>`+
   (isNew?fld('Medium',inp('medium','','placeholder="z. B. Kokos, Steinwolle"')):'')+
   `<div class="grid2">${fld('Geplante Veg-Dauer (Wochen)',dec('planVegWeeks',run?.planVegWeeks??'','placeholder="z. B. 4"'))}${fld('Geplante Blütedauer (Tage)',dec('planBloomDays',run?.planBloomDays??'','placeholder="z. B. 63"'))}</div>`+
   `<div class="grid2">${fld('Licht Veg (h/Tag)',dec('lightVeg',run?.lightVeg??'','placeholder="18"'))}${fld('Licht Blüte (h/Tag)',dec('lightBloom',run?.lightBloom??'','placeholder="12"'))}</div><p class="note">Dauern bestimmen Erntedatum und Hinweise, Lichtstunden die Stromschätzung.</p>`,

     const num=k=>{const v=parseNum(d[k]);return v>0?v:'';};
     const extra={planVegWeeks:num('planVegWeeks'),planBloomDays:num('planBloomDays')?Math.round(num('planBloomDays')):'',lightVeg:num('lightVeg'),lightBloom:num('lightBloom')};
     if(isNew){const r={id:uid(),pid:PID(),name:d.name,setupId:d.setupId,start:d.start,medium:d.medium,phases:[{type:d.phase||'Keimung',date:d.start}],harvest:null,...extra};save('runs',r);setActiveRun(r.id);U.weekPlan=null;U.tankL=null;toast('Run angelegt');}
     else{Object.assign(run,{name:d.name,setupId:d.setupId,start:d.start,medium:d.medium,...extra});delete run.example;save('runs',run);toast('Gespeichert');}
   });
}
function plantSheet(p){
  const run=activeRun();if(!run)return;
  const n=S.plants.filter(x=>x.runId===run.id).length+1,strains=mine('strains');
  openSheet(p?'Pflanze bearbeiten':'Neue Pflanze',
   `<datalist id="strainList">${strains.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`+
   fld('Bezeichnung',inp('label',p?.label||`P${n}`,'required autofocus'))+
   fld('Sorte',inp('strain',p?.strain||'','list="strainList" placeholder="aus deiner Genetik oder neu"'))+
   `<div class="grid2">${fld('Breeder',inp('breeder',p?.breeder||''))}${fld('Cut / Pheno',inp('cut',p?.cut||''))}</div>`+
   `<div class="grid2">${fld('Herkunft',selHTML('source',['Samen','Steckling'],p?.source||'Samen'))}${fld('Status',selHTML('active',[['1','aktiv'],['0','inaktiv']],p&&!p.active?'0':'1'))}</div>`+
   (!p&&strains.some(s=>parseNum(s.seeds)>0)?`<label class="check"><input type="checkbox" name="useSeed" checked> Samen aus dem Bestand abziehen (wenn Sorte aus der Genetik)</label>`:'')+
   (p?`<button type="button" class="btn danger" data-act="del" data-store="plants" data-id="${p.id}" data-confirm>Pflanze löschen</button>`:''),
   'Speichern',
   d=>{
     if(!d.label){toast('Bezeichnung angeben');return false;}
     const isNew=!p;
     const s=strainByName(d.strain);let msg='Pflanze gespeichert';
     if(s&&!d.breeder)d.breeder=s.breeder||'';
     const o=Object.assign(p||{id:uid(),runId:run.id},{label:d.label,strain:d.strain,breeder:d.breeder,cut:d.cut,source:d.source,active:d.active==='1'});
     save('plants',o);
     if(isNew){U.photoPlant=o.id;U.mKind='all';msg+=' · Medien-Filter ist schon auf diese Pflanze eingestellt';}
     if(s){
       if(!p&&d.useSeed&&d.source==='Samen'&&parseNum(s.seeds)>0){s.seeds=String(parseNum(s.seeds)-1);save('strains',s);msg=`Gespeichert · noch ${s.seeds} Samen`;}
       if(!run.planBloomDays&&parseNum(s.flower)>0){run.planBloomDays=Math.round(parseNum(s.flower));save('runs',run);msg+=` · Blütedauer ${run.planBloomDays} Tage übernommen`;}
     }
     toast(msg);
   });
}

function strainHist(s){
  const k=s.name.trim().toLowerCase();
  const pl=S.plants.filter(p=>p.pid===PID()&&String(p.strain||'').trim().toLowerCase()===k);
  const runs=[...new Set(pl.map(p=>p.runId))].map(id=>byId('runs',id)).filter(Boolean);
  const dry=pl.map(p=>parseNum(p.review?.dry)).filter(v=>!isNaN(v)),rat=pl.map(p=>avgRating(p.review)).filter(v=>v>0);
  return {pl,runs,dry:dry.length?dry.reduce((a,b)=>a+b,0)/dry.length:NaN,rating:rat.length?rat.reduce((a,b)=>a+b,0)/rat.length:0};
}
function strainRank(){
  return mine('strains').map(s=>({s,h:strainHist(s)})).filter(x=>x.h.rating>0).sort((a,b)=>b.h.rating-a.h.rating);
}

function cutSheet(id){

U.tl={open:false,plant:'',fps:2,i:0,playing:false,timer:null,busy:false};
function tlList(){const run=activeRun();if(!run)return [];return S.photos.filter(p=>p.runId===run.id&&p.kind!=='video'&&(!U.tl.plant||p.plantId===U.tl.plant)).sort((a,b)=>(a.date+a.at).localeCompare(b.date+b.at));}
function tlStop(){clearInterval(U.tl.timer);U.tl.timer=null;U.tl.playing=false;}
function renderTl(){
  const v=$('#viewer');const run=activeRun();
  if(!U.tl.open||!run){tlStop();return;}
  const list=tlList();U.tl.i=Math.min(U.tl.i,Math.max(0,list.length-1));
  v.hidden=false;
  v.innerHTML=`<div class="v-bar"><b id="tlTitle">Zeitraffer · ${list.length?U.tl.i+1:0}/${list.length}</b><button class="icon-btn" data-act="tlClose" aria-label="Schließen">✕</button></div>
  <div class="v-img">${list.length?'<img id="tlImg" alt="">':'<p>Keine Fotos für diese Auswahl.</p>'}</div>
  <div class="v-meta" id="tlMeta"></div>
  <div class="stack" style="gap:10px;padding-bottom:6px">
    <input type="range" id="tlPos" min="0" max="${Math.max(0,list.length-1)}" value="${U.tl.i}" aria-label="Position">
    <div class="row" style="flex-wrap:nowrap"><select id="tlPlant" style="flex:1;background:#1C2720;color:#EEF3EC;border-color:#33433A">${plantOpts(run.id,'Ganzes Zelt').map(([k,l])=>`<option value="${esc(k)}" ${k===U.tl.plant?'selected':''}>${esc(l)}</option>`).join('')}</select><select id="tlFps" style="width:120px;background:#1C2720;color:#EEF3EC;border-color:#33433A">${[1,2,4,8].map(f=>`<option value="${f}" ${f===U.tl.fps?'selected':''}>${f} Bilder/s</option>`).join('')}</select></div>
    <div class="row between"><button class="btn small primary" data-act="tlPlay" ${list.length<2?'disabled':''}>${U.tl.playing?'Pause':'Abspielen'}</button><button class="btn small" data-act="tlExport" ${list.length<2||U.tl.busy?'disabled':''}>Als Video speichern</button></div>
    <p class="v-meta" id="tlMsg" aria-live="polite"></p>
  </div>`;
  tlShow(U.tl.i);
}
async function tlShow(i){
  const list=tlList();if(!list.length)return;U.tl.i=i;const p=list[i],run=activeRun(),I=runInfo(run,p.date);
  const u=await mediaURL(p.id);const img=$('#tlImg');if(img&&U.tl.i===i)img.src=u;
  const m=$('#tlMeta');if(m)m.textContent=`${fmtDate(p.date)} · Tag ${I.day}${I.bloomDay?' · Blüte Tag '+I.bloomDay:''}${p.plantId?' · '+plantName(p.plantId):''}`;
  const t=$('#tlTitle');if(t)t.textContent=`Zeitraffer · ${i+1}/${list.length}`;
  const r=$('#tlPos');if(r)r.value=i;
}
function tlPlay(){
  if(U.tl.playing){tlStop();renderTl();return;}
  const list=tlList();if(list.length<2)return;
  list.forEach(p=>mediaURL(p.id));
  U.tl.playing=true;if(U.tl.i>=list.length-1)U.tl.i=0;
  const b=$('[data-act=tlPlay]');if(b)b.textContent='Pause';
  U.tl.timer=setInterval(()=>{const n=tlList().length;const ni=U.tl.i+1;if(ni>=n){tlStop();const bb=$('[data-act=tlPlay]');if(bb)bb.textContent='Abspielen';return;}tlShow(ni);},1000/U.tl.fps);
}
async function tlExport(){
  const list=tlList(),run=activeRun();if(list.length<2||U.tl.busy)return;
  const msg=t=>{const m=$('#tlMsg');if(m)m.textContent=t;};
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mt=window.MediaRecorder&&types.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}});
  if(!mt){msg('Video-Export wird von diesem Browser nicht unterstützt.');return;}
  U.tl.busy=true;tlStop();msg('Lade Fotos …');
  try{
    const imgs=[];for(const p of list){const u=await mediaURL(p.id);const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>r(null);x.src=u;});if(im)imgs.push([im,p]);}
    const f=imgs[0][0];const ar=f.naturalHeight/f.naturalWidth;const W=720,H=Math.min(1280,Math.max(404,Math.round(W*ar/2)*2));
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const stream=c.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:4000000});
    const ch=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};const stopped=new Promise(r=>{rec.onstop=r;});
    rec.start(500);
    for(let i=0;i<imgs.length;i++){
      const [im,p]=imgs[i],I=runInfo(run,p.date);
      x.fillStyle='#0B0F0C';x.fillRect(0,0,W,H);
      const s=Math.min(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      const label=`${fmtShort(p.date)} · Tag ${I.day}${I.bloomDay?' · Blüte '+I.bloomDay:''}`;
      x.font='600 26px system-ui,sans-serif';const tw=x.measureText(label).width;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(16,H-60,tw+28,44);x.fillStyle='#fff';x.fillText(label,30,H-29);
      msg(`Erstelle Video … ${i+1}/${imgs.length}`);
      await sleep(1000/U.tl.fps);
    }
    await sleep(600);rec.stop();await stopped;
    const blob=new Blob(ch,{type:'video/webm'});msg(`Fertig · ${fmtMB(blob.size)}`);
    await offerFile(`zeltbuch-zeitraffer-${slug(run.name)}.webm`,blob,'Zeitraffer gespeichert');
  }catch(e){console.error(e);msg('Video konnte nicht erstellt werden.');}
  U.tl.busy=false;const b=$('[data-act=tlExport]');if(b)b.disabled=false;
}

async function sbSignOut(){if(!sb)return;await sb.auth.signOut();sbUser=null;render();}
function sbQueuePush(store,id){
  if(!sbUser||!sb)return;
  sbQueue.add(store+'::'+id);
  clearTimeout(sbPushTimer);sbPushTimer=setTimeout(sbFlushPush,900);
}
async function sbFlushPush(){
  if(!sbUser||!sb||!sbQueue.size)return;
  const items=[...sbQueue];sbQueue.clear();
  for(const key of items){
    const i=key.indexOf('::'),store=key.slice(0,i),id=key.slice(i+2);
    const obj=byId(store,id);
    try{
      if(!obj)await sb.from('records').delete().match({store,id,user_id:sbUser.id});
      else await sb.from('records').upsert({store,id,user_id:sbUser.id,data:obj,updated_at:new Date().toISOString()});
    }catch(e){console.error('cloud push',e);sbLastErr=e.message||String(e);}
  }
}
async function sbPullAll(){
  if(!sbUser||!sb||sbBusy)return;
  sbBusy=true;if(U.screen==='settings')render();
  try{
    const{data,error}=await sb.from('records').select('store,id,data,updated_at').eq('user_id',sbUser.id);
    if(error){sbLastErr=error.message;}
    else if(data){
      for(const row of data){
        if(!SYNC_STORES.includes(row.store))continue;
        const local=byId(row.store,row.id);
        const remoteT=+new Date(row.updated_at),localT=local&&local._syncedAt?+new Date(local._syncedAt):0;
        if(!local||remoteT>localT){await save(row.store,{...row.data,id:row.id,pid:PID(),_syncedAt:row.updated_at},true);}
      }
      toast('Cloud-Sync abgeschlossen');
    }
  }catch(e){console.error('cloud pull',e);sbLastErr=e.message||String(e);}
  sbBusy=false;render();
}

/* wrap save/remove to also push to the cloud */
(()=>{
  const _save=save,_remove=remove;
  save=(store,obj,skipPush)=>{const r=_save(store,obj);if(!skipPush&&SYNC_STORES.includes(store)&&obj&&obj.id)sbQueuePush(store,obj.id);return r;};
  remove=(store,id)=>{const r=_remove(store,id);if(SYNC_STORES.includes(store))sbQueuePush(store,id);return r;};
})();

boot();
sbInit();
</script>

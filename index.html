<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B7A4B">
<meta name="description" content="Privates Grow-Journal fuer den Eigenanbau">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Zeltbuch">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Zeltbuch</title>
<script>
/* Content-Security-Policy nur außerhalb der Claude-Umgebung (dort würde sie die Claude-Schnittstellen blockieren).
   Begrenzt, wohin die App Daten schicken darf: nur Supabase, Bilder nur von Unsplash. */
(function(){try{if(/claude|anthropic/i.test(location.hostname)||location.protocol==='file:')return;
  var m=document.createElement('meta');m.httpEquiv='Content-Security-Policy';
  m.content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://images.unsplash.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'";
  document.head.appendChild(m);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Sedgwick+Ave+Display&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Sedgwick+Ave+Display&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#F1F4EF; --surface:#FFFFFF; --surface2:#F6F8F4; --ink:#17211A; --muted:#5B6860; --line:#E0E6DC; --line2:#C9D2C4;
  --accent:#2B7A4B; --accent-ink:#FFFFFF; --accent-soft:#E2F0E6; --lime:#C6EC8C;
  --violet:#6F4FB6; --violet-soft:#EEE8F8; --warn:#A76300; --warn-soft:#FCEFD8; --bad:#BD3B2C; --bad-soft:#FBE3DF;
  --blue:#2D6CA8; --blue-soft:#E1ECF7; --shadow:0 1px 2px rgba(23,33,26,.05),0 6px 18px rgba(23,33,26,.05);
  --tag:"Sedgwick Ave Display","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1311; --surface:#171E1A; --surface2:#1D2520; --ink:#E5ECE6; --muted:#97A49B; --line:#26302A; --line2:#35403A;
    --accent:#5DBB80; --accent-ink:#0B120E; --accent-soft:#1B3325; --lime:#3F5F28;
    --violet:#A98DEA; --violet-soft:#2A2340; --warn:#E8A94C; --warn-soft:#382A12; --bad:#EE7B6C; --bad-soft:#3C1E1A;
    --blue:#7DAEE3; --blue-soft:#162739; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1311; --surface:#171E1A; --surface2:#1D2520; --ink:#E5ECE6; --muted:#97A49B; --line:#26302A; --line2:#35403A;
  --accent:#5DBB80; --accent-ink:#0B120E; --accent-soft:#1B3325; --lime:#3F5F28;
  --violet:#A98DEA; --violet-soft:#2A2340; --warn:#E8A94C; --warn-soft:#382A12; --bad:#EE7B6C; --bad-soft:#3C1E1A;
  --blue:#7DAEE3; --blue-soft:#162739; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
p{margin:0}
a{color:var(--blue);text-underline-offset:2px}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:14px;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
main{display:flex;flex-direction:column;gap:20px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brand{font:31px/1 var(--tag);color:var(--ink);align-self:flex-start;padding:0 4px;margin-left:-4px;background:linear-gradient(transparent 58%,var(--lime) 58%,var(--lime) 92%,transparent 92%)}
.page-t{font:29px/1.25 var(--tag);padding-top:2px;color:var(--ink);overflow-wrap:anywhere}
.run-sub{border:0;background:none;padding:0;color:var(--muted);font:14px var(--body);text-align:left;display:inline-flex;align-items:center;gap:4px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.avatar-btn{border:0;background:none;padding:0;display:inline-flex;flex:none;border-radius:50%}
.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#17211A;font:700 1em/1 var(--body);flex:none;overflow:hidden;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--line2)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.sec{font:700 12px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:36px}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:24px}
.greet{font-size:15px;color:var(--muted)}

/* run hero */
.hero{display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center}
.illo{display:inline-block;flex:none}
.illo svg{display:block;width:100%;height:100%;overflow:visible}
.illo.lg{width:92px;height:92px;border-radius:24px;background:var(--accent-soft);padding:6px}
.illo.xs{width:28px;height:28px}
.hero h2{font-size:20px;overflow-wrap:anywhere}
.day{font:700 34px/1 var(--body);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.day small{font-size:15px;font-weight:400;color:var(--muted);letter-spacing:0;margin-left:6px}
.bar{height:8px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.v i{background:var(--violet)} .bar.lo i{background:var(--blue)} .bar.hi i{background:var(--warn)} .bar.ok i{background:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);color:var(--ink);min-height:118px;font:inherit;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ti{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile .ti.v{background:var(--violet-soft);color:var(--violet)} .tile .ti.b{background:var(--blue-soft);color:var(--blue)} .tile .ti.w{background:var(--warn-soft);color:var(--warn)} .tile .ti.r{background:var(--bad-soft);color:var(--bad)} .tile .ti.n{background:var(--surface2);color:var(--muted)}
.tile b{font-size:16px;line-height:1.2}
.tile .s{font-size:13px;color:var(--muted);line-height:1.3}
.tile .s.hot{color:var(--bad);font-weight:700}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:700 12px/1 var(--body);padding:6px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.v{background:var(--violet-soft);color:var(--violet)} .chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--bad-soft);color:var(--bad)} .chip.l{background:var(--blue-soft);color:var(--blue)} .chip.n{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}

/* buttons */
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:700 15px var(--body);text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.armed{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex:none;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pi{width:20px;height:20px;flex:none}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding-block:12px;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .t{font-weight:700}
.li .d{font-size:14px;color:var(--muted)}
.alert{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;align-items:center;color:inherit;font:inherit;cursor:pointer}
.alert:first-child{border-top:0}
.task{align-items:center}
.task-body{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;color:inherit;font:inherit}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:var(--surface);flex:none;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--muted)}
.tick:hover,.tick:focus-visible{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.entry p{white-space:pre-wrap;overflow-wrap:anywhere}
.dayhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0 8px}
.dayhead:first-child{margin-top:0}

/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font:700 13px var(--body);color:var(--muted)}
.filepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filepick .btn{flex:none}
.filepick .small{overflow-wrap:anywhere}
.vh-file{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;white-space:nowrap;border:0;opacity:0;min-height:0}
.starpick{display:inline-flex;flex-direction:row-reverse;gap:2px;position:relative}
.starpick input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;opacity:0;min-height:0}
.starpick label{position:relative;z-index:1;font-size:30px;line-height:1;cursor:pointer;color:var(--line2);padding:2px}
.starpick input:checked ~ label,.starpick label:hover,.starpick label:hover ~ label{color:#E0A100}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;min-height:44px;padding:8px 11px;width:100%;min-width:0}
textarea{min-height:88px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:0;accent-color:var(--accent);flex:none}
input[type=range]{min-height:0;padding:0;border:0;background:none;accent-color:var(--accent);height:28px}
input[type=file]{padding:9px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.seg-ctl{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:3px;gap:2px}
.seg-ctl button{border:0;background:transparent;padding:6px 12px;min-height:34px;border-radius:99px;font:700 13px var(--body);color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}
.swatch{position:relative;display:inline-flex}
.swatch input{position:absolute;opacity:0;width:1px;height:1px}
.swatch span{width:34px;height:34px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.12)}
.swatch input:checked+span{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.swatch input:focus-visible+span{outline:3px solid var(--accent);outline-offset:4px}

/* tables */
.tbl-wrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td.amt{font:600 18px var(--mono);white-space:nowrap}
.ord{font:700 13px var(--mono);color:var(--muted)}
.edit-tbl td{padding:4px}
.edit-tbl input,.edit-tbl select{min-height:38px;padding:6px;font-size:14px}
.edit-tbl .w-n{width:52px} .edit-tbl .w-d{width:72px} .edit-tbl .w-ph{width:92px}
.targets{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.tgt{flex:1 1 120px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.tgt .k{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tgt .v{font:600 22px var(--mono)}
table.rep th{white-space:normal;width:38%;vertical-align:top;padding:9px 8px 9px 0;border-bottom:1px solid var(--line)}
table.rep tr:last-child th,table.rep tr:last-child td{border-bottom:0}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0}
.stat .k{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 22px var(--mono)}
.stat .s{font-size:13px;color:var(--muted)}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* trichomes, stars */
.tri{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.tri i{display:block;height:100%}
.tri .c{background:#BFE3F2} .tri .m{background:#E6E1D6} .tri .a{background:#E99A2E}
.tri-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tri-legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.warn-txt{color:var(--warn)}
.stars{color:#E0A100;letter-spacing:1px;white-space:nowrap}

/* media */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mgrid button{position:relative;padding:0;border:0;aspect-ratio:1;overflow:hidden;border-radius:10px;background:var(--surface2)}
.mgrid img{width:100%;height:100%;object-fit:cover;display:block}
.mgrid img:not([src]){visibility:hidden}
.mgrid .badge{position:absolute;left:5px;bottom:5px;font:700 11px/1 var(--body);background:rgba(12,18,14,.72);color:#fff;padding:4px 6px;border-radius:6px}
.mgrid .vb{position:absolute;right:5px;bottom:5px;font:700 11px/1 var(--body);background:rgba(12,18,14,.72);color:#fff;padding:4px 6px;border-radius:6px}
.mgrid .sel{position:absolute;right:5px;top:5px;font:700 11px/1 var(--body);background:var(--violet);color:#fff;padding:4px 6px;border-radius:6px}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(6,9,7,.96);color:#EEF3EC;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer .v-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:6px}
.viewer img,.viewer video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000}
.viewer .cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;height:100%}
.viewer .cmp figure{margin:0;display:flex;flex-direction:column;gap:6px;min-height:0}
.viewer .cmp img{flex:1;min-height:0;width:100%}
.viewer .cmp figcaption{font-size:13px;text-align:center}
.viewer .v-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:8px}
.viewer .v-meta{font-size:14px;color:#B9C6B8;text-align:center;padding-block:6px}
.viewer .btn,.viewer .icon-btn{background:#1C2720;border-color:#33433A;color:#EEF3EC}
.viewer .btn.primary{background:#5DBB80;border-color:#5DBB80;color:#0B120E}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

/* calendar */
.cal-head{display:flex;align-items:center;gap:4px}
.cal-head .icon-btn{width:36px}
.cal-head select{width:auto;min-height:40px;padding:6px 4px;min-width:0;font-size:15px}
.cal-head #calM{flex:1 1 128px} .cal-head #calY{flex:0 0 82px}
.cal-head .btn.small{padding:0 8px}
.cal-card{padding:10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:700 12px var(--body);color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{position:relative;aspect-ratio:1/1.16;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px 4px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;color:var(--ink);overflow:hidden;min-width:0}
.cal .d .n{font:700 14px/1.1 var(--body);font-variant-numeric:tabular-nums}
.cal .d .rd{position:absolute;top:4px;right:4px;font:9px/1 var(--mono);color:var(--muted)}
.cal .d .mk{position:absolute;top:16px;right:4px;font-size:10px;line-height:1;color:var(--warn)}
.cal .d .dots{display:flex;gap:2px;flex-wrap:wrap;min-height:6px}
.cal .d .n{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.cal .d .n .rdot{box-shadow:0 0 0 1.5px var(--surface)}
.rbars{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:1px}
.cal .rbars i{display:block;width:auto;height:4px;border-radius:0}
.cal .rbars i:last-child{border-radius:0 0 9px 9px}
.cal .d.fut .rbars{opacity:.45}
.rdot{display:inline-block;border-radius:50%;flex:none}
.run-row .rbar{height:6px}
.run-row.cur{background:var(--accent-soft);border-radius:12px;margin-inline:-8px;padding-inline:8px;border-top-color:transparent}
.phase-list .chip{min-width:78px;justify-content:center}
details summary{cursor:pointer;font-weight:700}
.cal .d.today{border:2px solid var(--ink)}
.cal .d.sel{background:var(--accent-soft);border-color:var(--accent)}
.cal i,.cal-legend .dot{display:inline-block;width:6px;height:6px;border-radius:50%}
.de{background:var(--ink)} .dp{background:#D8457F} .df{background:#2D8FD8} .dt{background:#E0892A}
.cal-legend{margin-top:10px;font-size:12px}
.cal-legend i{width:12px;height:4px;border-radius:2px}
.cal-legend i.dot{width:8px;height:8px;border-radius:50%}
.cal-legend .sep{flex-basis:100%;height:0}

/* coach */

.plist{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:6px}

.pad{display:grid;grid-template-columns:repeat(3,74px);gap:14px;justify-content:center}
.pad button{height:74px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 26px var(--body);box-shadow:var(--shadow)}

@media (min-width:560px){.btiles{grid-template-columns:repeat(3,1fr)}.btile.wide{grid-column:span 2}}

<body>
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="bottom" aria-label="Hauptnavigation"><div class="in" id="nav"></div></nav>
<button class="fab" id="fab" data-act="quickAdd" aria-label="Schnell hinzufügen" hidden></button>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-act="close"></div>
  <form class="sheet-card" id="sheetForm" novalidate>
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button type="button" class="icon-btn" data-act="close" aria-label="Schließen">✕</button></div>
    <div id="sheetBody" class="stack"></div>
  </form>
</div>
<div class="viewer" id="viewer" hidden></div>
<div class="lock" id="lock" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= Zeltbuch v5 ================= */
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const DAY=86400000;
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const nowStamp=()=>{const d=new Date();return `${isoOf(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const parseD=iso=>new Date(String(iso).slice(0,10)+'T00:00:00');
const addDays=(iso,n)=>{const d=parseD(iso);d.setDate(d.getDate()+n);return isoOf(d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/DAY);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parseNum=s=>{if(s===null||s===undefined)return NaN;const t=String(s).trim().replace(',','.');return t===''?NaN:Number(t);};
const fmtDate=iso=>parseD(iso).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'});
const fmtLong=iso=>parseD(iso).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fmtShort=iso=>parseD(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});
const fmtTime=st=>st&&st.length>10?st.slice(11,16):'';
const fmtDE=(n,d=1)=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:d,minimumFractionDigits:0});
const fmtAmt=n=>n>=100?fmtDE(n,0):fmtDE(n,1);
const fmtP=(n,d=2)=>Number(n).toFixed(d);
const fmtMB=b=>b>=1048576?`${fmtDE(b/1048576,1)} MB`:`${fmtDE(b/1024,0)} KB`;
const fmtDur=s=>{s=Math.round(s||0);return `${Math.floor(s/60)}:${pad(s%60)}`;};
const plural=(n,s,p)=>`${n} ${n===1?s:p}`;
const fmtRel=iso=>{const d=daysBetween(todayISO(),iso);return d<0?`${-d} ${d===-1?'Tag':'Tage'} überfällig`:d===0?'heute':d===1?'morgen':`in ${d} Tagen`;};
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'zeltbuch';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- Krypto (WebCrypto: PBKDF2 + AES-GCM) ---------- */
const te=new TextEncoder(),td=new TextDecoder();
const CRYPTO_OK=!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=buf=>{const a=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=str=>{const bin=atob(str);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;};
const KDF_ITER=310000;
async function deriveKey(secret,salt,iter){const base=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encBytes(key,bytes){const iv=rnd(12);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv,ct};}
const decBytes=(key,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
async function legacyHash(pin,salt){const h=await crypto.subtle.digest('SHA-256',te.encode(salt+':'+pin));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');}

/* ---------- IndexedDB ---------- */
const REC_STORES=['setups','runs','plants','entries','photos','plans','feeds','climate','tasks','steer','strains','expenses','meters','settings'];
const ALL_STORES=['profiles',...REC_STORES,'media','meta'];
let idb=null,memOnly=false;
const S={profiles:[]};REC_STORES.forEach(s=>S[s]=[]);
let ENC={};REC_STORES.forEach(s=>ENC[s]=[]);
const KEYS={};
let META={id:'app',runBy:{},fails:{}};
function openDB(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open('zeltbuch',4);}catch(e){rej(e);return;}
  r.onupgradeneeded=()=>{const db=r.result;ALL_STORES.forEach(s=>{if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'});});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
function dbAll(s){if(!idb)return Promise.resolve([]);return new Promise((res,rej)=>{try{const q=idb.transaction(s).objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});}
/* Liest mehrere Stores in EINER Transaktion – deutlich schneller beim Start als nacheinander */
function dbAllMany(stores){if(!idb)return Promise.resolve({});return new Promise((res,rej)=>{try{const t=idb.transaction(stores),out={};stores.forEach(s=>{const q=t.objectStore(s).getAll();q.onsuccess=()=>{out[s]=q.result||[];};});t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}});}
function dbGet(s,id){if(!idb)return Promise.resolve(MEM_MEDIA.get(id)||null);return new Promise((res,rej)=>{try{const q=idb.transaction(s).objectStore(s).get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error);}catch(e){rej(e);}});}
function dbDo(s,fn){if(!idb)return Promise.resolve();return new Promise((res,rej)=>{try{const t=idb.transaction(s,'readwrite');fn(t.objectStore(s));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}});}
const MEM_MEDIA=new Map();
let WQ=Promise.resolve();
function enqueue(fn){WQ=WQ.then(fn).catch(e=>{console.error(e);toast('Speichern fehlgeschlagen – ist der Speicher voll?');});return WQ;}
const flush=()=>WQ;
const byId=(store,id)=>S[store].find(x=>x.id===id);
function upsertMem(store,obj){const a=S[store];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);}
function keyFor(pid){const p=byId('profiles',pid);if(!p||!p.enc)return null;return KEYS[pid]||false;}
function save(store,obj){
  upsertMem(store,obj);
  if(store==='profiles'){const snap=JSON.parse(JSON.stringify(obj));return enqueue(()=>dbDo('profiles',st=>st.put(snap)));}
  if(!obj.pid)obj.pid=PID();
  const json=JSON.stringify(obj),id=obj.id,pid=obj.pid;
  return enqueue(async()=>{
    const key=keyFor(pid);
    if(key===false)throw new Error('Profil ist gesperrt');
    if(key){const {iv,ct}=await encBytes(key,te.encode(json));await dbDo(store,st=>st.put({id,pid,_e:1,iv,ct}));}
    else await dbDo(store,st=>st.put(JSON.parse(json)));
  });
}
function remove(store,id){S[store]=S[store].filter(x=>x.id!==id);return enqueue(()=>dbDo(store,st=>st.delete(id)));}
function saveMeta(){const snap=JSON.parse(JSON.stringify(META));return enqueue(()=>dbDo('meta',st=>st.put(snap)));}

/* Medien (Blobs, getrennt von den Metadaten) */
const MEDIA_URL=new Map();
function saveMedia(id,pid,blob){
  return enqueue(async()=>{
    const key=keyFor(pid);if(key===false)throw new Error('Profil ist gesperrt');
    if(!idb){MEM_MEDIA.set(id,{id,pid,blob});return;}
    if(key){const buf=new Uint8Array(await blob.arrayBuffer());const {iv,ct}=await encBytes(key,buf);await dbDo('media',st=>st.put({id,pid,_e:1,iv,ct,type:blob.type||''}));}
    else await dbDo('media',st=>st.put({id,pid,blob}));
  });
}
async function loadMedia(id){
  const row=await dbGet('media',id);if(!row)return null;
  if(row._e){const key=KEYS[row.pid];if(!key)return null;const buf=await decBytes(key,row.iv,row.ct);return new Blob([buf],{type:row.type||''});}
  return row.blob||null;
}
async function mediaURL(id){if(MEDIA_URL.has(id))return MEDIA_URL.get(id);let b=null;try{b=await loadMedia(id);}catch(e){console.error(e);}if(!b)return '';const u=URL.createObjectURL(b);MEDIA_URL.set(id,u);return u;}
function dropMediaURLs(){MEDIA_URL.forEach(u=>URL.revokeObjectURL(u));MEDIA_URL.clear();}
function removeMedia(id){const ids=[id,id+'_t'];ids.forEach(k=>{const u=MEDIA_URL.get(k);if(u){URL.revokeObjectURL(u);MEDIA_URL.delete(k);}MEM_MEDIA.delete(k);});return enqueue(()=>dbDo('media',st=>ids.forEach(k=>st.delete(k))));}
async function loadMediaEl(el){
  if(el.dataset.loaded)return;el.dataset.loaded='1';
  let u=await mediaURL(el.dataset.media);
  if(!u&&el.dataset.fallback)u=await mediaURL(el.dataset.fallback);
  if(!u){el.closest('button')?.classList.add('missing');return;}
  if(el.isConnected)el.src=u;
}
/* Lädt (und entschlüsselt) Bilder erst, wenn sie in die Nähe des sichtbaren Bereichs kommen */
const mediaIO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){mediaIO.unobserve(e.target);loadMediaEl(e.target);}}),{rootMargin:'300px 0px'}):null;
function hydrateMedia(root=document){
  $$('[data-media]:not([data-loaded])',root).forEach(el=>{
    if(mediaIO&&el.tagName==='IMG'&&!el.closest('.viewer'))mediaIO.observe(el);else loadMediaEl(el);
  });
}

/* ---------- Profile, Sperre & Verschlüsselung ---------- */
const PCOLORS=['#9BD36B','#F28AB2','#7DB6EA','#F4A259','#F2D36B','#B79CF0'];
const PID=()=>META.activeProfile;
const profile=()=>byId('profiles',PID());
const mine=st=>S[st].filter(x=>x.pid===PID());
function activeRun(){const id=META.runBy&&META.runBy[PID()];const r=byId('runs',id);if(r&&r.pid===PID())return r;return liveRuns()[0]||mine('runs')[0]||null;}
/* ---------- v9: Runs (Farbe, Enddatum, Archiv) & Strains ---------- */
const RUN_COLORS=['#2B9A5B','#D8457F','#2D7CC8','#E0892A','#8A5CD6','#0F9D9A','#D64534','#A07A3C','#6E9E00','#C2185B'];

/* Entschlüsselt alle Datensätze eines Profils parallel (statt einzeln nacheinander) */
async function decryptAll(pid,key){
  const jobs=[];
  for(const st of REC_STORES)for(const r of ENC[st])if(r.pid===pid)jobs.push([st,r]);
  const out=await Promise.all(jobs.map(([st,r])=>decBytes(key,r.iv,r.ct).then(b=>[st,JSON.parse(td.decode(b))]).catch(()=>{console.error('Entschlüsseln fehlgeschlagen',st,r.id);return null;})));
  out.forEach(x=>{if(x)upsertMem(x[0],x[1]);});
}
async function unlock(pid,secret){
  const p=byId('profiles',pid);if(!p)return false;
  if(p.enc&&p.lock){
    let key;
    try{key=await deriveKey(secret,unb64(p.lock.salt),p.lock.iter);const chk=await decBytes(key,unb64(p.lock.iv),unb64(p.lock.check));if(td.decode(chk)!=='zeltbuch-ok')return false;}catch(e){return false;}
    KEYS[pid]=key;
    await decryptAll(pid,key);
    return true;
  }
  if(p.pinHash){
    if(await legacyHash(secret,p.pinSalt)!==p.pinHash)return false;
    await setLock(pid,secret,'pin');
    return true;
  }
  return true;
}
async function lockMem(pid){

async function setLock(pid,secret,type,onProg){
  const p=byId('profiles',pid);if(!p)return;
  if(!CRYPTO_OK)throw new Error('Dieses Gerät unterstützt keine Verschlüsselung');
  await flush();
  const oldKey=KEYS[pid]||null;
  const mIds=(await dbAll('media')).filter(r=>r.pid===pid).map(r=>r.id);
  if(secret){
    const salt=rnd(16),key=await deriveKey(secret,salt,KDF_ITER);const {iv,ct}=await encBytes(key,te.encode('zeltbuch-ok'));
    p.lock={type,salt:b64(salt),iter:KDF_ITER,iv:b64(iv),check:b64(ct)};p.enc=true;KEYS[pid]=key;
  }else{delete p.lock;p.enc=false;delete KEYS[pid];}
  delete p.pinHash;delete p.pinSalt;delete p.pinLen;
  await save('profiles',p);
  const recs=REC_STORES.flatMap(st=>S[st].filter(x=>x.pid===pid).map(o=>[st,o]));
  const total=recs.length+mIds.length;let n=0;
  for(const [st,o] of recs){save(st,o,true);if(++n%25===0&&onProg)onProg(n/total);}
  await flush();
  for(const id of mIds){
    const row=await dbGet('media',id);if(!row)continue;
    let blob=row.blob||null;
    if(row._e){if(!oldKey)continue;blob=new Blob([await decBytes(oldKey,row.iv,row.ct)],{type:row.type||''});}
    if(blob){await saveMedia(id,pid,blob);}
    n++;if(onProg)onProg(n/total);
  }
  await flush();await reloadEnc();
}

function sortedPhases(run){return [...(run.phases||[])].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:PHASES.indexOf(a.type)-PHASES.indexOf(b.type));}
function runInfo(run,date=todayISO()){
  if(!run)return null;
  const ph=sortedPhases(run);
  const cur=ph.filter(p=>p.date<=date).pop()||ph[0]||{type:'Keimung'};
  const bloom=ph.find(p=>p.type==='Blüte'), veg=ph.find(p=>p.type==='Veg');
  const bloomDay=bloom&&bloom.date<=date?daysBetween(bloom.date,date)+1:null;
  const vegDay=!bloomDay&&veg&&veg.date<=date?daysBetween(veg.date,date)+1:null;
  const pbd=parseNum(run.planBloomDays), pvw=parseNum(run.planVegWeeks);
  let expHarvest=null,harvestLeft=null,expFlip=null,flipLeft=null;
  if(bloom&&pbd>0){expHarvest=addDays(bloom.date,Math.round(pbd)-1);harvestLeft=daysBetween(date,expHarvest);}
  if(!bloomDay&&veg&&pvw>0){expFlip=addDays(veg.date,Math.round(pvw*7));flipLeft=daysBetween(date,expFlip);}
  return {day:daysBetween(run.start,date)+1,phase:cur.type,phaseIdx:PHASES.indexOf(cur.type),bloomDay,bloomWeek:bloomDay?Math.ceil(bloomDay/7):null,vegDay,vegWeek:vegDay?Math.ceil(vegDay/7):null,phases:ph,expHarvest,harvestLeft,expFlip,flipLeft};
}

function parseRange(v){if(v===undefined||v===null)return null;const s=String(v).trim().replace(/,/g,'.');if(!s||s==='-'||s==='—')return null;const m=s.split(/\s*[-–]\s*/).map(Number).filter(n=>!isNaN(n));if(!m.length)return null;return m.length===1?[m[0],m[0]]:[Math.min(m[0],m[1]),Math.max(m[0],m[1])];}

function suggestWeek(plan,I){
  if(!plan.weeks.length)return null;
  const t=weekTarget(I);if(!t)return plan.weeks[0].id;
  const ws=plan.weeks.filter(w=>w.phase===t.ph);
  if(!ws.length)return plan.weeks[0].id;
  const ex=ws.find(w=>+w.n===t.n);if(ex)return ex.id;
  return (t.n>Math.max(...ws.map(w=>+w.n))?ws[ws.length-1]:ws[0]).id;
}
function missingWeek(plan,I){const t=weekTarget(I);if(!t)return null;const ws=plan.weeks.filter(w=>w.phase===t.ph);if(!ws.length)return null;const max=Math.max(...ws.map(w=>+w.n||0));return t.n>max?{ph:t.ph,n:t.n,max}:null;}
function sortWeeks(p){p.weeks.sort((a,b)=>((PH_ORDER[a.phase]??9)-(PH_ORDER[b.phase]??9))||((+a.n||0)-(+b.n||0)));}
function addWeek(p,phase,n){
  const same=p.weeks.filter(w=>w.phase===phase);
  const src=same[same.length-1]||(phase==='Flush'?null:p.weeks.filter(w=>w.phase!=='Flush').pop());
  const nn=n??((same.length?Math.max(...same.map(w=>+w.n||0)):0)+1);
  const w=src?{...JSON.parse(JSON.stringify(src)),id:uid(),phase,n:nn}:{id:uid(),phase,n:nn,doses:{},ec:'',ph:''};

const AI_PLAN_PROMPT='Das Bild zeigt einen Düngeplan (Feed Chart) eines Dünger-Herstellers. Übertrage ihn exakt in JSON. Regeln: Nur Werte, die im Bild stehen; nichts schätzen oder ergänzen. Rechne Einheiten nicht um: baseL ist die Wassermenge in Litern, auf die sich die Dosen beziehen (1 bei ml/L, 10 bei ml/10 L, 3.785 bei ml pro Gallone). Wochen: phase ist "Veg" für Stecklinge/Wachstum/18 h, "Blüte" für Blüte/12 h, "Flush" für Spülen/nur Wasser; n ist die Wochennummer innerhalb der Phase, beginnend bei 1. Deckt eine Spalte mehrere Wochen ab, lege je Woche einen eigenen Eintrag mit denselben Werten an. Dosis als String: Einzelwert wie "13" oder Spanne wie "8-13"; Produkte ohne Wert in einer Woche weglassen. unit ist "ml" oder "g". Antworte nur mit JSON in dieser Form: {"name":"Hersteller Linie – Medium","maker":"Hersteller","baseL":10,"products":[{"name":"Produkt","unit":"ml"}],"weeks":[{"phase":"Veg","n":1,"doses":{"Produkt":"13"},"ec":"1.2","ph":"5.8-6.2"}],"note":"Hinweise aus dem Bild, z. B. Mischreihenfolge"}';
function aiPlanToPlan(d){
  if(!d||typeof d!=='object'||!Array.isArray(d.products)||!Array.isArray(d.weeks)||!d.weeks.length)throw new Error('format');
  const products=d.products.filter(p=>p&&p.name).map(p=>({id:uid(),name:String(p.name).slice(0,60),unit:p.unit==='g'?'g':'ml'}));
  const byName=Object.fromEntries(products.map(p=>[p.name,p.id]));
  const weeks=d.weeks.filter(w=>w&&WEEK_PHASES.includes(w.phase)).map(w=>{const doses={};Object.entries(w.doses||{}).forEach(([k,v])=>{if(!byName[k]){const np={id:uid(),name:String(k).slice(0,60),unit:'ml'};products.push(np);byName[k]=np.id;}if(v!==null&&v!==undefined&&String(v).trim())doses[byName[k]]=String(v).trim();});return {id:uid(),phase:w.phase,n:parseInt(w.n,10)||1,doses,ec:String(w.ec??'').trim(),ph:String(w.ph??'').trim()};});
  if(!weeks.length)throw new Error('format');
  const base=parseNum(d.baseL);
  const p={id:uid(),pid:PID(),name:String(d.name||'Plan aus Bild').slice(0,80),maker:String(d.maker||'').slice(0,40),baseL:base>0?+base.toFixed(3):10,products,weeks,note:`${d.note?String(d.note).slice(0,400)+' ':''}Aus einem Bild erkannt am ${fmtDate(todayISO())} – bitte jede Zahl mit dem Original prüfen.`};
  sortWeeks(p);return p;
}

function alerts(run,I){
  const out=[];const today=todayISO();
  const od=openTasks(run).filter(t=>t.due<today);
  if(od.length)out.push({c:'b',t:`${plural(od.length,'Aufgabe','Aufgaben')} überfällig`,act:'tasksAll'});
  if(I.phaseIdx<4){
    const lf=lastBy(S.feeds.filter(f=>f.runId===run.id),'at');
    if(lf&&daysBetween(lf.at.slice(0,10),today)<=3){
      const me=parseNum(lf.measuredEc),lp=byId('plans',lf.planId),tr=feedEcTarget(lf,lp,run);
      if(tr&&!isNaN(me)&&(me<tr[0]-0.3||me>tr[1]+0.3))out.push({c:'w',t:`Letzte Mischung: EC ${fmtP(me,1)} statt ${fmtR(tr)}`,act:'tab',tab:'feed'});
      const pr=parseRange(lf.targetPh),mp=parseNum(lf.measuredPh);
      if(pr&&!isNaN(mp)&&(mp<pr[0]-0.05||mp>pr[1]+0.05))out.push({c:'w',t:`Letzte Mischung: pH ${fmtP(mp,1)} außerhalb ${lf.targetPh}`,act:'tab',tab:'feed'});
    }
    if(I.harvestLeft!==null&&I.harvestLeft<=7)out.push({c:'v',t:I.harvestLeft>=0?`Erntefenster: noch ${plural(I.harvestLeft,'Tag','Tage')} – Trichome checken`:`Geplante Blütedauer um ${plural(-I.harvestLeft,'Tag','Tage')} überschritten`,act:'trich'});
    if(I.flipLeft!==null&&I.flipLeft<=3)out.push({c:'v',t:I.flipLeft>=0?`Umstellen auf Blüte ${fmtRel(I.expFlip)}`:`Geplantes Umstellen auf Blüte war vor ${plural(-I.flipLeft,'Tag','Tagen')}`,act:'phase'});
  }
  return out;
}

const PH_COLOR={'Keimung':'#FFD400','Veg':'#56C23A','Blüte':'#9B5CFF','Fade/Flush':'#FF7A1A','Ernte':'#8A8A8A','Trocknung':'#8A8A8A','Curing':'#8A8A8A'};
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
function taskDates(t,from,to){
  const out=[];if(t.done)return out;
  const ev=+t.every||0;
  if(!ev){if(t.due>=from&&t.due<=to)out.push(t.due);return out;}
  let d=t.due;
  if(d<from){const k=Math.ceil(daysBetween(d,from)/ev);d=addDays(d,k*ev);}
  while(d<=to&&out.length<62){if(d>=from)out.push(d);d=addDays(d,ev);}
  return out;
}
function entryHtml(e){

function viewCalendar(run){
  const y=U.calY,m=U.calM,today=todayISO();
  const first=new Date(y,m,1),dim=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7;
  const from=isoOf(first),to=isoOf(new Date(y,m,dim));
  const map={};const add=(iso,k)=>{if(!iso||iso<from||iso>to)return;(map[iso]=map[iso]||{e:0,p:0,f:0,t:0,ev:0})[k]+=1;};
  S.entries.forEach(e=>{if(e.runId===run.id)add(e.date,'e');});
  S.photos.forEach(p=>{if(p.runId===run.id)add(p.date,'p');});
  S.feeds.forEach(f=>{if(f.runId===run.id)add(f.at.slice(0,10),'f');});
  openTasks(run).forEach(t=>taskDates(t,from,to).forEach(d=>add(d,'t')));
  const R=runInfo(run);
  R.phases.forEach(p=>add(p.date,'ev'));
  if(R.expHarvest&&R.phaseIdx<4)add(R.expHarvest,'ev');
  if(R.expFlip)add(R.expFlip,'ev');
  if(!U.calSel)U.calSel=today;
  /* alle Runs dieses Profils, die den Monat berühren (Start-Punkt oder Strich) */
  const runs=mine('runs').map(r=>({r,end:runEnd(r)})).filter(({r,end})=>r.start<=to&&((end&&end>=from)||(r.start>=from))).sort((a,b)=>a.r.start.localeCompare(b.r.start));
  let cells=WD.map(w=>`<span class="wd">${w}</span>`).join('');
  for(let i=0;i<off;i++)cells+='<span class="blank" aria-hidden="true"></span>';
  for(let d=1;d<=dim;d++){
    const iso=isoOf(new Date(y,m,d)),D=map[iso];
    let rd='';
    if(iso>=run.start){const J=runInfo(run,iso);const e=runEnd(run);if(!e||iso<=e)rd=J.bloomDay?`B${J.bloomDay}`:`T${J.day}`;}
    const starts=runs.filter(x=>x.r.start===iso),lines=runs.filter(x=>x.end&&iso>=x.r.start&&iso<=x.end);
    const dots=D?`${D.e?'<i class="de"></i>':''}${D.p?'<i class="dp"></i>':''}${D.f?'<i class="df"></i>':''}${D.t?'<i class="dt"></i>':''}`:'';
    const lbl=[fmtDate(iso),rd?(rd[0]==='B'?'Blütetag '+rd.slice(1):'Tag '+rd.slice(1)):'',...starts.map(x=>'Start '+x.r.name),...lines.filter(x=>x.r.start!==iso).map(x=>x.r.name+' läuft')].filter(Boolean).join(', ');
    cells+=`<button class="d${iso===today?' today':''}${iso===U.calSel?' sel':''}${iso>today?' fut':''}" data-act="calPick" data-d="${iso}" aria-label="${esc(lbl)}"><span class="n">${d}${starts.map(x=>runDot(x.r,7)).join('')}</span>${rd?`<span class="rd">${rd}</span>`:''}${D&&D.ev?'<span class="mk" aria-hidden="true">★</span>':''}<span class="dots" aria-hidden="true">${dots}</span>${lines.length?`<span class="rbars" aria-hidden="true">${lines.slice(0,4).map(x=>`<i style="background:${esc(runColor(x.r))}"></i>`).join('')}</span>`:''}</button>`;
  }
  const ty=new Date().getFullYear(),sy=+run.start.slice(0,4);
  const years=[...new Set([sy,ty-1,ty,ty+1,ty+2,y])].sort((a,b)=>a-b);
  const noEnd=runs.filter(x=>!x.end);
  return `<div class="cal-head"><button class="icon-btn" data-act="calNav" data-d="-1" aria-label="Vorheriger Monat">‹</button><select id="calM" aria-label="Monat">${MONTHS.map((n,i)=>`<option value="${i}" ${i===m?'selected':''}>${n}</option>`).join('')}</select><select id="calY" aria-label="Jahr">${years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('')}</select><button class="icon-btn" data-act="calNav" data-d="1" aria-label="Nächster Monat">›</button><button class="btn small ghost" data-act="calToday">Heute</button></div>
  <section class="card cal-card"><div class="cal">${cells}</div>
  ${runs.length?`<div class="legend cal-legend" style="margin-top:10px">${runs.map(({r,end})=>`<span>${runDot(r,9)} ${esc(r.name)}${end?` <span class="muted">bis ${fmtShort(end)}</span>`:''}${r.archived?' <span class="muted">(Archiv)</span>':''}</span>`).join('')}</div>`:''}
  <div class="legend cal-legend"><span><i class="dot de"></i>Journal</span><span><i class="dot dp"></i>Foto</span><span><i class="dot df"></i>Feed</span><span><i class="dot dt"></i>Aufgabe</span><span>★ Termin</span></div>
  <p class="note" style="margin-top:6px">Punkt = Start eines Runs, Striche = Laufzeit (Start + Veg-Dauer + Blütedauer). T/B-Zählung für „${esc(run.name)}“.${noEnd.length?` Ohne Striche, weil Veg- oder Blütedauer fehlt: ${noEnd.map(x=>esc(x.r.name)).join(', ')}.`:''}</p></section>
  ${dayPanel(run,U.calSel)}`;
}
function dayPanel(run,iso){
  const I=iso>=run.start?runInfo(run,iso):null,R=runInfo(run);
  const es=S.entries.filter(e=>e.runId===run.id&&e.date===iso).sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const ps=S.photos.filter(p=>p.runId===run.id&&p.date===iso);
  const fs=S.feeds.filter(f=>f.runId===run.id&&f.at.slice(0,10)===iso);
  const ts=openTasks(run).filter(t=>taskDates(t,iso,iso).length);
  const ev=[];R.phases.filter(p=>p.date===iso).forEach(p=>ev.push(`${p.type} beginnt`));
  if(R.expHarvest===iso&&R.phaseIdx<4)ev.push('Geplante Ernte');
  if(R.expFlip===iso)ev.push('Geplantes Umstellen auf Blüte');
  mine('runs').forEach(r=>{if(r.id===run.id)return;const e=runEnd(r);if(r.start===iso)ev.push(`Start ${r.name}`);else if(e&&iso===e)ev.push(`Geplantes Ende ${r.name}`);});
  const others=mine('runs').filter(r=>{const e=runEnd(r);return e&&iso>=r.start&&iso<=e;});
  const empty=!ev.length&&!ts.length&&!es.length&&!ps.length&&!fs.length;
  return `<section class="card stack day-panel">
  <div><b style="font-size:18px">${fmtDate(iso)}</b><div class="small muted">${I?`Tag ${I.day} · ${esc(I.phase)}${I.bloomDay?` · Blüte Tag ${I.bloomDay}, Woche ${I.bloomWeek}`:I.vegDay?` · Veg Woche ${I.vegWeek}`:''}${iso>todayISO()?' · geplant':''}`:'Vor dem Start dieses Runs'}</div></div>
  ${others.length?`<div class="row">${others.map(r=>{const J=runInfo(r,iso);return `<span class="chip n">${runDot(r,8)} ${esc(r.name)} · Tag ${J.day} · ${esc(J.phase)}</span>`;}).join('')}</div>`:''}
  ${ev.length?`<div class="row">${ev.map(x=>`<span class="chip v">★ ${esc(x)}</span>`).join('')}</div>`:''}
  ${ts.length?`<div class="list">${ts.map(t=>t.due===iso?taskRow(t):`<div class="li task"><span class="tick" aria-hidden="true">↻</span><div class="grow"><div class="t">${esc(t.title)}</div><div class="d">${esc(repeatTxt(t.every))} · voraussichtlich</div></div></div>`).join('')}</div>`:''}
  ${es.map(entryHtml).join('')}
  ${ps.length?`<div class="mgrid">${ps.map(p=>`<button data-act="openMedia" data-id="${p.id}" aria-label="Medium öffnen">${thumbTag(p)}${p.kind==='video'?`<span class="vb">▶ ${fmtDur(p.dur)}</span>`:''}</button>`).join('')}</div>`:''}
  ${fs.length?`<div class="list">${fs.map(f=>`<div class="li"><span class="chip l">Feed</span><div class="grow"><div class="t">${esc(f.weekLabel)} · ${fmtDE(f.tankL,1)} L</div><div class="d">${fmtTime(f.at)} · Ist EC ${esc(f.measuredEc||'–')} · pH ${esc(f.measuredPh||'–')}</div></div></div>`).join('')}</div>`:''}
  ${empty?'<p class="muted">Für diesen Tag ist nichts eingetragen.</p>':''}
  <div class="row"><button class="btn small" data-act="calEntry" data-d="${iso}">${IC.plus} Eintrag</button><button class="btn small" data-act="calTask" data-d="${iso}">${IC.plus} Aufgabe</button><button class="btn small" data-act="calPhoto" data-d="${iso}">${IC.plus} Foto</button></div>
  </section>`;
}

/* ---------- Verlauf: Android-Zurück-Taste schließt Dialoge und geht Seiten zurück, statt die App zu verlassen ---------- */
let popSkip=0;
const hs=()=>history.state||{};
function histMark(k){try{if(!hs()[k])history.pushState({...hs(),[k]:1},'');}catch(e){}}

const overlayOpen=()=>!$('#viewer').hidden;

  if(U.locked)return;

function runReport(run){
  const I=runInfo(run),st=byId('setups',run.setupId);
  const get=t=>I.phases.find(p=>p.type===t)?.date;
  const veg=get('Veg'),bloom=get('Blüte'),harvest=get('Ernte'),end=harvest||todayISO();
  const plants=runPlants(run),Y=runYield(run);
  const feeds=S.feeds.filter(f=>f.runId===run.id),ecs=feeds.map(f=>parseNum(f.measuredEc)).filter(n=>!isNaN(n));
  const nE=S.entries.filter(e=>e.runId===run.id).length,nP=S.photos.filter(p=>p.runId===run.id).length;
  const rows=[
    ['Zeitraum',`${fmtDate(run.start)} – ${harvest?fmtDate(harvest):'läuft'} · ${plural(daysBetween(run.start,end)+1,'Tag','Tage')}`],
    st?['Setup',setupLine(st)||st.name]:null,
    veg?['Veg',plural(daysBetween(veg,bloom||end),'Tag','Tage')]:null,
    bloom?['Blüte',`${plural(daysBetween(bloom,end)+(harvest?0:1),'Tag','Tage')}${run.planBloomDays?` (geplant ${run.planBloomDays})`:''}`]:null,
    ['Ertrag trocken',!isNaN(Y.dry)?`${fmtDE(Y.dry,0)} g${!isNaN(Y.wet)&&Y.wet?` · nass ${fmtDE(Y.wet,0)} g (${fmtDE(Y.dry/Y.wet*100,0)} %)`:''}`:'–'],
    ['g/Strain',isNaN(Y.perPlant)?'–':fmtDE(Y.perPlant,1)],
    ['g/m²',isNaN(Y.perM2)?'–':fmtDE(Y.perM2,0)],
    ['Mischungen',feeds.length?`${feeds.length}${ecs.length?` · Ø EC ${fmtP(ecs.reduce((a,b)=>a+b,0)/ecs.length,2)}`:''}`:'–'],
    ['Journal / Fotos',`${plural(nE,'Eintrag','Einträge')} · ${plural(nP,'Foto','Fotos')}`]
  ].filter(Boolean);
  const pl=plants.map(p=>({p,avg:avgRating(p.review),dry:plantDry(p)}));
  return {rows,pl,setup:st,strains:[...new Set(plants.map(p=>p.strain).filter(Boolean))]};
}

function coachContext(run){

  L.push(`Run "${run.name}": Tag ${I.day}, Phase ${I.phase}${I.bloomDay?`, Blüte Tag ${I.bloomDay} (Woche ${I.bloomWeek})`:''}${I.vegDay?`, Veg Tag ${I.vegDay}`:''}${run.planBloomDays?`, geplante Blütedauer ${run.planBloomDays} Tage`:''}, Medium ${run.medium||st?.medium||'k. A.'}`);
  if(st)L.push('Setup: '+[st.name,st.w&&st.d?`${st.w}x${st.d} cm`:'',st.watt?st.watt+' W':'',st.irrigation,st.potL?st.potL+' L Topf':'',st.tankL?st.tankL+' L Tank':'',st.sensors].filter(Boolean).join(', '));
  const pl=S.plants.filter(p=>p.runId===run.id);
  if(pl.length)L.push('Strains (Pflanzen): '+pl.map(p=>[p.label,p.strain,p.breeder,p.source].filter(Boolean).join(' / ')).join('; '));
  const fd=S.feeds.filter(f=>f.runId===run.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,3);
  if(fd.length)L.push('Letzte Mischungen: '+fd.map(f=>`${f.at.replace('T',' ')}: ${f.planName}, ${f.weekLabel}, ${f.tankL} L, ${f.amounts.map(a=>`${a.name} ${fmtAmt(a.amount)} ${a.unit}`).join(', ')}; Soll-EC ${f.targetEc||'-'}, Ist-EC ${f.measuredEc||'-'}, pH ${f.measuredPh||'-'}`).join(' | '));
  const en=S.entries.filter(e=>e.runId===run.id).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at)).slice(0,8);
  if(en.length)L.push('Letzte Journal-Einträge: '+en.map(e=>`${e.date} ${e.type}${e.plantId?' ('+plantName(e.plantId)+')':''}: ${e.tri?triTxt(e.tri)+'. ':''}${String(e.text||'').slice(0,200)}`).join(' | '));

}

const COACH_ERR={rate_limited:'Gerade zu viele Anfragen – versuch es später noch einmal.',session_expired:'Bitte bei Claude neu anmelden.',image_rejected:'Das Foto wurde nicht angenommen – wähle ein anderes.',refused:'Dazu kann der Coach nichts sagen – formuliere die Frage anders.',not_granted:'Der Coach wurde nicht erlaubt.',prompt_too_large:'Zu viel Text – starte ein neues Gespräch.',tools_unavailable:'Websuche in dieser Ansicht nicht möglich – antworte ohne aktuelle Websuche.'};
function coachTools(){
  if(!SAMPLE_TOOLS)return undefined;
  const tools=[];
  if(MCP)tools.push({
    name:'webSearch',
    description:'Sucht aktuelle Informationen im Web zu Cannabis-Anbau (Technik, Produkte, Schädlinge, Krankheiten, Sortenbeschreibungen). Nutze es, wenn dein Wissen unsicher oder möglicherweise veraltet ist. Gib eine kurze, gezielte Suchanfrage. Liefert Titel, URL und kurze Ausschnitte der besten Treffer.',
    inputSchema:{type:'object',properties:{query:{type:'string',description:'Kurze, gezielte Suchanfrage, z. B. "cannabis magnesium deficiency leaves yellowing"'}},required:['query']},
    execute:async({query})=>{
      const q=String(query||'').slice(0,200);if(!q)throw new Error('Leere Suchanfrage');
      try{
        const srv=await MCP.server('Parallel Search');
        const r=await srv.web_search({objective:q,search_queries:[q],session_id:COACH_SID});
        return JSON.stringify(r).slice(0,6000);
      }catch(e){throw new Error('Websuche fehlgeschlagen ('+(e&&e.code||'Fehler')+')');}
    }
  });
  tools.push({
    name:'searchStrains',
    description:'Durchsucht die kuratierte Samenbank-Referenzliste (bekannte Sorten mit Breeder, Typ, Genetik/Kreuzung, ungefährer Blütedauer) nach Namen oder Stichwort.',
    inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
    execute:({query})=>{
      const hits=(typeof seedLibHits==='function'?seedLibHits(query):[]);
      return hits.length?hits.map(s=>`${s.name} (${s.breeder}, ${s.kind}, ${s.gen}, Blüte ${s.flower} Tage): ${s.desc}`).join('\n'):'Keine passende Sorte in der Referenzliste gefunden.';
    }
  });
  tools.push({
    name:'searchTips',
    description:'Durchsucht die Zeltbuch-Wissensartikel (Samen, Keimung, Stecklinge, Substrat, Licht, Klima, Gießen, Dünger, Mängel, Schädlinge, Training, Crop Steering, Ernte, Trocknung, Curing, Sortenporträts) nach einem Stichwort und liefert passende Auszüge.',
    inputSchema:{type:'object',properties:{query:{type:'string'}},required:['query']},
    execute:({query})=>{
      const q=String(query||'').toLowerCase();
      const hits=coachTips().filter(t=>t.title.toLowerCase().includes(q)||t.tags.some(x=>x.includes(q))||t.body.toLowerCase().includes(q)).slice(0,3);
      return hits.length?hits.map(t=>`${t.title}: ${t.body.slice(0,500)}`).join('\n---\n'):'Keine passenden Tipps gefunden.';
    }
  });
  return tools;
}
async function askCoach(q,form){

  const file=pickedFiles('coachImgFile')[0];const useLast=form.elements.namedItem('attachLast')?.checked;

  if(C.turns.length>12)C.turns=C.turns.slice(-12);

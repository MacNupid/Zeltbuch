 {id:'samen-typen',cat:'Samen & Genetik',img:'samen',title:'Samen-Typen: regulär, feminisiert, Autoflower',lead:'Welcher Samen passt zu dir? Die drei Typen unterscheiden sich in Geschlecht, Blütesteuerung und Aufwand.',tags:['samen','feminisiert','regulär','autoflower','seeds'],related:['sortenwahl','autoflower','keimung','samen-lagern'],
  body:`## Reguläre Samen
Reguläre Samen ergeben etwa zur Hälfte männliche und weibliche Pflanzen. Für Blüten brauchst du nur die weiblichen – die männlichen musst du erkennen und früh entfernen, bevor sie bestäuben. Dafür sind reguläre Samen genetisch meist stabiler und die erste Wahl, wenn du selbst kreuzen oder eine [[mutterpflanze|Mutterpflanze]] aus einem kräftigen Pheno aufbauen willst.

## Feminisierte Samen
Feminisierte Samen ergeben fast ausschließlich weibliche Pflanzen. Das spart Platz und Zeit und ist für die meisten Homegrower der Standard. Unter starkem Stress (Lichtlecks, Hitze, grobe Eingriffe in später Blüte) können einzelne Pflanzen zwittrig werden – kontrolliere deshalb in der Blüte regelmäßig auf „Bananen“ (männliche Staubbeutel).

## Autoflower
Autoflower-Samen enthalten Ruderalis-Genetik und blühen unabhängig von der Lichtdauer nach wenigen Wochen von selbst. Vom Keimen bis zur Ernte vergehen oft nur 9–11 Wochen. Sie bleiben meist kompakter, verzeihen aber Fehler in der Wachstumsphase weniger, weil keine Zeit zum Aufholen bleibt. Mehr dazu im Artikel [[autoflower|Autoflower richtig growen]].

## Photoperiodisch
Photoperiodische Sorten (regulär oder feminisiert) wachsen, solange sie lange Tage bekommen, und blühen erst bei 12/12. So bestimmst du selbst, wie groß die Pflanze wird – ideal, wenn du [[training|trainieren]] und den Platz im Zelt voll ausnutzen willst.

## Kurz-Entscheidung
- Wenig Zeit, kleiner Platz, einfacher Einstieg: Autoflower.
- Volle Kontrolle über Größe und Ertrag: feminisiert, photoperiodisch.
- Eigene Genetik, Pheno-Suche, Kreuzen: regulär. Siehe [[phaenos|Phänotypen]].`},
 {id:'indica-sativa',cat:'Samen & Genetik',img:'indica',title:'Indica, Sativa, Hybrid – was die Begriffe wirklich sagen',lead:'Die Etiketten beschreiben vor allem Wuchs und Blütedauer. Über Aroma und Wirkung sagen sie weniger, als oft behauptet wird.',tags:['indica','sativa','hybrid','genetik'],related:['sortenwahl','phaenos','samen-typen','licht'],
  body:`## Ursprung der Begriffe
Ursprünglich beschrieben „Indica“ und „Sativa“ Landrassen aus unterschiedlichen Regionen: kompakte, breitblättrige Pflanzen aus Bergregionen wie dem Hindukusch und hohe, schmalblättrige Pflanzen aus warmen, äquatornahen Gebieten. Fast alle heutigen Sorten sind Hybriden aus vielen Generationen Kreuzung.

## Was du im Zelt merkst
- Indica-dominant: kompakter Wuchs, kurze Internodien, dichte Blüten, meist 7–9 Wochen Blüte. Dichte Blüten brauchen gutes [[klima|Klima]] – sonst droht Schimmel.
- Sativa-dominant: starker Stretch (die Pflanze kann sich nach dem Umstellen verdoppeln bis verdreifachen), lockere Blüten, oft 9–11 Wochen Blüte. Plane Höhe und [[licht|Lichtabstand]] mit ein und [[training|trainiere]] früh.
- Hybrid: irgendwo dazwischen – schau auf die Angaben des Breeders zu Höhe, Stretch und Blütedauer.

## Aroma und Wirkung
Aroma und Charakter hängen vor allem von der Zusammensetzung der Cannabinoide und Terpene ab – und die variiert selbst innerhalb einer Sorte von Pflanze zu Pflanze (siehe [[phaenos|Phänotypen]]). Das Etikett „Indica“ oder „Sativa“ ist dafür nur ein grober Hinweis.

## Im Zeltbuch nutzen
Trag bei deinen Sorten in der Genetik die Blütedauer ein. Das Zeltbuch übernimmt sie beim Anlegen eines Runs oder Strains und rechnet daraus das Erntefenster.`},
 {id:'sortenwahl',cat:'Samen & Genetik',img:'sortenwahl',title:'Die richtige Sorte für Zelt und Erfahrung',lead:'Höhe, Blütedauer, Geruch und Anfälligkeit – worauf du bei der Sortenwahl achten solltest.',tags:['sorte','sortenwahl','strain','einsteiger'],related:['samen-typen','indica-sativa','autoflower','klima'],
  body:`## Platz und Höhe
Miss die nutzbare Höhe deines Zelts: Zelthöhe minus Lampe, Aufhängung und Topf. Bleiben weniger als etwa 100 cm, sind kompakte Indica-Hybriden oder [[autoflower|Autoflower]] die sichere Wahl. Stark sativalastige Sorten strecken sich nach dem Umstellen deutlich – das lässt sich mit [[training|LST und Topping]] zähmen, verlangt aber Aufmerksamkeit.

## Blütedauer
Die Blütedauer bestimmt, wie viele Runs pro Jahr möglich sind und wie lange Strom läuft. 8 Wochen sind ein guter Richtwert für Einsteiger, Haze-Sorten brauchen oft 10 Wochen und mehr.

## Robustheit
Für die ersten Runs lohnen sich Sorten mit dem Ruf, robust und schimmelresistent zu sein. Sehr dichte, großblütige Sorten sind anfälliger für Schimmel, wenn die [[klima|Luftfeuchte]] in der Blüte zu hoch ist.

## Geruch
Manche Sorten riechen in der Blüte sehr stark. Ein passend dimensionierter Aktivkohlefilter ist Pflicht, egal welche Sorte.

## Vorgehen
- Ein bis zwei Sorten pro Run, nicht fünf verschiedene – sonst passen Dünger, Stretch und Erntezeit nie für alle.
- Notiere die Eckdaten in der Genetik-Bibliothek, dann vergleicht das Zeltbuch deine Sorten über mehrere Runs.
- Stöbere in den Sortenporträts, zum Beispiel [[sorte-northern-lights|Northern Lights]], [[sorte-critical|Critical]] oder [[sorte-white-widow|White Widow]].`},
 {id:'autoflower',cat:'Samen & Genetik',img:'auto',title:'Autoflower richtig growen',lead:'Autoflowers blühen nach Kalender, nicht nach Licht. Wer die Unterschiede kennt, erntet schnell und unkompliziert.',tags:['autoflower','auto','ruderalis'],related:['samen-typen','keimung','training','licht'],
  body:`## Der wichtigste Unterschied
Autoflowers starten die Blüte nach etwa 3–5 Wochen von selbst. Alles, was die Pflanze in dieser Zeit verliert – durch Umtopfen, Überwässern oder zu starkes Düngen – holt sie nicht mehr auf.

## Praxis
- Direkt in den Endtopf säen (etwa 11–20 L), Umtopfen kostet Zeit. Wie das Keimen klappt, steht unter [[keimung|Samen keimen]].
- Licht: durchgehend 18/6 oder 20/4 – kein Umstellen auf 12/12 nötig. Zielwerte im Artikel [[licht|Licht & Photoperiode]].
- Düngen: etwas schwächer als photoperiodische Pflanzen, gerade in den ersten Wochen.
- Training: sanftes [[training|LST]] ja, Topping nur sehr früh oder gar nicht.

## Im Zeltbuch
Leg den Run mit Startphase „Keimung“ an und trag die Blütedauer ab Keimung ein. Die Phase „Blüte“ setzt du, sobald sich die ersten Stempel zeigen.`},
 {id:'phaenos',cat:'Samen & Genetik',img:'pheno',title:'Phänotypen und Pheno-Hunting',lead:'Aus einer Samenpackung wachsen nie ganz gleiche Pflanzen. Wie du die beste findest und behältst.',tags:['pheno','phänotyp','selektion','keeper'],related:['mutterpflanze','stecklinge','samen-typen','ernte'],
  body:`## Was ist ein Pheno?
Jeder Samen trägt eine eigene Kombination der Gene seiner Eltern. Pflanzen derselben Sorte können sich deshalb in Wuchs, Aroma, Ertrag und Blütedauer deutlich unterscheiden – das sind die Phänotypen.

## Pheno-Hunting in drei Schritten
- Mehrere Samen einer Sorte keimen und jeder Pflanze eine eigene Bezeichnung geben (im Zeltbuch als eigenen Strain, zum Beispiel „Blue Ivory P1“).
- Vor dem Umstellen auf Blüte von jeder Pflanze einen [[stecklinge|Steckling]] nehmen und beschriften.
- Nach Ernte, [[trocknen|Trocknung]] und [[curing|Curing]] bewerten. Den besten „Keeper“ als [[mutterpflanze|Mutterpflanze]] behalten, die anderen Stecklinge entsorgen.

## Worauf achten
Wuchs und Stretch, Schimmelresistenz, Harzproduktion, Aroma nach dem Curing, Ertrag und wie leicht sich die Pflanze pflegen lässt. Nutze dafür die Bewertung je Strain unter „Ernte & Curing“ – das Zeltbuch rechnet die Sterne pro Sorte über alle Runs zusammen.`},
 {id:'samen-lagern',cat:'Samen & Genetik',img:'lagern',title:'Samen richtig lagern',lead:'Kühl, dunkel, trocken und luftdicht – so bleiben Samen jahrelang keimfähig.',tags:['samen','lagern','keimfähigkeit','aufbewahrung'],related:['keimung','samen-typen','sortenwahl'],
  body:`## Die vier Feinde
Wärme, Licht, Feuchtigkeit und Sauerstoff lassen Samen altern. Gut gelagert bleiben sie mehrere Jahre keimfähig, schlecht gelagert oft nur wenige Monate.

## So lagerst du richtig
- Luftdichter, lichtdichter Behälter, am besten mit einem kleinen Beutel Silicagel gegen Feuchtigkeit.
- Kühl und gleichmäßig: Der Kühlschrank (etwa 4–8 °C) ist ideal – aber nicht in der Tür, wo die Temperatur ständig schwankt.
- Den Behälter vor dem Öffnen auf Zimmertemperatur kommen lassen, sonst bildet sich Kondenswasser auf den Samen.
- Beschriften: Sorte, Breeder, Kaufdatum.

## Im Zeltbuch
Trag den Samenbestand in der Genetik-Bibliothek ein. Beim Anlegen eines Strains aus Samen zieht das Zeltbuch automatisch einen Samen ab. Wie du die Samen dann zum Leben erweckst, steht unter [[keimung|Samen keimen]].`},
 {id:'keimung',cat:'Vermehrung',img:'keimung',title:'Samen zum Keimen bringen',lead:'Mit der Küchenpapier-Methode keimen fast alle Samen innerhalb weniger Tage – so geht’s Schritt für Schritt.',tags:['keimung','samen','germination','sämling'],related:['samen-lagern','samen-typen','licht','giessen'],
  body:`## Küchenpapier-Methode
Leg die Samen zwischen zwei feuchte (nicht nasse) Küchenpapiere, in eine geschlossene Box, dunkel bei 22–25 °C. Prüfe täglich, ob das Papier noch feucht ist. Nach 1–5 Tagen erscheint eine kleine weiße Wurzel.

## Einsetzen
Fass die Keimwurzel nicht an. Setz den Samen mit einer sauberen Pinzette etwa 1 cm tief in lockeres, leicht feuchtes Anzuchtsubstrat, die Wurzel zeigt nach unten. Alternativ säst du direkt ins [[substrat|Substrat]] – das ist stressärmer, du siehst den Fortschritt aber später.

## Die ersten Tage
- Hohe Luftfeuchte (65–75 %), zum Beispiel mit einer Anzuchthaube. Mehr unter [[klima|Temperatur & Luftfeuchte]].
- Wenig Licht: 200–400 µmol/m²/s reichen. Details unter [[licht|Licht]].
- Sparsam gießen: Sämlinge ertrinken leichter, als sie vertrocknen. Siehe [[giessen|Richtig gießen]].

## Im Zeltbuch
Leg einen Run mit Startphase „Keimung“ an. Wechsle auf „Veg“, sobald die ersten echten Blätter da sind – ab dann zählt die App die Veg-Wochen.`},
 {id:'stecklinge',cat:'Vermehrung',img:'stecklinge',title:'Stecklinge schneiden und bewurzeln',lead:'Stecklinge sind genetische Kopien deiner besten Pflanze. Mit sauberer Technik bewurzeln sie in ein bis zwei Wochen.',tags:['stecklinge','klone','clones','bewurzeln'],related:['mutterpflanze','phaenos','klima','training'],
  body:`## Schneiden
Wähle einen gesunden Trieb mit 2–3 Nodien, der noch nicht blüht. Schneide mit einer scharfen, desinfizierten Klinge schräg knapp unter einem Nodium. Entferne die unteren Blätter und kürze große Blätter um die Hälfte, damit weniger Wasser verdunstet.

## Bewurzeln
- Schnittstelle in Bewurzelungsgel oder -pulver tauchen.
- In ein steriles Medium stecken: Steinwolle, Anzuchtwürfel oder Perlite-Mischung.
- Unter einer Haube bei 80–90 % Luftfeuchte und mildem Licht halten, täglich kurz lüften.
- 20–25 °C im Medium beschleunigen die Wurzelbildung deutlich.

Nach 7–14 Tagen zeigen sich weiße Wurzeln. Dann Haube schrittweise öffnen und an normales [[klima|Klima]] gewöhnen.

## Woher die Stecklinge kommen
Am zuverlässigsten von einer [[mutterpflanze|Mutterpflanze]]. Stecklinge, die du vor der Blüte von Sämlingen nimmst, sind die Grundlage fürs [[phaenos|Pheno-Hunting]]. Im Zeltbuch trägst du Stecklinge bei der Sorte unter „Stecklinge genommen“ ein – auf Wunsch direkt als Pflanzen im Run.`},
 {id:'mutterpflanze',cat:'Vermehrung',img:'mutter',title:'Eine Mutterpflanze halten',lead:'Eine gute Mutter liefert über Monate Stecklinge mit identischer Genetik.',tags:['mutterpflanze','mutter','stecklinge','keeper'],related:['stecklinge','phaenos','licht','duengung'],
  body:`## Die richtige Pflanze
Nimm nur einen erprobten „Keeper“: eine Pflanze, deren Ernte du schon kennst. Wie du ihn findest, steht unter [[phaenos|Pheno-Hunting]].

## Pflege
- Dauerhaft vegetativ: 18/6 oder mehr, moderates Licht reicht (etwa 300–500 µmol/m²/s).
- Mild düngen, vor allem Stickstoff und Calcium/Magnesium – siehe [[duengung|Düngen nach EC & pH]].
- Regelmäßig zurückschneiden, damit viele kräftige Triebe für [[stecklinge|Stecklinge]] nachwachsen.
- Alle paar Monate umtopfen oder die Wurzeln zurückschneiden.

## Erneuern
Mit der Zeit werden Mütter holzig und liefern schwächere Triebe. Viele Grower ersetzen die Mutter nach einigen Monaten bis etwa einem Jahr durch einen eigenen bewurzelten Steckling.

## Im Zeltbuch
Hake bei der Sorte „Ich halte eine Mutterpflanze“ an und trag das Datum ein. Dann erscheint dort der Knopf „Stecklinge genommen“.`},
 {id:'substrat',cat:'Grundlagen',img:'substrat',title:'Substratwahl: Erde, Kokos, Hydro',lead:'Das Medium bestimmt, wie oft du gießt, wie du düngst und wie verzeihend dein Grow ist.',tags:['substrat','erde','kokos','hydro','medium'],related:['toepfe','giessen','duengung','crop-steering'],
  body:`## Erde
Erde puffert Nährstoff- und pH-Schwankungen am besten und verzeiht Anfängerfehler. Vorgedüngte Erde braucht in den ersten Wochen kaum Dünger. Dafür wächst die Pflanze etwas langsamer.

## Kokos
Kokos ist fast frei von Nährstoffen. Du brauchst ein komplettes Düngeprogramm von Anfang an und gießt häufig mit etwas Ablaufwasser (Runoff). Dafür wachsen die Pflanzen schneller und du steuerst die Versorgung genauer. Wichtig: Kokos vor dem ersten Einsatz mit Cal-Mag puffern, weil die Fasern Calcium und Magnesium binden.

## Hydro
Reine Hydro-Systeme wie DWC wachsen am schnellsten, reagieren aber auch am schnellsten auf Fehler bei Temperatur, EC oder Sauerstoff.

## Empfehlung
Für ein Tropfsystem ist eine Kokos-Perlite-Mischung (etwa 70/30) ein guter Mittelweg: gute Drainage, gute Wasserhaltung. Passende [[toepfe|Töpfe und Bewässerung]], den richtigen [[giessen|Gießrhythmus]] und das [[duengung|Düngen nach EC & pH]] findest du in den verlinkten Artikeln.`},
 {id:'toepfe',cat:'Grundlagen',img:'toepfe',title:'Topfgröße und Bewässerungssystem',lead:'Wie groß der Topf sein muss und wie Tropfsysteme gleichmäßig versorgen.',tags:['töpfe','container','fabric pot','wilma','autopot','tropfsystem'],related:['substrat','giessen','crop-steering'],
  body:`## Topfgröße
Faustregel: etwa 10–15 L für Pflanzen, die 60–90 cm groß werden, 20–25 L für größere. Kleinere Töpfe trocknen schneller aus und erlauben mehr Kontrolle beim [[crop-steering|Crop Steering]], brauchen aber häufiger Wasser.

## Stoff- oder Plastiktopf
Stofftöpfe belüften die Wurzeln seitlich und verhindern, dass sich Wurzeln im Kreis drehen. Sie trocknen schneller als Plastiktöpfe – ideal in Kombination mit einem Tropfsystem.

## Tropfsysteme (z. B. Wilma, AutoPot)
- System vor dem Start sauber entlüften.
- Schläuche zu allen Töpfen gleich lang schneiden, damit jede Pflanze dieselbe Menge bekommt.
- Tropfer so setzen, dass das Wasser über die ganze Oberfläche verteilt wird – sonst entstehen trockene Ecken und Kanäle im [[substrat|Substrat]].
- Mehrere kurze Schübe verteilen das Wasser besser als eine lange Gabe. Wie viel, steht unter [[giessen|Richtig gießen]].

## Im Zeltbuch
Trag Topf- und Tankgröße im Setup ein. Der Feed-Rechner übernimmt dann die Tankgröße, das Crop Steering rechnet die Shot-Menge pro Topf.`},
 {id:'licht',cat:'Licht & Klima',img:'licht',title:'Lichtstärke, Abstand und Photoperiode',lead:'Die richtige Lichtmenge wächst mit der Pflanze mit. Diese Zielwerte helfen beim Einstellen.',tags:['licht','led','ppfd','photoperiode','dli'],related:['klima','autoflower','indica-sativa','training'],
  body:`## Zielwerte (PPFD in µmol/m²/s)
- Sämling und Steckling: 200–400
- Wachstumsphase: 400–600
- Blüte: 700–1000, mit zusätzlichem CO₂ auch mehr

Zu viel Licht zu früh zeigt sich an hellen, nach oben eingerollten Blattspitzen. Zu wenig Licht streckt die Abstände zwischen den Nodien und kostet Ertrag.

## Abstand
Häng die Lampe in dem Abstand auf, den der Hersteller für die jeweilige Dimmstufe angibt, und taste dich langsam an die Zielwerte heran. Achtung bei Sorten mit viel Stretch (siehe [[indica-sativa|Indica, Sativa, Hybrid]]): Nach dem Umstellen wachsen sie oft schnell in die Lampe.

## Photoperiode
Photoperiodische Sorten wachsen bei 18/6 und blühen bei striktem 12/12. Schon kurze Lichteinbrüche in der Dunkelphase können Stress oder Zwitter auslösen – halte das Zelt lichtdicht. [[autoflower|Autoflowers]] bleiben durchgehend bei 18/6 oder 20/4.

## Licht und Klima gehören zusammen
Mehr Licht heißt mehr Wärme und mehr Verdunstung. Stimme Temperatur und Luftfeuchte ab – siehe [[klima|Temperatur, Luftfeuchte & VPD]].`},
 {id:'klima',cat:'Licht & Klima',img:'klima',title:'Temperatur, Luftfeuchte und VPD',lead:'Das Klima im Zelt entscheidet über Wachstum, Nährstoffaufnahme und Schimmelrisiko.',tags:['klima','vpd','luftfeuchte','temperatur','rlf','schimmel'],related:['licht','schaedlinge','trocknen','giessen'],
  body:`## Richtwerte
- Sämlinge und Stecklinge: 22–26 °C, 65–75 % rLF
- Wachstumsphase: 22–28 °C, 55–70 % rLF
- Blüte: 20–26 °C, 45–55 % rLF
- Späte Blüte: 18–24 °C, 40–50 % rLF

Nachts sollte es nicht mehr als etwa 5 °C kälter werden, sonst kondensiert Feuchtigkeit in den Blüten.

## Was ist VPD?
Das Dampfdruckdefizit (VPD) verbindet Temperatur und Luftfeuchte zu einem Wert, der beschreibt, wie stark die Pflanze Wasser verdunstet. Übliche Ziele: etwa 0,8–1,1 kPa in der Wachstumsphase und 1,0–1,5 kPa in der Blüte. Zu niedrig: die Pflanze verdunstet wenig und nimmt weniger Nährstoffe auf. Zu hoch: Stress, die Spaltöffnungen schließen sich.

## Schimmel vorbeugen
Dichte Blüten und hohe Luftfeuchte in der späten Blüte sind die häufigste Ursache für Knospenfäule. Umluft zwischen den Pflanzen, eine ausreichend starke Abluft und eine leichte [[training|Entlaubung]] helfen. Mehr zu Schädlingen und Krankheiten unter [[schaedlinge|Früh erkennen]].`},
 {id:'giessen',cat:'Bewässerung & Düngung',img:'giessen',title:'Richtig gießen: Menge, Rhythmus, Dryback',lead:'Nach Gewicht statt nach Kalender gießen – das fördert Wurzeln und beugt Fäulnis vor.',tags:['gießen','wasser','dryback','bewässerung','runoff'],related:['duengung','crop-steering','substrat','toepfe'],
  body:`## Nach Gewicht gießen
Heb den Topf an oder wiege ihn. Lass ihn zwischen den Gaben spürbar leichter werden – in der Wachstumsphase etwa 15–20 % Gewichtsverlust, in später Blüte auch 25–35 %. Dieses Abtrocknen heißt Dryback und ist die Grundlage fürs [[crop-steering|Crop Steering]].

## Runoff
Gieß so, dass 10–20 % unten wieder herauslaufen. So sammeln sich keine Salze im [[substrat|Substrat]]. Miss gelegentlich die EC im Ablaufwasser und vergleiche sie mit der EC deiner Mischung – liegt sie deutlich höher, reichern sich Salze an. Mehr dazu unter [[duengung|Düngen nach EC & pH]].

## Weitere Tipps
- Zimmerwarmes Wasser (18–24 °C) schont die Wurzeln.
- Kleine Töpfe unter 15 L brauchen in der Hauptblüte oft 1–2 Gaben täglich, große seltener, dafür mehr pro Gabe.
- Tropfsysteme laufen mit mehreren kurzen Schüben am gleichmäßigsten. Siehe [[toepfe|Töpfe & Bewässerung]].

## Im Zeltbuch
Leg eine wiederkehrende Aufgabe „Gießen“ an. Erledigte Aufgaben landen automatisch im Journal.`},
 {id:'duengung',cat:'Bewässerung & Düngung',img:'duengung',title:'Düngen nach EC und pH statt nach Schema F',lead:'Der Düngeplan ist ein Startpunkt. Entscheidend ist, was du misst und was die Pflanze zeigt.',tags:['dünger','ec','ph','nährstoffe','feed'],related:['mangel','giessen','substrat','crop-steering'],
  body:`## Immer messen
Miss EC und pH deiner fertigen Nährlösung, statt dich blind auf die Tabelle zu verlassen: Wasserqualität, Topfgröße und Sorte unterscheiden sich. Übliche pH-Werte: 5,8–6,2 in Erde und Kokos, 5,5–5,8 in reiner Hydro.

## Schrittweise steigern
Erhöhe die EC in kleinen Schritten und beobachte die Blattspitzen. Dunkelgrüne Blätter mit nach unten gebogenen Spitzen deuten auf zu viel Dünger, blasse untere Blätter auf zu wenig. Wie du Mängel genauer erkennst, steht unter [[mangel|Nährstoffmangel erkennen]].

## Runoff-EC
Liegt die EC im Ablaufwasser deutlich über der EC deiner Mischung, sammeln sich Salze im Substrat. Eine Gabe mit schwacher Nährlösung und viel Ablauf schafft Abhilfe. Siehe [[giessen|Richtig gießen]].

## Spülen vor der Ernte
Ob man in der letzten Woche nur mit Wasser gießt („Flush“), ist unter Growern umstritten. Für den Geschmack ist eine saubere, langsame [[trocknen|Trocknung]] und ein gutes [[curing|Curing]] meist wichtiger.

## Im Zeltbuch
Übernimm einen Herstellerplan im Feed-Rechner, trag im Setup die Werte deines Leitungswassers ein und speichere jede Mischung mit gemessener EC und pH – die App warnt, wenn du daneben liegst.`},
 {id:'mangel',cat:'Pflanzenpflege',img:'mangel',title:'Nährstoffmangel erkennen',lead:'Gelbe Blätter haben viele Ursachen. Wo die Symptome auftreten, verrät schon viel.',tags:['mangel','gelbe blätter','stickstoff','magnesium','calcium','kalium','lockout'],related:['duengung','giessen','schaedlinge','klima'],
  body:`## Zuerst den pH prüfen
Die häufigste Ursache für scheinbaren Mangel ist ein falscher pH: Die Nährstoffe sind da, aber die Pflanze kann sie nicht aufnehmen. Miss pH und EC der Mischung und des Ablaufwassers, bevor du nachdüngst. Siehe [[duengung|Düngen nach EC & pH]].

## Ältere, untere Blätter betroffen
- Stickstoff: gleichmäßig hellgrün bis gelb, von unten nach oben. In der späten Blüte ist etwas Vergilben normal.
- Magnesium: gelb zwischen den Blattadern, die Adern bleiben grün.
- Kalium: braune, trockene Blattränder und -spitzen.
- Phosphor: dunkle, matte Blätter, oft rötlich-violette Stiele und braune Flecken.

## Junge, obere Blätter betroffen
- Calcium: braune, rostige Flecken, verkrüppelte neue Blätter. Häufig in Kokos oder bei Osmosewasser ohne Cal-Mag.
- Eisen: junge Blätter hellgelb mit grünen Adern.

## Nicht verwechseln
Helle Stellen direkt unter der Lampe sind oft Lichtstress (siehe [[licht|Licht]]). Feine helle Sprenkel oder Gespinste deuten auf [[schaedlinge|Schädlinge]]. Hängende Blätter trotz nasser Erde: zu viel gegossen (siehe [[giessen|Gießen]]).

## Im Zeltbuch
Mach ein Foto, wähl im Journal die Art „Problem“ und notier, was du änderst. So siehst du im Kalender, ob die Maßnahme gewirkt hat.`},
 {id:'schaedlinge',cat:'Pflanzenpflege',img:'schaedlinge',title:'Schädlinge und Krankheiten früh erkennen',lead:'Wer regelmäßig mit der Lupe kontrolliert, erwischt Spinnmilben, Thripse und Mehltau, bevor sie sich ausbreiten.',tags:['schädlinge','spinnmilben','thrips','mehltau','pflanzenschutz','schimmel'],related:['klima','mangel','stecklinge'],
  body:`## Regelmäßig kontrollieren
Schau dir mindestens einmal pro Woche die Blattunterseiten mit einer Lupe an. Die meisten Schädlinge verstecken sich dort und zeigen sich zuerst als feine helle Sprenkel oder feine Gespinste.

## Die häufigsten Probleme
- Spinnmilben: helle Pünktchen, später Gespinste. Lieben warme, trockene Luft.
- Thripse: silbrige Streifen und kleine schwarze Kotpunkte.
- Trauermücken: kleine schwarze Fliegen über zu nasser Erde. Weniger gießen, Gelbtafeln aufstellen.
- Echter Mehltau: weißer, mehliger Belag auf den Blättern, bei hoher Luftfeuchte und wenig Luftbewegung. Siehe [[klima|Klima]].

## Behandeln
Betroffene Blätter entfernen und die Pflanze möglichst isolieren. In der Wachstumsphase helfen für den Innenanbau geeignete Mittel wie Kaliseife. In der Blüte sind Nützlinge wie Raubmilben meist die sicherste Wahl, weil Sprühmittel Rückstände in der Ernte hinterlassen können.

## Vorbeugen
Sauber arbeiten, Werkzeug desinfizieren, keine fremden Pflanzen ins Zelt. Neue [[stecklinge|Stecklinge]] erst ein paar Tage getrennt beobachten.`},
 {id:'training',cat:'Pflanzenpflege',img:'training',title:'LST, Topping und Entlaubung',lead:'Mit Training verteilst du das Licht gleichmäßig auf viele Triebe – für mehr und gleichmäßigere Blüten.',tags:['training','lst','topping','entlaubung','defoliation','scrog'],related:['licht','indica-sativa','autoflower','klima'],
  body:`## LST (Low Stress Training)
Beim LST biegst du Triebe zur Seite und bindest sie fest, statt sie zu schneiden. Die Pflanze wird flacher und breiter, das [[licht|Licht]] erreicht mehr Triebspitzen – ohne Wachstumspause. Auch für [[autoflower|Autoflowers]] geeignet.

## Topping
Beim Topping kappst du die Haupttriebspitze über einem Nodium. Daraus wachsen zwei neue Haupttriebe. Das kostet ein paar Tage Erholung – am besten früh in der Wachstumsphase, spätestens 1–2 Wochen vor dem Umstellen.

## Entlaubung
Große Blätter, die Licht und Luft blockieren, gezielt entfernen: sanft zu Beginn der Blüte und noch einmal moderat um Blütewoche 3. Danach zurückhaltend sein, die Pflanze braucht ihre Blätter. Weniger Blattmasse verbessert auch die Luftzirkulation und senkt das Schimmelrisiko (siehe [[klima|Klima]]).

## Ruhe gönnen
Nach jedem Eingriff 24–48 Stunden keinen weiteren Stress: kein Düngerwechsel, kein Umtopfen.

## Im Zeltbuch
Journal-Arten „Topping“, „LST“, „Entlauben“ und „Lollipop“ nutzen – dann siehst du später im Kalender, wie die Pflanze auf jeden Eingriff reagiert hat.`},
 {id:'crop-steering',cat:'Bewässerung & Düngung',img:'steering',title:'Grundlagen Crop Steering',lead:'Mit Timing und Menge beim Gießen lenkst du die Pflanze zwischen Wachstum und Blütenbildung.',tags:['crop steering','dryback','shots','generativ','vegetativ','vwc'],related:['giessen','toepfe','substrat','duengung'],
  body:`## Das Prinzip
Crop Steering nutzt das Gießen gezielt, um die Pflanze zu lenken: vegetativ (mehr Wachstum und Blattmasse) oder generativ (mehr Blütenansatz, kompaktere Struktur).

## Die Stellschrauben
- Dryback: Wie stark das Substrat zwischen den Gaben abtrocknet. Größerer Dryback wirkt generativ. Grundlagen unter [[giessen|Richtig gießen]].
- Shot-Größe und Anzahl: Viele kleine Gaben mit wenig Dryback wirken vegetativ.
- Substrat-EC: Steigt sie über den Tag, wirkt das eher generativ.

## Typischer Verlauf in der Blüte
Frühe Blüte generativ mit moderatem Dryback (15–20 %) für Struktur, Mitte der Blüte mehr Volumen für Blütenmasse, späte Blüte wieder generativ zum Ausreifen.

## Wichtig
Konsequent messen – mit Waage oder Substratsensor – und pro Phase nur eine Stellschraube ändern. Nur so kannst du Ursache und Wirkung zuordnen. Crop Steering funktioniert am besten in Kokos oder Steinwolle (siehe [[substrat|Substratwahl]]) und in eher kleinen [[toepfe|Töpfen]].

## Im Zeltbuch
Unter „Crop Steering“ trägst du Shots, Messungen und Runoff ein. Die App berechnet den Nacht-Dryback und vergleicht ihn mit den Zielwerten deiner Phase.`},
 {id:'ernte',cat:'Ernte & Curing',img:'ernte',title:'Den Erntezeitpunkt bestimmen',lead:'Die Trichome zeigen zuverlässiger als alles andere, wann deine Pflanze reif ist.',tags:['ernte','trichome','erntezeitpunkt','lupe'],related:['trocknen','curing','phaenos','duengung'],
  body:`## Trichome statt Stempel
Die Härchen (Stempel) verfärben sich oft zu früh oder zu spät und sind kein verlässliches Signal. Schau stattdessen mit einer Lupe oder einem Clip-Makro (etwa 60-fach) auf die Trichome – auf den Blüten selbst, nicht auf den kleinen Blättern.

## So liest du die Trichome
- Klar: noch nicht reif, abwarten.
- Milchig-trüb: Die meisten Grower beginnen zu ernten, wenn der Großteil milchig ist.
- Bernstein: Ein steigender Anteil (etwa 10–30 %) gilt als spätes Erntefenster.

## Praxis
Prüf mehrere Stellen an mehreren Pflanzen, die Spitzen reifen oft zuerst. Die Blütedauer des Breeders ist ein guter Richtwert, die Trichome entscheiden. Nach der Ernte geht es weiter mit der [[trocknen|Trocknung]] und dem [[curing|Curing]].

## Im Zeltbuch
Nutze den Trichom-Check mit Makrofoto. Unter „Ernte & Curing → Vergleichen“ legst du Fotos verschiedener Tage oder Runs nebeneinander. Nach der Ernte bewertest du rückblickend, ob der Zeitpunkt gepasst hat.`},
 {id:'trocknen',cat:'Ernte & Curing',img:'trocknen',title:'Langsam und richtig trocknen',lead:'Die Trocknung entscheidet mit über Geruch und Geschmack. Langsam ist besser.',tags:['trocknen','trocknung','drying','60/60'],related:['ernte','curing','klima'],
  body:`## Die Bedingungen
Trockne dunkel, bei etwa 16–20 °C und 55–62 % Luftfeuchte, mit leichter, indirekter Luftbewegung. Die Blüten dürfen nicht direkt angeblasen werden. Bekannt ist die „60/60“-Faustregel: etwa 15,5 °C (60 °F) und 60 % Luftfeuchte.

## Dauer
Meist 7–14 Tage. Fertig ist die Trocknung, wenn kleine Stiele beim Biegen knacken, statt sich nur zu biegen. Zu schnelles Trocknen (zu warm, zu trocken) verschlechtert Geruch und Geschmack deutlich.

## Ganze Äste oder einzelne Blüten
Ganze Äste kopfüber aufzuhängen trocknet langsamer und gleichmäßiger. Trockennetze sind platzsparend, trocknen aber schneller – dann eher kühler und feuchter einstellen.

## Im Zeltbuch
Unter „Ernte & Curing → Trocknung“ trägst du je Strain Gewicht, Temperatur und Luftfeuchte ein. Die App zeigt den Gewichtsverlust gegenüber dem Nassgewicht – bei etwa 70–75 % sind Blüten meist bereit fürs [[curing|Curing]]. Richtwerte fürs Klima: [[klima|Temperatur & Luftfeuchte]].`},
 {id:'curing',cat:'Ernte & Curing',img:'curing',title:'Curing: Reifen im Glas',lead:'Nach der Trocknung reifen die Blüten im Glas nach – Geschmack und Geruch werden runder.',tags:['curing','glas','burpen','boveda','lagern'],related:['trocknen','ernte','samen-lagern'],
  body:`## Ins Glas
Füll luftdichte Gläser zu etwa drei Vierteln mit den getrockneten Blüten. Ein kleines Hygrometer im Glas zeigt die Luftfeuchte. Ziel: 58–62 %.

## Lüften („Burpen“)
- Woche 1–2: täglich für ein paar Minuten öffnen.
- Danach: etwa einmal pro Woche.
- Über 65 % im Glas: Blüten für einige Stunden offen nachtrocknen lassen, sonst droht Schimmel.
- Unter 55 %: zu trocken. Feuchtigkeitsregler-Beutel (z. B. 62 %) helfen.

## Wie lange?
Nach 3–4 Wochen merkst du einen deutlichen Unterschied bei Geruch und Geschmack. Viele Sorten profitieren auch von mehreren Monaten. Kühl und dunkel lagern.

## Im Zeltbuch
Unter „Ernte & Curing → Curing“ misst du jedes Glas einzeln. Unter „Lüft-Erinnerungen“ startest du für jeden Strain einen Lüft-Plan, der sich Tag für Tag und nach deinen Feuchte-Messungen anpasst. Zurück zur [[trocknen|Trocknung]] oder zum [[ernte|Erntezeitpunkt]].`}
];
/* Sortenporträts aus der Samenbank-Referenz – so steht jede Sorte auch als Beitrag zur Verfügung */
const strainSlug=n=>'sorte-'+slug(String(n).replace(/\(.*?\)/g,''));
function strainImg(s){if(/purple|zkittlez|punch|granddaddy/i.test(s.name))return 'indica';if(/auto/i.test(s.kind||''))return 'auto';let h=0;for(const c of s.name)h=(h*31+c.charCodeAt(0))>>>0;return 's'+(h%10+1);}
function strainPost(s){
  const auto=/auto/i.test(s.kind||''),sat=/sativa/i.test(s.kind||''),ind=/^indica/i.test(s.kind||'')||/indica-dominant/i.test(s.kind||'');
  const fl=String(s.flower||'').match(/\d+/g)||[],flMax=fl.length?Math.max(...fl.map(Number)):0;
  const tips=[];
  if(auto)tips.push('Autoflower: direkt in den Endtopf säen, durchgehend 18/6 oder 20/4 und sanft trainieren – mehr im Artikel [[autoflower|Autoflower richtig growen]].');
  if(sat&&!auto)tips.push('Sativa-dominant: Rechne mit deutlichem Stretch nach dem Umstellen. Früh mit [[training|LST oder Topping]] beginnen und den [[licht|Lichtabstand]] im Blick behalten.');
  if(ind&&!auto)tips.push('Indica-dominant: kompakt mit dichten Blüten. Achte in der späten Blüte auf niedrige Luftfeuchte und gute Umluft – siehe [[klima|Klima & Schimmel vorbeugen]].');
  if(flMax>=65&&!auto)tips.push(`Lange Blüte (bis etwa ${flMax} Tage): Plane genug Zeit ein und verlass dich für den Erntezeitpunkt auf die [[ernte|Trichome]].`);
  if(flMax&&flMax<=56&&!auto)tips.push('Relativ kurze Blüte – gut geeignet, wenn du mehrere Runs pro Jahr planst. Siehe [[sortenwahl|Sortenwahl]].');

  return {id:strainSlug(s.name),cat:'Sortenporträts',img:strainImg(s),strain:s.name,title:`Sortenporträt: ${s.name}`,lead:s.desc,tags:[s.name.toLowerCase(),'sorte','strain',(s.kind||'').toLowerCase(),(s.breeder||'').toLowerCase()],related:['samen-typen',auto?'autoflower':'indica-sativa','sortenwahl','phaenos'],
    facts:[['Breeder',s.breeder],['Typ',s.kind],['Genetik',s.gen],['Blütedauer',s.flower?`${s.flower} Tage`:'–']],
    body:`## Steckbrief
${s.desc} Abstammung laut gängigen Quellen: ${s.gen}. Angaben zu Herkunft und Blütedauer variieren je nach Breeder und Pheno – die Angaben deines Samenanbieters haben Vorrang.

## Anbau-Hinweise
${tips.join('\n\n')}

## Samen und Genetik
Welcher Samen-Typ passt, erklärt [[samen-typen|Samen-Typen: regulär, feminisiert, Autoflower]]. Wie du aus mehreren Pflanzen die beste auswählst, steht unter [[phaenos|Phänotypen und Pheno-Hunting]]. Und damit die Samen bis zum nächsten Run fit bleiben: [[samen-lagern|Samen richtig lagern]].`};
}
let _allPosts=null;

const postById=id=>allPosts().find(p=>p.id===id);
const plainBody=b=>String(b).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'$2').replace(/^## /gm,'').replace(/^- /gm,'• ');
/* Kompatibilität: Der Grow-Coach durchsucht TIPS (title, tags, body) */

const coachTips=()=>_coachTips||(_coachTips=allPosts().map(p=>({id:p.id,title:p.title,tags:p.tags||[],body:plainBody(p.lead+'\n\n'+p.body)})));
const readMin=p=>Math.max(1,Math.round(String(p.body).split(/\s+/).length/200));
/* Artikeltext → HTML, interne Links als Knöpfe */
function artHtml(body){
  const inl=s=>esc(s).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,(m,id,t)=>postById(id)?`<a class="ilink" href="#${esc(id)}" data-act="tip" data-id="${esc(id)}">${t}</a>`:t);
  return String(body).trim().split(/\n{2,}/).map(block=>{
    const lines=block.split('\n');
    if(lines[0].startsWith('## ')){const h=`<h3>${inl(lines[0].slice(3))}</h3>`;const rest=lines.slice(1);return h+(rest.length?blockHtml(rest,inl):'');}
    return blockHtml(lines,inl);
  }).join('');
}
function blockHtml(lines,inl){
  if(lines.every(l=>l.startsWith('- ')))return `<ul>${lines.map(l=>`<li>${inl(l.slice(2))}</li>`).join('')}</ul>`;
  const li=lines.filter(l=>l.startsWith('- ')),tx=lines.filter(l=>!l.startsWith('- '));
  return (tx.length?`<p>${inl(tx.join(' '))}</p>`:'')+(li.length?`<ul>${li.map(l=>`<li>${inl(l.slice(2))}</li>`).join('')}</ul>`:'');
}
function blogTile(p,wide){

}

}
function blogGrid(){

  if(!list.length)return '<div class="card empty"><p class="muted">Keine Beiträge gefunden. Versuch einen anderen Begriff.</p></div>';

/* Bild einmal dekodieren (berücksichtigt die EXIF-Drehung), dann beliebig viele Größen erzeugen */
async function decodeImage(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const x=new Image();x.decoding='async';x.onload=()=>res(x);x.onerror=()=>rej(new Error('decode'));x.src=url;});
    return {src:im,w:im.naturalWidth,h:im.naturalHeight,done:()=>URL.revokeObjectURL(url)};
  }catch(e){
    URL.revokeObjectURL(url);
    if(window.createImageBitmap){try{const b=await createImageBitmap(file);return {src:b,w:b.width,h:b.height,done:()=>b.close&&b.close()};}catch(e2){}}
    const err=new Error('decode');err.code='decode';throw err;
  }
}
const canvasBlob=(c,q)=>new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',q));
async function imageVariants(file,sizes){
  const d=await decodeImage(file);

    const out=[];

      const s=Math.min(1,max/Math.max(d.w,d.h));
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(d.w*s));c.height=Math.max(1,Math.round(d.h*s));

      const webSafe=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
      out.push(!b?file:(max<1000||b.size<file.size||!webSafe)?b:file);
    }

  }finally{d.done();}
}
async function compress(file,max=1600,q=0.82){try{return (await imageVariants(file,[[max,q]]))[0];}catch(e){return file;}}

async function exifDate(file){
  try{
    if(!/jpe?g/i.test(file.type)&&!/\.jpe?g$/i.test(file.name||''))return null;
    const v=new DataView(await file.slice(0,262144).arrayBuffer());
    if(v.getUint16(0)!==0xFFD8)return null;
    let o=2;
    while(o+10<v.byteLength){
      const mk=v.getUint16(o),len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){
        const t=o+10,le=v.getUint16(t)===0x4949,u16=p=>v.getUint16(p,le),u32=p=>v.getUint32(p,le);
        const ifd=(off,tags)=>{const n=u16(t+off),r={};for(let i=0;i<n;i++){const e=t+off+2+i*12,tag=u16(e);if(tags.includes(tag))r[tag]=u32(e+8);}return r;};
        const str=off=>{let s='';for(let i=0;i<19;i++)s+=String.fromCharCode(v.getUint8(t+off+i));return s;};
        const i0=ifd(u32(t+4),[0x8769,0x0132]);let s=null;
        if(i0[0x8769]){const ex=ifd(i0[0x8769],[0x9003,0x9004]);const p=ex[0x9003]||ex[0x9004];if(p)s=str(p);}
        if(!s&&i0[0x0132])s=str(i0[0x0132]);
        const m=s&&s.match(/^(\d{4}):(\d{2}):(\d{2})/);
        return m&&m[1]>'1990'?`${m[1]}-${m[2]}-${m[3]}`:null;
      }
      if((mk&0xFF00)!==0xFF00)break;
      o+=2+len;
    }
  }catch(e){}
  return null;
}

    const mt=window.MediaRecorder&&types.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}});
    const c=document.createElement('canvas');c.width=W;c.height=H;

    return {blob:out,thumb,dur,w:W,h:H,compressed:true};
  }finally{URL.revokeObjectURL(url);if(ac)ac.close().catch(()=>{});}
}

/* ----- Sperrbildschirm ----- */
let lockTimer=null;
function renderLock(){
  const L=$('#lock');clearInterval(lockTimer);
  if(!U.locked){L.hidden=true;L.innerHTML='';return;}
  L.hidden=false;
  const p=byId('profiles',U.lockTarget);
  const f=p?failState(p.id):{n:0,until:0},wait=Math.max(0,Math.ceil((f.until-Date.now())/1000));
  if(wait>0)lockTimer=setInterval(()=>{if(Date.now()>=f.until){clearInterval(lockTimer);renderLock();}else{const m=$('#lock .msg');if(m)m.textContent=`Zu viele Versuche – warte ${fmtDur(Math.ceil((f.until-Date.now())/1000))}`;}},1000);
  const msg=wait>0?`Zu viele Versuche – warte ${fmtDur(wait)}`:(U.pinMsg||'');
  if((U.lockStage==='pin'||U.lockStage==='pass')&&p&&isLocked(p)){
    const isPass=p.lock?.type==='pass';
    L.innerHTML=`<div class="lock-in">${avatar(p,80)}<h1>${esc(p.name)}</h1><p class="muted">${U.pinBusy?'Entsperre …':isPass?'Passwort eingeben':'PIN eingeben'}</p>
    ${isPass?`<form id="passForm" class="stack" style="width:100%"><input type="password" id="passIn" autocomplete="current-password" ${wait>0||U.pinBusy?'disabled':''} aria-label="Passwort"><button class="btn primary block" type="submit" ${wait>0||U.pinBusy?'disabled':''}>Entsperren</button></form>`
    :`<div class="pin-dots ${U.pinEntry.length?'':'none'}" id="pinDots">${U.pinEntry.length?Array.from({length:U.pinEntry.length},()=>'<i></i>').join(''):'<i></i><i></i><i></i><i></i>'}</div>`}
    <p class="msg" role="alert">${esc(msg)}</p>
    ${isPass?'':`<div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pinKey" data-k="${n}" ${wait>0||U.pinBusy?'disabled':''}>${n}</button>`).join('')}<button data-act="pinDel" aria-label="Ziffer löschen">⌫</button><button data-act="pinKey" data-k="0" ${wait>0||U.pinBusy?'disabled':''}>0</button><button class="ok" data-act="pinOk" aria-label="Entsperren" ${wait>0||U.pinBusy||!U.pinEntry.length?'disabled':''}>✓</button></div>`}
    <div class="row" style="justify-content:center"><button class="linkish" data-act="lockBack">Anderes Profil</button><button class="linkish" data-act="pinForgot">${isPass?'Passwort':'PIN'} vergessen?</button></div></div>`;
    setTimeout(()=>{const pi=$('#passIn');if(pi&&!pi.disabled)pi.focus();},30);
  }else if(U.lockStage==='forgot'&&p){
    L.innerHTML=`<div class="lock-in">${avatar(p,64)}<h1>Zugang vergessen</h1><p>Deine Daten sind mit der PIN bzw. dem Passwort verschlüsselt. Ohne sie lassen sie sich nicht wiederherstellen. Du kannst nur das Profil „${esc(p.name)}“ mit allen Daten löschen – ein Backup kannst du danach in ein neues Profil importieren.</p>
    <button class="btn danger" data-act="forgotDelete" data-confirm>Profil und Daten löschen</button><button class="btn" data-act="lockBack">Zurück</button></div>`;
  }else{
    L.innerHTML=`<div class="lock-in"><span class="brand">Zeltbuch</span><h1>Wer growt heute?</h1>
    <div class="plist">${S.profiles.map(q=>`<button data-act="lockPick" data-id="${q.id}">${avatar(q,42)}<span class="grow">${esc(q.name)}</span>${isLocked(q)?IC.lock:''}</button>`).join('')}<button data-act="profileNew">${IC.plus}<span class="grow">Neues Profil</span></button></div></div>`;
  }
}
async function tryUnlock(secret){
  const p=byId('profiles',U.lockTarget);if(!p||U.pinBusy)return;
  if(failState(p.id).until>Date.now())return;
  U.pinBusy=true;U.pinMsg='';renderLock();
  let ok=false;try{ok=await unlock(p.id,secret);}catch(e){console.error(e);}

/* ---------- Backup ---------- */
function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
function dataURLToBlob(u){const i=u.indexOf(',');const mime=(u.slice(0,i).match(/data:([^;]+)/)||[])[1]||'application/octet-stream';return new Blob([unb64(u.slice(i+1))],{type:mime});}
async function offerFile(name,blob,okMsg){
  if(DL){try{await DL.save({filename:name,data:blob});toast(okMsg);return true;}catch(e){if(e&&e.code==='declined')return false;toast('Speichern nicht möglich: '+(e.message||e.code));return false;}}
  if(window.claude){toast('Speichern ist in dieser Ansicht nicht verfügbar');return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast(okMsg);return true;
}
async function exportBackup(pw,status){
  try{
    status&&status('Sammle Daten …');await flush();
    const runs=mine('runs'),rids=new Set(runs.map(r=>r.id)),byRun=s=>S[s].filter(x=>rids.has(x.runId));
    const photos=byRun('photos'),media=[];
    let i=0;for(const p of photos){status&&status(`Packe Medien ${++i}/${photos.length} …`);for(const id of [p.id,p.id+'_t']){const b=await loadMedia(id);if(b)media.push({id,dataUrl:await blobToDataURL(b)});}}
    const stores={setups:mine('setups'),plans:mine('plans'),runs,plants:byRun('plants'),entries:byRun('entries'),photos,feeds:byRun('feeds'),climate:byRun('climate'),tasks:byRun('tasks'),steer:byRun('steer'),expenses:byRun('expenses'),meters:byRun('meters'),strains:mine('strains'),settings:mine('settings')};
    const P=profile();
    let json=JSON.stringify({app:'zeltbuch',version:5,profile:{name:P.name},exportedAt:new Date().toISOString(),meta:{activeRun:activeRun()?.id||null},stores,media});
    if(pw){status&&status('Verschlüssele Backup …');const salt=rnd(16),key=await deriveKey(pw,salt,KDF_ITER);const {iv,ct}=await encBytes(key,te.encode(json));json=JSON.stringify({app:'zeltbuch',version:5,encrypted:true,salt:b64(salt),iter:KDF_ITER,iv:b64(iv),data:b64(ct)});}
    status&&status(`Datei: ${fmtMB(json.length)}`);
    return await offerFile(`zeltbuch-${slug(P.name)}-${todayISO()}${pw?'-verschluesselt':''}.json`,new Blob([json],{type:'application/json'}),'Backup gespeichert');
  }catch(e){console.error(e);toast('Export fehlgeschlagen');return false;}
}
function normImport(d){['setups','runs','plants','entries','photos','plans','feeds','climate','tasks','steer','expenses','meters','strains','settings'].forEach(s=>{d.stores[s]=d.stores[s]||[];});
  if(!d.media){d.media=[];(d.photos||[]).forEach(p=>{const{dataUrl,blob,...rest}=p;if(dataUrl){d.media.push({id:p.id,dataUrl});}d.stores.photos.push({...rest,kind:'image'});});}
  return d;}
function readImport(file){
  if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='zeltbuch')throw 0;
    if(d.encrypted){U.importData={name:file.name,pending:d};}else{if(!d.stores)throw 0;U.importData={name:file.name,data:normImport(d)};}
    render();}catch(e){toast('Diese Datei ist kein Zeltbuch-Backup');}};
  r.onerror=()=>toast('Datei konnte nicht gelesen werden');r.readAsText(file);
}
async function decryptImport(pw){
  const e=U.importData&&U.importData.pending;if(!e)return;
  try{const key=await deriveKey(pw,unb64(e.salt),e.iter);const buf=await decBytes(key,unb64(e.iv),unb64(e.data));const d=JSON.parse(td.decode(buf));U.importData={name:U.importData.name,data:normImport(d)};render();}
  catch(err){toast('Falsches Passwort');}
}
async function importBackup(){
  const d=U.importData&&U.importData.data;if(!d)return;const pid=PID();
  toast('Importiere …');
  for(const r of mine('runs')){cascadeRun(r.id);remove('runs',r.id);}
  for(const s of ['setups','plans','strains','settings'])for(const x of mine(s))remove(s,x.id);
  await flush();
  const map={};const nid=o=>{if(!o)return o;if(!map[o])map[o]=uid();return map[o];};const ref=v=>v?(map[v]||''):v;
  const strip=x=>{const{profileId,_e,iv,ct,blob,dataUrl,...rest}=x;return rest;};
  d.stores.setups.forEach(x=>save('setups',{...strip(x),id:nid(x.id),pid}));
  d.stores.plans.forEach(x=>save('plans',{...strip(x),id:nid(x.id),pid}));
  d.stores.runs.forEach(x=>save('runs',{...strip(x),id:nid(x.id),pid,setupId:ref(x.setupId)}));
  d.stores.plants.forEach(x=>save('plants',{...strip(x),id:nid(x.id),pid,runId:ref(x.runId)}));
  d.stores.entries.forEach(x=>save('entries',{...strip(x),id:uid(),pid,runId:ref(x.runId),plantId:ref(x.plantId)}));
  d.stores.photos.forEach(x=>save('photos',{...strip(x),id:nid(x.id),pid,runId:ref(x.runId),plantId:ref(x.plantId),kind:x.kind||'image'}));
  d.stores.feeds.forEach(x=>save('feeds',{...strip(x),id:uid(),pid,runId:ref(x.runId),planId:ref(x.planId)}));
  d.stores.climate.forEach(x=>save('climate',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.tasks.forEach(x=>save('tasks',{...strip(x),id:uid(),pid,runId:ref(x.runId),plantId:ref(x.plantId)}));
  d.stores.steer.forEach(x=>save('steer',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.expenses.forEach(x=>save('expenses',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.meters.forEach(x=>save('meters',{...strip(x),id:uid(),pid,runId:ref(x.runId)}));
  d.stores.strains.forEach(x=>save('strains',{...strip(x),id:uid(),pid}));
  d.stores.settings.forEach(x=>{const k=String(x.id).split(':').slice(1).join(':');if(k)save('settings',{...strip(x),id:pid+':'+k,pid});});
  for(const m of d.media){const base=m.id.endsWith('_t')?m.id.slice(0,-2):m.id;const nb=map[base];if(!nb)continue;try{await saveMedia(nb+(m.id.endsWith('_t')?'_t':''),pid,dataURLToBlob(m.dataUrl));}catch(e){}}
  await flush();dropMediaURLs();
  setActiveRun(ref(d.meta?.activeRun)||mine('runs')[0]?.id||null);
  U.importData=null;U.planId=null;U.weekPlan=null;U.tankL=null;render();toast('Backup importiert');
}

function planEdit(el){
  const p=curPlan();if(!p)return;const k=el.dataset.pe,v=el.value;
  if(k==='name'||k==='maker'||k==='note')p[k]=v;
  else if(k==='baseL'){const n=parseNum(v);if(!isNaN(n)&&n>0)p.baseL=n;}
  else if(k==='prodName')p.products[+el.dataset.i].name=v;
  else if(k==='prodUnit')p.products[+el.dataset.i].unit=v;
  else{const w=p.weeks[+el.dataset.w];if(!w)return;
    if(k==='wkPhase')w.phase=v;else if(k==='wkN')w.n=parseInt(v,10)||1;
    else if(k==='dose'){const t=v.trim();if(t)w.doses[el.dataset.p]=t;else delete w.doses[el.dataset.p];}
    else if(k==='ec')w.ec=v.trim();else if(k==='ph')w.ph=v.trim();

  save('plans',p);
  if(['name','baseL','prodName','wkPhase','wkN'].includes(k))render();
}

/* ----- Wasserwerte ----- */
function baseEc(st){
  if(!st)return NaN;const tap=parseNum(st.waterEc),roPct=Math.min(100,Math.max(0,parseNum(st.roPct)||0))/100;
  const roEc=isNaN(parseNum(st.roEc))?0.02:parseNum(st.roEc);
  if(isNaN(tap)&&roPct<1)return NaN;
  return (isNaN(tap)?0:tap)*(1-roPct)+roEc*roPct;
}
function feedEcTarget(lf,lp,run){const r=parseRange(lf.targetEc);if(!r)return null;if(lp&&lp.ecPlus){const b=baseEc(byId('setups',run.setupId));if(isNaN(b))return null;return [r[0]+b,r[1]+b];}return r;}
function waterLine(plan,week){

];
const steerPhases=()=>getSet('steer',null)||STEER_DEF;
function steerPhaseFor(I){const ph=steerPhases();if(!I||!I.bloomWeek)return ph.find(p=>p.key==='veg')||ph[0];return ph.find(p=>p.from&&I.bloomWeek>=p.from&&I.bloomWeek<=p.to)||ph[ph.length-1];}
function steerDay(run,iso){
  const all=S.steer.filter(e=>e.runId===run.id);
  const ev=all.filter(e=>e.at.slice(0,10)===iso).sort(byTime),prev=all.filter(e=>e.at.slice(0,10)===addDays(iso,-1)).sort(byTime);
  const shots=ev.filter(e=>e.kind==='shot'),reads=ev.filter(e=>e.kind==='read'),ro=ev.filter(e=>e.kind==='runoff');
  const hasV=r=>!isNaN(parseNum(r.vwc));
  const mode=[...reads,...prev].some(r=>r.kind==='read'&&hasV(r))?'vwc':'w';
  const val=r=>mode==='vwc'?parseNum(r.vwc):parseNum(r.w);
  const prevReads=prev.filter(e=>e.kind==='read'&&!isNaN(val(e))),prevLast=prev.filter(e=>e.kind==='shot').pop();
  const pk=prevReads.filter(r=>!prevLast||r.at>=prevLast.at);
  const peak=pk.length?Math.max(...pk.map(val)):prevReads.length?Math.max(...prevReads.map(val)):NaN;
  const firstShot=shots[0];
  const morn=reads.filter(r=>(!firstShot||r.at<=firstShot.at)&&!isNaN(val(r)));
  const low=morn.length?Math.min(...morn.map(val)):NaN;
  const st=byId('setups',run.setupId),potL=parseNum(st?.potL);
  let db=NaN,dbAbs=NaN;
  if(!isNaN(peak)&&!isNaN(low)&&peak>0){dbAbs=peak-low;db=mode==='vwc'?dbAbs/peak*100:(potL>0?dbAbs/potL*100:dbAbs/peak*100);}
  const dayVals=reads.map(val).filter(v=>!isNaN(v));
  const sumShot=shots.reduce((s,e)=>s+(parseNum(e.ml)||0),0),sumRo=ro.reduce((s,e)=>s+(parseNum(e.ml)||0),0);
  const roEcEv=[...ro].reverse().find(e=>!isNaN(parseNum(e.ec)));
  const subEc=reads.filter(r=>!isNaN(parseNum(r.ec)));
  return {ev,shots,reads,ro,mode,peak,low,db,dbAbs,potL,max:dayVals.length?Math.max(...dayVals):NaN,min:dayVals.length?Math.min(...dayVals):NaN,sumShot,sumRo,roPct:sumShot>0&&sumRo>0?sumRo/sumShot*100:NaN,roEc:roEcEv?parseNum(roEcEv.ec):NaN,subEc0:subEc.length?parseNum(subEc[0].ec):NaN,subEc1:subEc.length?parseNum(subEc[subEc.length-1].ec):NaN};
}
function steerAlerts(run,I){

/* ----- Trocknung & Curing ----- */
function measTxt(e){
  if(e.type==='Trocknung')return `<span class="small">${[e.w?`${fmtDE(parseNum(e.w),0)} g`:'',e.t?`${e.t} °C`:'',e.rh?`${e.rh} % rLF`:''].filter(Boolean).join(' · ')}</span>`;
  if(e.type==='Curing')return `<span class="small">${[e.jar?`Glas ${esc(e.jar)}`:'',e.rh?`${e.rh} % im Glas`:'',e.w?`${fmtDE(parseNum(e.w),0)} g`:'',e.burp?'gelüftet':''].filter(Boolean).join(' · ')}</span>`;
  return '';
}
function cureStatus(rh){const v=parseNum(rh);if(isNaN(v))return null;if(v<55)return ['b','zu trocken'];if(v<58)return ['w','etwas trocken'];if(v<=62)return ['','ideal'];if(v<=65)return ['w','etwas feucht – öfter lüften'];return ['b','zu feucht – täglich lüften, ggf. offen nachtrocknen'];}
/* ---------- Trocknung & Curing je Strain, Lüft-Plan ----------
   Lüft-Plan nach gängigen Anleitungen (u. a. BudTrainer, Trimleaf, Royal Queen Seeds, Atmosi, Azarius):
   Woche 1 häufig und länger lüften, dann schrittweise seltener; Luftfeuchte im Glas steuert nach. */
const CURE_STEPS=[
  {to:3,n:2,every:1,min:'10–15',tip:'Morgens und abends öffnen, Blüten sanft durchschütteln. Auf Heu- oder Ammoniakgeruch achten – das heißt: zu feucht.'},
  {to:7,n:1,every:1,min:'10',tip:'Einmal täglich lüften. Bleibt die Feuchte über 65 %, weiter zweimal täglich.'},
  {to:14,n:1,every:2,min:'5–10',tip:'Alle zwei Tage lüften. Die Feuchte sollte sich bei 58–62 % einpendeln.'},
  {to:21,n:1,every:3,min:'5',tip:'Alle drei Tage kurz lüften und riechen.'},
  {to:30,n:1,every:7,min:'2–5',tip:'Einmal pro Woche kurz lüften. Nach etwa 4 Wochen ist ein guter Cure erreicht.'},
  {to:60,n:1,every:14,min:'2–5',tip:'Alle zwei Wochen kontrollieren. Viele Sorten werden bis 8 Wochen noch besser.'},
  {to:99999,n:1,every:30,min:'kurz',tip:'Lagerphase: einmal im Monat öffnen und prüfen. Kühl und dunkel lagern.'}
];
function lastCureRh(p){const e=S.entries.filter(x=>x.type==='Curing'&&x.plantId===p.id&&!isNaN(parseNum(x.rh))).sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at))[0];return e&&daysBetween(e.date,todayISO())<=3?parseNum(e.rh):NaN;}
function curePlan(day,rh){
  const s={...CURE_STEPS.find(x=>day<=x.to)};s.day=day;s.warn='';s.state='ok';
  if(isNaN(rh))s.hint='Miss die Luftfeuchte im Glas (kleines Hygrometer) – dann passt das Zeltbuch den Plan an.';
  else if(rh>70){Object.assign(s,{n:2,every:1,min:'60+',state:'b',warn:`${fmtDE(rh,0)} % – deutlich zu feucht: Blüten 12–24 h offen nachtrocknen lassen, dann zurück ins Glas. Schimmelgefahr!`});}
  else if(rh>65){Object.assign(s,{n:2,every:1,min:'30–60',state:'w',warn:`${fmtDE(rh,0)} % – zu feucht: Deckel 1–2 h offen lassen, danach 2× täglich lüften, bis 58–62 % erreicht sind.`});}
  else if(rh>62){s.every=Math.min(s.every,1);s.state='w';s.warn=`${fmtDE(rh,0)} % – etwas feucht: täglich lüften, bis die Feuchte bei 58–62 % liegt.`;}
  else if(rh>=58){s.warn=`${fmtDE(rh,0)} % – ideal.`;}
  else if(rh>=55){s.every=Math.max(s.every,3);s.state='w';s.warn=`${fmtDE(rh,0)} % – etwas trocken: seltener lüften, ggf. einen 62-%-Feuchtepack dazulegen.`;}
  else{Object.assign(s,{n:1,every:2,min:'0',pause:true,state:'b',warn:`${fmtDE(rh,0)} % – zu trocken: nicht lüften, 62-%-Feuchtepack ins Glas, in 2 Tagen erneut messen.`});}
  s.title=s.pause?'Glas: Feuchte prüfen (nicht lüften)':s.n>1?`Gläser lüften · 2× heute, je ${s.min} Min.`:`Gläser lüften · ${s.min} Min.`;
  return s;
}
function cureTaskFor(p){return S.tasks.find(t=>t.cure&&t.plantId===p.id&&!t.done);}
function cureRefresh(p){
  const t=cureTaskFor(p);if(!t||!p.cure)return;
  const day=Math.max(1,daysBetween(p.cure.start,todayISO())+1),pl=curePlan(day,lastCureRh(p));
  const title=`${pl.title} (${p.label})`;
  if(t.title!==title||t.n!==pl.n){t.title=title;t.n=pl.n;if(t.due>todayISO()&&pl.every===1&&p.cure.start<=todayISO())t.due=todayISO();save('tasks',t);}

function cureAdvance(t){
  const p=byId('plants',t.plantId);if(!p||!p.cure){t.done=true;t.doneAt=nowStamp();save('tasks',t);return;}
  const today=todayISO(),day=Math.max(1,daysBetween(p.cure.start,today)+1),pl=curePlan(day,lastCureRh(p));
  if(pl.n>1&&t.cntDate!==today){t.cntDate=today;t.cnt=1;t.title=`${pl.title.replace('2× heute','2. Mal heute (abends)')} (${p.label})`;save('tasks',t);return;}
  t.cnt=0;t.cntDate='';
  const nd=addDays(today,pl.every),npl=curePlan(Math.max(1,daysBetween(p.cure.start,nd)+1),lastCureRh(p));

}
function cureStart(p,start){

}
function cureStop(p){delete p.cure;save('plants',p);const t=cureTaskFor(p);if(t){t.done=true;t.doneAt=nowStamp();save('tasks',t);}}

/* ----- Verbrauch & Kosten ----- */
function feedUsage(run){
  const map={};let water=0,n=0;
  S.feeds.filter(f=>f.runId===run.id).forEach(f=>{n++;water+=parseNum(f.tankL)||0;(f.amounts||[]).forEach(a=>{const k=String(a.name).trim();const m=map[k.toLowerCase()]||(map[k.toLowerCase()]={name:k,unit:a.unit||'ml',amount:0});m.amount+=parseNum(a.amount)||0;});});
  return {items:Object.values(map).sort((a,b)=>b.amount-a.amount),water,n};
}
function powerUse(run){
  const st=byId('setups',run.setupId),I=runInfo(run);
  const meters=S.meters.filter(m=>m.runId===run.id&&!isNaN(parseNum(m.v))).sort((a,b)=>a.date.localeCompare(b.date));
  if(meters.length>=2){const a=meters[0],b=meters[meters.length-1];return {kwh:Math.max(0,parseNum(b.v)-parseNum(a.v)),measured:true,from:a.date,to:b.date,meters};}
  const W=parseNum(st?.watt),X=parseNum(st?.extraW)||0;
  if(!(W>0)&&!(X>0))return {kwh:NaN,measured:false,meters};
  const hv=parseNum(run.lightVeg)||18,hb=parseNum(run.lightBloom)||12;
  const end=(I.phases.find(p=>p.type==='Ernte')||{}).date||todayISO();
  let kwh=0,days=0;
  for(let d=run.start;d<=end&&days<400;d=addDays(d,1)){days++;const J=runInfo(run,d);const h=J.phaseIdx<=1?hv:J.phaseIdx<=3?hb:0;kwh+=((W>0?W:0)*h+X*24)/1000;}
  return {kwh,measured:false,days,hv,hb,W,X,meters};
}
function costCalc(run){
  const prices=getSet('prices',{}),kwhP=parseNum(getSet('kwh',''));
  const U1=feedUsage(run);let fert=0,fertKnown=true;
  U1.items.forEach(it=>{const p=prices[it.name.toLowerCase()];const size=parseNum(p?.size),price=parseNum(p?.price);if(size>0&&price>=0&&!isNaN(price)){it.cost=it.amount/size*price;fert+=it.cost;}else fertKnown=false;});
  const pw=powerUse(run);const power=!isNaN(pw.kwh)&&kwhP>=0&&!isNaN(kwhP)?pw.kwh*kwhP:NaN;
  const ex=S.expenses.filter(e=>e.runId===run.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));const exSum=ex.reduce((s,e)=>s+(parseNum(e.amount)||0),0);
  const dry=runYield(run).dry;
  const total=fert+(isNaN(power)?0:power)+exSum;
  return {usage:U1,fert,fertKnown,pw,power,kwhP,ex,exSum,total,dry,perG:dry>0&&total>0?total/dry:NaN,prices};
}

  ${fld('Strompreis (€ pro kWh)',`<input id="kwhPrice" value="${esc(getSet('kwh',''))}" inputmode="decimal" placeholder="z. B. 0,35">`)}
  ${C.pw.meters.length?`<div class="list">${C.pw.meters.map(m=>`<div class="li" style="align-items:center"><span class="small num" style="width:52px">${fmtShort(m.date)}</span><span class="grow num">${esc(m.v)} kWh</span><button class="icon-btn" data-act="del" data-store="meters" data-id="${m.id}" data-confirm aria-label="Löschen">✕</button></div>`).join('')}</div>`:''}

function seedLibHits(q){
  q=String(q||'').trim().toLowerCase();if(!q)return [];
  return SEED_LIB.filter(s=>s.name.toLowerCase().includes(q)||(s.gen||'').toLowerCase().includes(q)||(s.kind||'').toLowerCase().includes(q)||(s.breeder||'').toLowerCase().includes(q)).slice(0,8);
}
const strainByName=n=>{const k=String(n||'').trim().toLowerCase();return k?mine('strains').find(s=>s.name.trim().toLowerCase()===k):null;};
function strainHist(s){
  const k=s.name.trim().toLowerCase();
  const pl=myPlants().filter(p=>String(p.strain||p.label||'').trim().toLowerCase()===k);
  const runs=[...new Set(pl.map(p=>p.runId))].map(id=>byId('runs',id)).filter(Boolean);
  const dry=pl.map(plantDry).filter(v=>!isNaN(v)),rat=pl.map(p=>avgRating(p.review)).filter(v=>v>0);
  return {pl,runs,dry:dry.length?dry.reduce((a,b)=>a+b,0)/dry.length:NaN,rating:rat.length?rat.reduce((a,b)=>a+b,0)/rat.length:0};
}
/* Rangliste über ALLE je gegrowten Strains (auch archiviert), gruppiert nach Sorte – nicht nur Sorten aus der Genetik */
function strainRank(){
  const g={};
  myPlants().forEach(p=>{const rt=avgRating(p.review);if(!rt)return;const name=(p.strain||p.label).trim(),k=name.toLowerCase();(g[k]=g[k]||{name,r:[],pl:[]}).r.push(rt);g[k].pl.push(p);});
  return Object.values(g).map(x=>({name:x.name,s:strainByName(x.name),pl:x.pl,h:{rating:x.r.reduce((a,b)=>a+b,0)/x.r.length,n:x.r.length}})).sort((a,b)=>b.h.rating-a.h.rating);
}

async function tlShow(i){
  const list=tlList();if(!list.length)return;U.tl.i=i;const p=list[i],run=activeRun(),I=runInfo(run,p.date);
  const u=await mediaURL(p.id);const img=$('#tlImg');if(img&&U.tl.i===i)img.src=u;
  const m=$('#tlMeta');if(m)m.textContent=`${fmtDate(p.date)} · Tag ${I.day}${I.bloomDay?' · Blüte Tag '+I.bloomDay:''}${p.plantId?' · '+plantName(p.plantId):''}`;
  const t=$('#tlTitle');if(t)t.textContent=`Zeitraffer · ${i+1}/${list.length}`;
  const r=$('#tlPos');if(r)r.value=i;
}
function tlPlay(){
  if(U.tl.playing){tlStop();renderTl();return;}
  const list=tlList();if(list.length<2)return;
  list.forEach(p=>mediaURL(p.id));
  U.tl.playing=true;if(U.tl.i>=list.length-1)U.tl.i=0;
  const b=$('[data-act=tlPlay]');if(b)b.textContent='Pause';
  U.tl.timer=setInterval(()=>{const n=tlList().length;const ni=U.tl.i+1;if(ni>=n){tlStop();const bb=$('[data-act=tlPlay]');if(bb)bb.textContent='Abspielen';return;}tlShow(ni);},1000/U.tl.fps);
}
async function tlExport(){
  const list=tlList(),run=activeRun();if(list.length<2||U.tl.busy)return;
  const msg=t=>{const m=$('#tlMsg');if(m)m.textContent=t;};
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mt=window.MediaRecorder&&types.find(t=>{try{return MediaRecorder.isTypeSupported(t);}catch(e){return false;}});
  if(!mt){msg('Video-Export wird von diesem Browser nicht unterstützt.');return;}
  U.tl.busy=true;tlStop();msg('Lade Fotos …');
  try{
    const imgs=[];for(const p of list){const u=await mediaURL(p.id);const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.onerror=()=>r(null);x.src=u;});if(im)imgs.push([im,p]);}
    const f=imgs[0][0];const ar=f.naturalHeight/f.naturalWidth;const W=720,H=Math.min(1280,Math.max(404,Math.round(W*ar/2)*2));
    const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
    const stream=c.captureStream(30);const rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:4000000});
    const ch=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data);};const stopped=new Promise(r=>{rec.onstop=r;});
    rec.start(500);
    for(let i=0;i<imgs.length;i++){
      const [im,p]=imgs[i],I=runInfo(run,p.date);
      x.fillStyle='#0B0F0C';x.fillRect(0,0,W,H);
      const s=Math.min(W/im.naturalWidth,H/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      const label=`${fmtShort(p.date)} · Tag ${I.day}${I.bloomDay?' · Blüte '+I.bloomDay:''}`;
      x.font='600 26px system-ui,sans-serif';const tw=x.measureText(label).width;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(16,H-60,tw+28,44);x.fillStyle='#fff';x.fillText(label,30,H-29);
      msg(`Erstelle Video … ${i+1}/${imgs.length}`);
      await sleep(1000/U.tl.fps);
    }
    await sleep(600);rec.stop();await stopped;
    const blob=new Blob(ch,{type:'video/webm'});msg(`Fertig · ${fmtMB(blob.size)}`);
    await offerFile(`zeltbuch-zeitraffer-${slug(run.name)}.webm`,blob,'Zeitraffer gespeichert');
  }catch(e){console.error(e);msg('Video konnte nicht erstellt werden.');}
  U.tl.busy=false;const b=$('[data-act=tlExport]');if(b)b.disabled=false;
}

/* ================= Cloud-Sync (Supabase) =================
   - Die Bibliothek wird erst geladen, wenn ein Profil die Cloud nutzt (schnellerer Start).
   - Jede Anmeldung gehört zu genau einem lokalen Profil (eigener Sitzungsspeicher je Profil) –
     vorher konnten Daten eines Profils in das Konto eines anderen Profils wandern.
   - Seitenweises Laden (Supabase liefert max. 1000 Zeilen pro Abfrage), inkrementell seit dem letzten Abgleich.
   - Löschungen werden als Markierung synchronisiert, Konflikte nach Änderungszeit (_mt) aufgelöst.
   - Änderungen werden gesammelt und gebündelt hochgeladen; bei Fehlern später erneut versucht. */
const SB_URL='https://eertbwiiovzgjwrzvzrs.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVlcnRid2lpb3Z6Z2p3cnp2enJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0OTg4NjIsImV4cCI6MjEwNjA3NDg2Mn0.jpdTLNPC1PF2UWcfktInHhfPLPco9xTWcXV5dAT9Rkw';
const SB_LIB='vendor/supabase-2.117.2.js';
/* Fotos/Videos bleiben lokal – deshalb auch keine Foto-Metadaten synchronisieren (sonst leere Kacheln auf dem Zweitgerät). */
const SYNC_STORES=['setups','runs','plants','entries','plans','feeds','climate','tasks','steer','strains','expenses','meters'];
let sb=null,sbPid=null,sbUser=null,sbBusy=false,sbLastErr='',sbPushTimer=null,sbGen=0;
const sbQueue=new Set();
const cloudMeta=()=>{META.cloud=META.cloud||{};return META.cloud;};
function sbLoadLib(){
  if(window.supabase)return Promise.resolve();
  if(sbLoadLib.p)return sbLoadLib.p;
  return sbLoadLib.p=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=SB_LIB;sc.async=true;sc.onload=()=>res();sc.onerror=()=>{sbLoadLib.p=null;rej(new Error('Cloud-Bibliothek konnte nicht geladen werden'));};document.head.appendChild(sc);});
}
function sbStop(){sbGen++;if(sb){try{sb.auth.stopAutoRefresh();}catch(e){}}sb=null;sbPid=null;sbUser=null;sbQueue.clear();clearTimeout(sbPushTimer);}
async function sbInit(pid=PID(),force=false){
  if(U.locked||!pid)return;
  if(sb&&sbPid===pid)return;
  sbStop();
  if(!force&&!cloudMeta()[pid])return;
  try{await sbLoadLib();}catch(e){sbLastErr=e.message;return;}
  if(U.locked||PID()!==pid)return;
  const gen=++sbGen;
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'zb-sb-'+pid}});}catch(e){console.error(e);sb=null;return;}
  sbPid=pid;
  sb.auth.onAuthStateChange((ev,session)=>{
    if(gen!==sbGen)return;
    const was=sbUser?.id;sbUser=session?.user||null;
    if(sbUser&&sbUser.id!==was){
      const cm=cloudMeta()[pid];
      cloudMeta()[pid]={email:sbUser.email,uid:sbUser.id,since:cm&&cm.uid===sbUser.id?cm.since:null,last:cm?.last||null};saveMeta();
      setTimeout(()=>sbPullAll(),0); /* nicht im Callback selbst awaiten (Supabase-Empfehlung) */
    }
    if(U.screen==='settings')render();
  });
}
async function sbSignUp(email,pass){
  await sbInit(PID(),true);if(!sb)return sbLastErr||'Cloud-Dienst nicht verfügbar';
  const{error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}});
  return error?error.message:'';
}
async function sbSignIn(email,pass){
  await sbInit(PID(),true);if(!sb)return sbLastErr||'Cloud-Dienst nicht verfügbar';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  return error?(/invalid login/i.test(error.message)?'E-Mail oder Passwort falsch – oder die E-Mail wurde noch nicht bestätigt.':error.message):'';
}
async function sbSignOut(){
  const pid=PID();
  try{await sbFlushPush();}catch(e){}
  if(sb){try{await sb.auth.signOut({scope:'local'});}catch(e){}}
  delete cloudMeta()[pid];saveMeta();sbStop();
  try{localStorage.removeItem('zb-sb-'+pid);}catch(e){}
  render();
}
function sbQueuePush(store,id){
  if(U.noPush||!sbUser||!sb||sbPid!==PID())return;
  sbQueue.add(store+'::'+id);
  clearTimeout(sbPushTimer);sbPushTimer=setTimeout(sbFlushPush,1200);
}
const syncData=o=>{const{pid,_syncedAt,...rest}=o;return rest;};
async function sbFlushPush(force=false){
  if(!sbUser||!sb||!sbQueue.size||(U.locked&&!force)||sbPid!==PID())return;
  clearTimeout(sbPushTimer);
  const items=[...sbQueue];sbQueue.clear();
  const now=new Date().toISOString(),uidv=sbUser.id;
  const rows=items.map(k=>{const i=k.indexOf('::'),store=k.slice(0,i),id=k.slice(i+2),o=byId(store,id);
    return {store,id,user_id:uidv,updated_at:now,data:o?syncData(o):{_del:1,_mt:Date.now()}};});
  for(let i=0;i<rows.length;i+=200){
    const chunk=rows.slice(i,i+200);
    let error=null;try{({error}=await sb.from('records').upsert(chunk,{onConflict:'store,id,user_id'}));}catch(e){error=e;}
    if(error){
      console.error('cloud push',error);sbLastErr=error.message||String(error);
      rows.slice(i).forEach(r=>sbQueue.add(r.store+'::'+r.id));
      sbPushTimer=setTimeout(sbFlushPush,30000);
      return;
    }
  }
  sbLastErr='';
}
async function sbPullAll(full=false){
  if(!sbUser||!sb||sbBusy||U.locked||sbPid!==PID())return;
  const pid=PID(),cm=cloudMeta()[pid]||{};
  sbBusy=true;if(U.screen==='settings')render();
  let n=0,maxT=full?null:(cm.since||null);
  try{
    await sbFlushPush();
    const since=!full&&cm.since?new Date(Date.parse(cm.since)-600000).toISOString():null; /* 10 Min. Überlappung gegen Uhrzeit-Abweichungen */
    for(let from=0;from<200000;from+=1000){
      let q=sb.from('records').select('store,id,data,updated_at').eq('user_id',sbUser.id);
      if(since)q=q.gt('updated_at',since);
      const{data,error}=await q.order('updated_at',{ascending:true}).order('store').order('id').range(from,from+999);
      if(error)throw error;
      for(const row of data||[]){
        if(!maxT||row.updated_at>maxT)maxT=row.updated_at;
        if(!SYNC_STORES.includes(row.store))continue;
        const d=row.data||{},local=byId(row.store,row.id);
        const rt=+d._mt||Date.parse(row.updated_at)||0,lt=local?(+local._mt||0):0;
        if(local&&lt>=rt)continue;
        if(d._del){if(local){remove(row.store,row.id,true);n++;}continue;}
        save(row.store,{...d,id:row.id,pid},true);n++;
      }
      if(!data||data.length<1000)break;
    }
    await flush();
    cloudMeta()[pid]={...cm,email:sbUser.email,uid:sbUser.id,since:maxT,last:new Date().toISOString()};saveMeta();
    sbLastErr='';
    if(n)toast(`Cloud: ${plural(n,'Änderung','Änderungen')} übernommen`);else if(full)toast('Cloud ist auf dem neuesten Stand');
  }catch(e){console.error('cloud pull',e);sbLastErr=e.message||String(e);}
  sbBusy=false;
  if(n||U.screen==='settings')render();
}

/* save/remove erweitern: Änderungszeit setzen und in die Cloud-Warteschlange legen (skip = aus der Cloud kommend / intern) */
(()=>{
  const _save=save,_remove=remove;
  save=(store,obj,skip)=>{const sync=SYNC_STORES.includes(store)&&obj&&obj.id;if(sync&&!skip)obj._mt=Date.now();const r=_save(store,obj);if(sync&&!skip)sbQueuePush(store,obj.id);return r;};
  remove=(store,id,skip)=>{const r=_remove(store,id);if(!skip&&SYNC_STORES.includes(store))sbQueuePush(store,id);return r;};
})();
